<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CheryChat</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07030f;
    --header:#120a22;
    --card:#120a22;
    --card2:#0d071b;
    --text:#ffffff;
    --muted:#9993a5;
    --border:rgba(255,255,255,.09);
    --gold:#ffd54a;
    --gold2:#ff9e00;
    --green:#22c55e;
    --red:#ef4444;
}

body.light{
    --bg:#f5f7fa;
    --header:#ffffff;
    --card:#ffffff;
    --card2:#f0f2f5;
    --text:#111827;
    --muted:#667085;
    --border:#e1e5eb;
    --gold:#b8860b;
    --gold2:#d4af37;
    --green:#16a34a;
    --red:#dc2626;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    padding-bottom:75px;
}

/* HEADER */

.header{
    height:65px;
    padding:0 12px;

    display:grid;
    grid-template-columns:45px 1fr 45px;
    align-items:center;

    background:var(--header);
    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:50;
}

.menu-button,
.header-icon{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--text);
    font-size:18px;
    cursor:pointer;
}

.logo{
    color:var(--gold);
    font-size:21px;
    font-weight:800;
    text-align:center;
}

.header-right{
    display:flex;
    justify-content:flex-end;
}

/* MAIN */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}

/* SEARCH */

.search-box{
    padding:10px 13px;
    background:var(--bg);
}

.search{
    height:44px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:0 14px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:22px;
}

.search-icon{
    color:var(--muted);
    font-size:15px;
}

.search input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:12px;
}

.search input::placeholder{
    color:var(--muted);
}

/* SEARCH RESULTS */

.search-results{
    padding:0 13px 10px;
    background:var(--bg);
}

.search-result{
    width:100%;

    display:flex;
    align-items:center;
    gap:12px;

    padding:11px 8px;

    background:var(--card);

    border-bottom:1px solid var(--border);

    cursor:pointer;
}

.search-result:first-child{
    border-radius:12px 12px 0 0;
}

.search-result:last-child{
    border-radius:0 0 12px 12px;
    border-bottom:0;
}

.result-avatar,
.chat-avatar,
.menu-avatar{
    flex-shrink:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );

    color:#160b00;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;
}

.result-avatar{
    width:42px;
    height:42px;
    font-size:12px;
}

.result-info{
    min-width:0;
    flex:1;
}

.result-name{
    font-size:12px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.result-about{
    color:var(--muted);
    font-size:9px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    margin-top:2px;
}

.result-status{
    font-size:9px;
    color:var(--muted);
}

.result-status.online{
    color:var(--green);
}

.search-message{
    padding:18px;
    text-align:center;
    color:var(--muted);
    font-size:10px;
}

/* TABS */

.tabs{
    display:flex;
    gap:8px;

    padding:5px 13px 12px;

    background:var(--bg);

    overflow-x:auto;
    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    border:1px solid var(--border);

    background:var(--card);
    color:var(--muted);

    padding:7px 14px;

    border-radius:18px;

    font-family:inherit;
    font-size:10px;

    white-space:nowrap;
    cursor:pointer;
}

.tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#160b00;
    font-weight:700;
}

/* CONVERSATIONS */

.conversations{
    padding:0 13px 20px;
}

.conversation-item{
    display:flex;
    align-items:center;
    gap:12px;

    padding:13px 8px;

    background:var(--card);

    border-bottom:1px solid var(--border);

    cursor:pointer;
}

.conversation-item:first-child{
    border-radius:12px 12px 0 0;
}

.conversation-item:last-child{
    border-radius:0 0 12px 12px;
    border-bottom:0;
}

.conversation-avatar{
    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );

    color:#160b00;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:800;
}

.conversation-info{
    min-width:0;
    flex:1;
}

.conversation-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.conversation-name{
    font-size:12px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:var(--muted);
    font-size:8px;
    white-space:nowrap;
}

.conversation-preview{
    margin-top:4px;

    color:var(--muted);

    font-size:9px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--gold);
}

/* EMPTY CHAT */

.empty-chat{
    min-height:calc(100vh - 220px);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;
}

.empty-content{
    max-width:300px;
}

.empty-icon{
    width:78px;
    height:78px;

    margin:0 auto 18px;

    border-radius:50%;

    background:var(--card);

    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--gold);

    font-size:30px;
}

.empty-content h2{
    font-size:17px;
    margin-bottom:7px;
}

.empty-content p{
    color:var(--muted);
    font-size:11px;
    line-height:1.7;
}

/* CHAT SCREEN */

.chat-screen{
    position:fixed;
    inset:0;

    background:var(--bg);

    z-index:200;

    display:none;

    flex-direction:column;
}

.chat-screen.show{
    display:flex;
}

.chat-header{
    height:65px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    gap:10px;

    padding:0 10px;

    background:var(--header);

    border-bottom:1px solid var(--border);
}

.chat-back{
    width:40px;
    height:40px;

    border:0;
    background:transparent;

    color:var(--text);

    font-size:18px;

    cursor:pointer;
}

.chat-avatar{
    width:42px;
    height:42px;

    font-size:12px;
}

.chat-user-info{
    min-width:0;
    flex:1;
}

.chat-user-name{
    font-size:13px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-user-status{
    font-size:9px;
    color:var(--muted);
}

.chat-user-status.online{
    color:var(--green);
}

.chat-more{
    width:40px;
    height:40px;

    border:0;
    background:transparent;

    color:var(--text);

    cursor:pointer;
}

/* MESSAGES */

.messages{
    flex:1;

    overflow-y:auto;

    padding:16px 12px 20px;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.message-row{
    width:100%;

    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.theirs{
    justify-content:flex-start;
}

.message-bubble{
    max-width:78%;

    padding:9px 12px;

    border-radius:16px;

    font-size:11px;

    line-height:1.5;

    word-break:break-word;
}

.mine .message-bubble{
    background:linear-gradient(
        135deg,
        var(--gold),
        var(--gold2)
    );

    color:#160b00;

    border-bottom-right-radius:4px;
}

.theirs .message-bubble{
    background:var(--card);

    border:1px solid var(--border);

    color:var(--text);

    border-bottom-left-radius:4px;
}

.message-time{
    display:block;

    margin-top:3px;

    font-size:7px;

    opacity:.65;

    text-align:right;
}

.message-status{
    margin-left:4px;
}

.chat-loading,
.chat-empty{
    margin:auto;

    text-align:center;

    color:var(--muted);

    font-size:10px;
}

/* MESSAGE INPUT */

.message-form{
    flex-shrink:0;

    display:flex;
    align-items:flex-end;
    gap:8px;

    padding:9px 10px;

    background:var(--header);

    border-top:1px solid var(--border);

    padding-bottom:calc(
        9px + env(safe-area-inset-bottom)
    );
}

.message-input{
    flex:1;

    min-height:42px;
    max-height:110px;

    resize:none;

    border:1px solid var(--border);
    border-radius:21px;

    outline:0;

    background:var(--card);

    color:var(--text);

    padding:11px 14px;

    font-family:inherit;
    font-size:11px;
}

.message-input::placeholder{
    color:var(--muted);
}

.send-button{
    width:42px;
    height:42px;

    flex-shrink:0;

    border:0;
    border-radius:50%;

    background:var(--gold);

    color:#160b00;

    cursor:pointer;

    font-size:15px;
}

.send-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* SIDE MENU */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    z-index:100;

    display:none;
}

.overlay.show{
    display:block;
}

.side-menu{
    position:fixed;

    left:-310px;
    top:0;

    width:290px;
    max-width:85%;

    height:100vh;

    background:var(--card);

    border-right:1px solid var(--border);

    z-index:150;

    transition:.25s;

    overflow-y:auto;
}

.side-menu.open{
    left:0;
}

.menu-header{
    padding:22px 18px;
    border-bottom:1px solid var(--border);
}

.menu-logo{
    color:var(--gold);
    font-size:22px;
    font-weight:800;
}

.menu-profile{
    display:flex;
    align-items:center;
    gap:11px;

    padding:16px 18px;

    border-bottom:1px solid var(--border);
}

.menu-avatar{
    width:46px;
    height:46px;
    font-size:14px;
}

.menu-profile strong{
    display:block;
    font-size:13px;
}

.menu-profile span{
    color:var(--muted);
    font-size:9px;
}

.menu-list{
    padding:10px;
}

.menu-item{
    width:100%;
    min-height:46px;

    padding:10px 11px;

    display:flex;
    align-items:center;

    gap:13px;

    border:0;
    border-radius:10px;

    background:transparent;

    color:var(--text);

    font-family:inherit;
    font-size:12px;

    text-align:left;

    cursor:pointer;
}

.menu-item:hover{
    background:var(--card2);
}

.menu-icon{
    width:25px;
    text-align:center;
    font-size:16px;
}

.menu-item.logout{
    color:var(--red);
}

.theme-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 11px;
}

.theme-label{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:12px;
}

.switch{
    width:45px;
    height:24px;

    border-radius:20px;

    background:#34415f;

    padding:3px;

    cursor:pointer;
}

.switch span{
    display:block;

    width:18px;
    height:18px;

    border-radius:50%;

    background:#fff;

    transition:.2s;
}

body.light .switch{
    background:var(--gold);
}

body.light .switch span{
    transform:translateX(21px);
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:0;

    width:100%;
    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:var(--header);

    border-top:1px solid var(--border);

    z-index:80;
}

.nav-item{
    min-width:58px;

    color:var(--muted);

    text-decoration:none;

    text-align:center;

    font-size:9px;
}

.nav-icon{
    display:block;
    font-size:18px;
    margin-bottom:3px;
}

.nav-item.active{
    color:var(--gold);
}

@media(min-width:700px){

    .container{
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
        min-height:calc(100vh - 65px);
    }

    .bottom-nav{
        max-width:650px;
        left:50%;
        transform:translateX(-50%);
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
        border-radius:18px 18px 0 0;
    }

    .chat-screen{
        max-width:650px;
        left:50%;
        transform:translateX(-50%);
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
    }
}

const API_URL =
"https://cherychat-backend.onrender.com";

let currentUser = null;
let activeConversation = null;
let activeChatUser = null;
let messageRefreshTimer = null;

let searchTimer = null;


/* =========================
   LOAD USER
========================= */

function loadUser(){

    const saved =
        localStorage.getItem(
            "cheryChatCurrentUser"
        );

    if(!saved){

        window.location.href =
            "login.html";

        return false;

    }

    try{

        currentUser =
            JSON.parse(saved);

        const name =
            currentUser.fullName ||
            "User";

        document.getElementById(
            "menuName"
        ).textContent = name;

        document.getElementById(
            "menuAvatar"
        ).textContent =
            getInitials(name);

        return true;

    }catch(error){

        localStorage.removeItem(
            "cheryChatCurrentUser"
        );

        window.location.href =
            "login.html";

        return false;

    }

}


/* =========================
   MENU
========================= */

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("show");

}

function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* =========================
   SEARCH
========================= */

function toggleSearch(){

    const box =
        document.getElementById("searchBox");

    const input =
        document.getElementById("searchInput");

    const results =
        document.getElementById("searchResults");

    if(box.style.display === "none"){

        box.style.display = "block";

        input.focus();

    }else{

        box.style.display = "none";

        input.value = "";

        results.style.display = "none";

        results.innerHTML = "";

    }

}


document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        const query =
            this.value.trim();

        clearTimeout(searchTimer);

        if(query.length < 2){

            const results =
                document.getElementById(
                    "searchResults"
                );

            results.style.display =
                "none";

            results.innerHTML = "";

            return;

        }

        searchTimer =
            setTimeout(
                () => searchUsers(query),
                300
            );

    }
);


/* =========================
   SEARCH USERS
========================= */

async function searchUsers(query){

    const results =
        document.getElementById(
            "searchResults"
        );

    results.style.display =
        "block";

    results.innerHTML = `
        <div class="search-message">
            Searching...
        </div>
    `;

    try{

        const response =
            await fetch(
                `${API_URL}/api/users/search?q=${encodeURIComponent(query)}`
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Search failed"
            );

        }

        const users =
            data.users.filter(
                user =>
                    String(user.id) !==
                    String(currentUser.id)
            );

        if(users.length === 0){

            results.innerHTML = `
                <div class="search-message">
                    No CheryChat users found
                </div>
            `;

            return;

        }

        results.innerHTML =
            users.map(
                user => {

                    const name =
                        user.fullName ||
                        "CheryChat User";

                    const initials =
                        getInitials(name);

                    const about =
                        user.about ||
                        "Hey there! I am using CheryChat.";

                    return `

                    <div
                        class="search-result"
                        onclick='openChatWithUser(${JSON.stringify(user)})'
                    >

                        <div class="result-avatar">

                            ${
                                user.profilePicture
                                ?
                                `<img
                                    src="${escapeHtml(user.profilePicture)}"
                                    style="width:100%;height:100%;object-fit:cover;border-radius:50%;"
                                >`
                                :
                                initials
                            }

                        </div>

                        <div class="result-info">

                            <div class="result-name">
                                ${escapeHtml(name)}
                            </div>

                            <div class="result-about">
                                ${escapeHtml(about)}
                            </div>

                        </div>

                        <div
                            class="result-status ${
                                user.isOnline
                                ? "online"
                                : ""
                            }"
                        >
                            ${
                                user.isOnline
                                ? "Online"
                                : "Offline"
                            }
                        </div>

                    </div>

                    `;

                }
            ).join("");

    }catch(error){

        console.error(
            "SEARCH ERROR:",
            error
        );

        results.innerHTML = `
            <div class="search-message">
                Unable to search users.
            </div>
        `;

    }

}


/* =========================
   OPEN CHAT
========================= */

async function openChatWithUser(user){

    if(!currentUser){
        return;
    }

    activeChatUser = user;

    document.getElementById(
        "chatUserName"
    ).textContent =
        user.fullName || "User";

    document.getElementById(
        "chatUserStatus"
    ).textContent =
        user.isOnline
        ? "Online"
        : "Offline";

    document.getElementById(
        "chatUserStatus"
    ).className =
        user.isOnline
        ? "chat-user-status online"
        : "chat-user-status";

    document.getElementById(
        "chatAvatar"
    ).textContent =
        getInitials(
            user.fullName || "User"
        );

    document.getElementById(
        "chatScreen"
    ).classList.add("show");

    document.getElementById(
        "searchResults"
    ).style.display = "none";

    document.getElementById(
        "searchInput"
    ).value = "";

    try{

        const response =
            await fetch(
                `${API_URL}/api/conversations`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        userId:
                            currentUser.id,

                        otherUserId:
                            user.id

                    })

                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to start conversation"
            );

        }

        activeConversation =
            data.conversation;

        await loadMessages();

        await markMessagesRead();

        startMessageRefresh();

    }catch(error){

        console.error(
            "OPEN CHAT ERROR:",
            error
        );

        document.getElementById(
            "messages"
        ).innerHTML = `
            <div class="chat-empty">
                Unable to open conversation.
            </div>
        `;

    }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

    if(!activeConversation){
        return;
    }

    try{

        const response =
            await fetch(
                `${API_URL}/api/messages/${activeConversation.id}?userId=${encodeURIComponent(currentUser.id)}`
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load messages"
            );

        }

        renderMessages(
            data.messages || []
        );

    }catch(error){

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );

        document.getElementById(
            "messages"
        ).innerHTML = `
            <div class="chat-empty">
                Unable to load messages.
            </div>
        `;

    }

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(messages){

    const box =
        document.getElementById(
            "messages"
        );

    if(messages.length === 0){

        box.innerHTML = `
            <div class="chat-empty">
                Say hello 👋
            </div>
        `;

        return;

    }

    box.innerHTML =
        messages.map(
            message => {

                const mine =
                    Number(message.senderId) ===
                    Number(currentUser.id);

                const time =
                    formatTime(
                        message.createdAt
                    );

                return `

                    <div
                        class="message-row ${
                            mine
                            ? "mine"
                            : "theirs"
                        }"
                    >

                        <div class="message-bubble">

                            ${escapeHtml(
                                message.message
                            )}

                            <span class="message-time">

                                ${time}

                                ${
                                    mine
                                    ?
                                    `<span class="message-status">
                                        ${
                                            message.isRead
                                            ? "✓✓"
                                            : "✓"
                                        }
                                    </span>`
                                    :
                                    ""
                                }

                            </span>

                        </div>

                    </div>

                `;

            }
        ).join("");

    box.scrollTop =
        box.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

document
.getElementById("messageForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const input =
            document.getElementById(
                "messageInput"
            );

        const button =
            document.getElementById(
                "sendButton"
            );

        const message =
            input.value.trim();

        if(
            !message ||
            !activeConversation ||
            !currentUser
        ){

            return;

        }

        button.disabled = true;

        try{

            const response =
                await fetch(
                    `${API_URL}/api/messages`,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            conversationId:
                                activeConversation.id,

                            senderId:
                                currentUser.id,

                            message:
                                message

                        })

                    }
                );

            const data =
                await response.json();

            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Unable to send message"
                );

            }

            input.value = "";

            await loadMessages();

        }catch(error){

            console.error(
                "SEND MESSAGE ERROR:",
                error
            );

            alert(
                error.message ||
                "Unable to send message"
            );

        }finally{

            button.disabled = false;

            input.focus();

        }

    }
);


/* =========================
   MARK READ
========================= */

async function markMessagesRead(){

    if(!activeConversation){
        return;
    }

    try{

        await fetch(
            `${API_URL}/api/messages/read`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    conversationId:
                        activeConversation.id,

                    userId:
                        currentUser.id

                })

            }
        );

    }catch(error){

        console.error(
            "MARK READ ERROR:",
            error
        );

    }

}


/* =========================
   MESSAGE REFRESH
========================= */

function startMessageRefresh(){

    stopMessageRefresh();

    messageRefreshTimer =
        setInterval(
            async () => {

                if(
                    activeConversation &&
                    document
                    .getElementById(
                        "chatScreen"
                    )
                    .classList.contains(
                        "show"
                    )
                ){

                    await loadMessages();

                    await markMessagesRead();

                }

            },
            3000
        );

}


function stopMessageRefresh(){

    if(messageRefreshTimer){

        clearInterval(
            messageRefreshTimer
        );

        messageRefreshTimer =
            null;

    }

}


/* =========================
   CLOSE CHAT
========================= */

function closeChat(){

    stopMessageRefresh();

    activeConversation =
        null;

    activeChatUser =
        null;

    document
        .getElementById("chatScreen")
        .classList.remove("show");

}


/* =========================
   HELPERS
========================= */

function getInitials(name){

    const words =
        String(name)
        .trim()
        .split(/\s+/);

    if(words.length >= 2){

        return (
            words[0][0] +
            words[1][0]
        ).toUpperCase();

    }

    return String(name)
        .substring(0,2)
        .toUpperCase();

}


function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatTime(value){

    try{

        const date =
            new Date(value);

        return date.toLocaleTimeString(
            [],
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "";

    }

}


/* =========================
   THEME
========================= */

function applyTheme(){

    const theme =
        localStorage.getItem(
            "cheryChatTheme"
        ) || "dark";

    document.body.classList.toggle(
        "light",
        theme === "light"
    );

}


function toggleTheme(){

    const isLight =
        document.body.classList.contains(
            "light"
        );

    localStorage.setItem(
        "cheryChatTheme",
        isLight
        ? "dark"
        : "light"
    );

    applyTheme();

}


/* =========================
   LOGOUT
========================= */

function logout(){

    stopMessageRefresh();

    localStorage.removeItem(
        "cheryChatLoggedIn"
    );

    localStorage.removeItem(
        "cheryChatCurrentUser"
    );

    window.location.href =
        "login.html";

}


/* =========================
   START
========================= */

if(loadUser()){

    applyTheme();

}
