<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>VibeChat</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#120a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="./icon-192.png">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #07030f;
    --card: #120a22;
    --card2: #180d2d;
    --gold: #ffd54a;
    --orange: #ff9e00;
    --white: #ffffff;
    --muted: #9d96aa;
    --green: #22c55e;
    --red: #ef4444;
    --border: rgba(255,255,255,0.08);
}

body.light {
    --bg: #f6f4f9;
    --card: #ffffff;
    --card2: #f0edf5;
    --gold: #d99b00;
    --orange: #ed8500;
    --white: #17131d;
    --muted: #6d6678;
    --border: rgba(0,0,0,0.08);
}

body {
    font-family: "Poppins", sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
}

/* =====================================================
   HEADER
===================================================== */

.header {
    height: 68px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
}

.menu-button,
.header-button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--white);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-button:active,
.header-button:active {
    background: rgba(255,255,255,0.08);
}

.logo {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 50%;
    margin-left: 4px;
}

.brand {
    font-size: 20px;
    font-weight: 700;
    margin-left: 9px;
    color: var(--gold);
    flex: 1;
}

.header-button {
    margin-left: auto;
}

/* =====================================================
   MAIN
===================================================== */

.main {
    padding-top: 68px;
    padding-bottom: 75px;
    min-height: 100vh;
}

.page {
    display: none;
    padding: 15px;
}

.page.active {
    display: block;
}

/* =====================================================
   SEARCH
===================================================== */

.search-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.search-box i {
    color: var(--muted);
}

.search-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--white);
    font-family: inherit;
    font-size: 14px;
}

.search-box input::placeholder {
    color: var(--muted);
}

/* =====================================================
   SECTION TITLE
===================================================== */

.section-title {
    font-size: 17px;
    font-weight: 600;
    margin: 12px 2px;
}

/* =====================================================
   LIST
===================================================== */

.list {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 8px;
    border-radius: 14px;
    cursor: pointer;
}

.list-item:hover {
    background: var(--card);
}

.list-item:active {
    background: var(--card2);
}

.avatar-wrap {
    width: 52px;
    height: 52px;
    position: relative;
    flex-shrink: 0;
}

.avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--card2);
}

.online-dot {
    position: absolute;
    right: 1px;
    bottom: 1px;
    width: 14px;
    height: 14px;
    background: var(--green);
    border: 3px solid var(--bg);
    border-radius: 50%;
}

.item-info {
    min-width: 0;
    flex: 1;
}

.item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.item-name {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.item-time {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
}

.item-bottom {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 3px;
}

.item-preview {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =====================================================
   EMPTY
===================================================== */

.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
}

.empty-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 27px;
}

.empty h3 {
    color: var(--white);
    font-size: 16px;
    margin-bottom: 7px;
}

.empty p {
    font-size: 12px;
    line-height: 1.6;
}

/* =====================================================
   SEARCH RESULTS
===================================================== */

.search-results {
    background: var(--card);
    border-radius: 15px;
    padding: 7px;
    margin-bottom: 15px;
}

.search-results:empty {
    display: none;
}

.user-result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 8px;
    border-radius: 12px;
    cursor: pointer;
}

.user-result:hover {
    background: var(--card2);
}

.user-result .avatar-wrap {
    width: 46px;
    height: 46px;
}

.user-result .avatar {
    width: 46px;
    height: 46px;
}

.user-result .online-dot {
    width: 12px;
    height: 12px;
    border-width: 2px;
}

/* =====================================================
   BUTTONS
===================================================== */

.primary-button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 13px;
    background: linear-gradient(
        135deg,
        var(--gold),
        var(--orange)
    );
    color: #160d00;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
}

.secondary-button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--white);
    border-radius: 12px;
    padding: 11px 15px;
    font-family: inherit;
    cursor: pointer;
}

.primary-button:active,
.secondary-button:active {
    transform: scale(0.98);
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 68px;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
}

.nav-item {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 4px;
    font-size: 10px;
}

.nav-item i {
    font-size: 19px;
}

.nav-item.active {
    color: var(--gold);
}

/* =====================================================
   DRAWER
===================================================== */

.drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 300;
    display: none;
}

.drawer-overlay.show {
    display: block;
}

.drawer {
    position: fixed;
    top: 0;
    left: -310px;
    width: 285px;
    max-width: 82%;
    height: 100vh;
    background: var(--card);
    z-index: 301;
    transition: left 0.25s ease;
    overflow-y: auto;
    box-shadow: 10px 0 40px rgba(0,0,0,0.3);
}

.drawer.show {
    left: 0;
}

.drawer-profile {
    padding: 35px 20px 20px;
    border-bottom: 1px solid var(--border);
}

.drawer-avatar {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 10px;
}

.drawer-name {
    font-size: 17px;
    font-weight: 600;
}

.drawer-about {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
}

.drawer-menu {
    padding: 10px;
}

.drawer-item {
    width: 100%;
    border: none;
    background: transparent;
    color: var(--white);
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 14px 13px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
}

.drawer-item i {
    width: 22px;
    color: var(--gold);
    text-align: center;
}

.drawer-item:hover {
    background: var(--card2);
}

.drawer-item.logout {
    color: #ff7373;
}

.drawer-item.logout i {
    color: #ff7373;
}

/* =====================================================
   MODAL
===================================================== */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 430px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--card);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 20px;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.modal-title {
    font-size: 17px;
    font-weight: 600;
}

.close-button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 21px;
    cursor: pointer;
}

.form-group {
    margin-bottom: 14px;
}

.form-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 7px;
}

.form-input,
.form-textarea,
.form-select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--white);
    border-radius: 11px;
    padding: 12px;
    outline: none;
    font-family: inherit;
    font-size: 13px;
}

.form-textarea {
    min-height: 90px;
    resize: vertical;
}

.form-input:focus,
.form-textarea:focus,
.form-select:focus {
    border-color: var(--gold);
}

/* =====================================================
   CHAT
===================================================== */

.chat-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 250;
    display: none;
    flex-direction: column;
}

.chat-overlay.show {
    display: flex;
}

.chat-header {
    height: 68px;
    flex-shrink: 0;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 10px;
}

.back-button {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    color: var(--white);
    font-size: 19px;
    cursor: pointer;
}

.chat-user-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
}

.chat-user-info {
    margin-left: 10px;
    flex: 1;
    min-width: 0;
}

.chat-user-name {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chat-user-status {
    color: var(--muted);
    font-size: 10px;
    margin-top: 2px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.message-row {
    display: flex;
    width: 100%;
}

.message-row.mine {
    justify-content: flex-end;
}

.message {
    max-width: 78%;
    padding: 9px 12px;
    border-radius: 14px;
    background: var(--card);
    font-size: 13px;
    line-height: 1.45;
    word-wrap: break-word;
}

.message-row.mine .message {
    background: linear-gradient(
        135deg,
        var(--gold),
        var(--orange)
    );
    color: #180e00;
    border-bottom-right-radius: 4px;
}

.message-row:not(.mine) .message {
    border-bottom-left-radius: 4px;
}

.message-time {
    display: block;
    text-align: right;
    font-size: 8px;
    margin-top: 3px;
    opacity: 0.65;
}

.chat-input-area {
    padding: 9px;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}

.chat-input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--white);
    border-radius: 22px;
    outline: none;
    padding: 11px 15px;
    font-family: inherit;
    font-size: 13px;
}

.send-button {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        var(--gold),
        var(--orange)
    );
    color: #180e00;
    cursor: pointer;
    font-size: 16px;
}

/* =====================================================
   GROUP CARDS
===================================================== */

.group-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 13px;
    margin-bottom: 9px;
    cursor: pointer;
}

.group-card-top {
    display: flex;
    gap: 12px;
    align-items: center;
}

.group-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: linear-gradient(
        135deg,
        var(--gold),
        var(--orange)
    );
    color: #180e00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.group-name {
    font-size: 14px;
    font-weight: 600;
}

.group-description {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
}

.group-meta {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
}

.create-group-button {
    position: fixed;
    right: 18px;
    bottom: 85px;
    width: 53px;
    height: 53px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        var(--gold),
        var(--orange)
    );
    color: #180e00;
    font-size: 20px;
    box-shadow: 0 7px 25px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 90;
}

/* =====================================================
   STORIES
===================================================== */

.story-list {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 5px 0 15px;
}

.story-list::-webkit-scrollbar {
    display: none;
}

.story-circle {
    flex-shrink: 0;
    width: 74px;
    text-align: center;
    cursor: pointer;
}

.story-avatar-wrap {
    width: 64px;
    height: 64px;
    margin: auto;
    padding: 2px;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        var(--gold),
        var(--orange)
    );
}

.story-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--bg);
}

.story-name {
    margin-top: 5px;
    font-size: 9px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.add-story {
    width: 64px;
    height: 64px;
    margin: auto;
    border-radius: 50%;
    border: 2px dashed var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 20px;
}

/* =====================================================
   STORY VIEWER
===================================================== */

.story-viewer {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 700;
    display: none;
    flex-direction: column;
}

.story-viewer.show {
    display: flex;
}

.story-viewer-header {
    height: 65px;
    display: flex;
    align-items: center;
    padding: 10px;
    gap: 10px;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    background: linear-gradient(
        rgba(0,0,0,0.6),
        transparent
    );
}

.story-viewer-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
}

.story-viewer-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
}

.story-close {
    border: none;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.story-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.story-content img,
.story-content video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.story-caption {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 35px;
    text-align: center;
    font-size: 14px;
    z-index: 2;
}

/* =====================================================
   PROFILE
===================================================== */

.profile-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 25px 18px;
    text-align: center;
}

.profile-picture-wrap {
    position: relative;
    width: 105px;
    height: 105px;
    margin: 0 auto 14px;
}

.profile-picture {
    width: 105px;
    height: 105px;
    object-fit: cover;
    border-radius: 50%;
}

.photo-button {
    position: absolute;
    right: 0;
    bottom: 2px;
    width: 34px;
    height: 34px;
    border: 3px solid var(--card);
    border-radius: 50%;
    background: var(--gold);
    color: #180e00;
    cursor: pointer;
}

.profile-name {
    font-size: 20px;
    font-weight: 600;
}

.profile-about {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.profile-detail {
    margin-top: 22px;
    text-align: left;
}

.detail-row {
    padding: 13px 2px;
    border-bottom: 1px solid var(--border);
}

.detail-label {
    color: var(--muted);
    font-size: 10px;
}

.detail-value {
    font-size: 13px;
    margin-top: 3px;
    word-break: break-word;
}

/* =====================================================
   TOAST
===================================================== */

.toast {
    position: fixed;
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%) translateY(20px);
    background: #20172d;
    color: white;
    padding: 11px 17px;
    border-radius: 10px;
    font-size: 11px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =====================================================
   LOADING
===================================================== */

.loading {
    text-align: center;
    padding: 35px;
    color: var(--muted);
    font-size: 12px;
}

.loading i {
    margin-right: 7px;
}

/* =====================================================
   FILE INPUT
===================================================== */

.file-input {
    display: none;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (min-width: 700px) {

    .main {
        max-width: 700px;
        margin: auto;
    }

    .bottom-nav {
        max-width: 700px;
        left: 50%;
        transform: translateX(-50%);
    }

    .create-group-button {
        right: calc(50% - 330px);
    }
}

</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Menu"
    >
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>

    <img
        src="./icon-192.png"
        class="logo"
        alt="VibeChat"
    >

    <div class="brand">
        VibeChat
    </div>

    <button
        class="header-button"
        id="refreshButton"
        aria-label="Refresh"
    >
        <i class="fa-solid fa-rotate"></i>
    </button>

</header>

<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

    <!-- CHATS -->

    <section
        class="page active"
        id="chatsPage"
    >

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="userSearch"
                placeholder="Search VibeChat users..."
                autocomplete="off"
            >
        </div>

        <div
            class="search-results"
            id="searchResults"
        ></div>

        <div class="section-title">
            Chats
        </div>

        <div
            class="list"
            id="conversationList"
        >
            <div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading chats...
            </div>
        </div>

    </section>


    <!-- GROUPS -->

    <section
        class="page"
        id="groupsPage"
    >

        <div class="search-box">

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
    "https://cherychat-backend.onrender.com";

let currentUser = null;
let currentChatUser = null;
let currentConversationId = null;

let messageRefreshTimer = null;
let onlineTimer = null;

let storyGroups = [];
let currentStoryGroup = null;
let currentStoryIndex = 0;


/* =====================================================
   LOCAL STORAGE
===================================================== */

function getStoredUser() {

    let stored =
        localStorage.getItem(
            "vibeChatCurrentUser"
        );

    if (!stored) {
        stored =
            localStorage.getItem(
                "cheryChatCurrentUser"
            );
    }

    if (!stored) {
        return null;
    }

    try {
        return JSON.parse(stored);
    } catch (error) {
        return null;
    }
}


function saveUser(user) {

    currentUser = user;

    localStorage.setItem(
        "vibeChatCurrentUser",
        JSON.stringify(user)
    );

    localStorage.setItem(
        "cheryChatCurrentUser",
        JSON.stringify(user)
    );
}


function getUserId() {

    if (!currentUser) {
        return null;
    }

    const id =
        currentUser.id ||
        currentUser.userId;

    const numberId =
        Number(id);

    if (
        Number.isInteger(numberId) &&
        numberId > 0
    ) {
        return numberId;
    }

    return null;
}


/* =====================================================
   API
===================================================== */

async function apiRequest(
    endpoint,
    options = {}
) {

    const config = {
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    };

    const response =
        await fetch(
            API_URL + endpoint,
            config
        );

    let data;

    try {
        data =
            await response.json();
    } catch (error) {
        throw new Error(
            "Server returned an invalid response."
        );
    }

    if (!response.ok || data.success === false) {

        throw new Error(
            data.message ||
            "Request failed."
        );
    }

    return data;
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toast._timer
    );

    toast._timer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 2800);
}


/* =====================================================
   AVATAR
===================================================== */

function avatarUrl(
    picture,
    name
) {

    if (picture) {
        return picture;
    }

    return (
        "https://ui-avatars.com/api/?" +
        "name=" +
        encodeURIComponent(
            name || "User"
        ) +
        "&background=120a22" +
        "&color=ffd54a" +
        "&bold=true"
    );
}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    const now =
        new Date();

    const sameDay =
        date.toDateString() ===
        now.toDateString();

    if (sameDay) {

        return date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );
    }

    return date.toLocaleDateString(
        [],
        {
            month: "short",
            day: "numeric"
        }
    );
}


/* =====================================================
   INITIAL USER
===================================================== */

function loadCurrentUser() {

    const user =
        getStoredUser();

    if (!user) {

        window.location.href =
            "login.html";

        return false;
    }

    currentUser =
        user;

    const id =
        getUserId();

    if (!id) {

        showToast(
            "Your login session is invalid. Please login again."
        );

        localStorage.removeItem(
            "vibeChatCurrentUser"
        );

        localStorage.removeItem(
            "cheryChatCurrentUser"
        );

        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 1200);

        return false;
    }

    saveUser(currentUser);

    return true;
}


/* =====================================================
   DRAWER USER
===================================================== */

function updateDrawerUser() {

    if (!currentUser) {
        return;
    }

    const name =
        currentUser.full_name ||
        currentUser.fullName ||
        "VibeChat User";

    const about =
        currentUser.about ||
        "using VibeChat";

    document.getElementById(
        "drawerName"
    ).textContent = name;

    document.getElementById(
        "drawerAbout"
    ).textContent = about;

    document.getElementById(
        "drawerAvatar"
    ).src =
        avatarUrl(
            currentUser.profile_picture ||
            currentUser.profilePicture,
            name
        );
}


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(
    pageId
) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove(
                "active"
            );

        });

    const page =
        document.getElementById(
            pageId
        );

    if (page) {
        page.classList.add(
            "active"
        );
    }

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.page ===
                pageId
            );

        });

    closeDrawer();

    if (pageId === "chatsPage") {
        loadConversations();
    }

    if (pageId === "groupsPage") {
        loadGroups();
    }

    if (pageId === "storiesPage") {
        loadStories();
    }

    if (pageId === "profilePage") {
        loadProfile();
    }
}


/* =====================================================
   DRAWER
===================================================== */

function openDrawer() {

    document
        .getElementById("drawer")
        .classList.add("show");

    document
        .getElementById("drawerOverlay")
        .classList.add("show");
}


function closeDrawer() {

    document
        .getElementById("drawer")
        .classList.remove("show");

    document
        .getElementById("drawerOverlay")
        .classList.remove("show");
}


/* =====================================================
   CONVERSATIONS
===================================================== */

async function loadConversations() {

    const list =
        document.getElementById(
            "conversationList"
        );

    const userId =
        getUserId();

    if (!userId) {
        return;
    }

    list.innerHTML = `
        <div class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i>
            Loading chats...
        </div>
    `;

    try {

        const data =
            await apiRequest(
                `/api/conversations?userId=${encodeURIComponent(userId)}`
            );

        const conversations =
            data.conversations ||
            [];

        if (!conversations.length) {

            list.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        <i class="fa-solid fa-message"></i>
                    </div>

                    <h3>
                        No conversations yet
                    </h3>

                    <p>
                        Search for another VibeChat user
                        above to start chatting.
                    </p>

                </div>
            `;

            return;
        }

        list.innerHTML = "";

        conversations.forEach(
            conversation => {

                const other =
                    conversation.otherUser ||
                    conversation.other_user ||
                    {};

                const name =
                    other.fullName ||
                    other.full_name ||
                    "VibeChat User";

                const picture =
                    other.profilePicture ||
                    other.profile_picture;

                const online =
                    other.isOnline ??
                    other.is_online ??
                    false;

                const lastMessage =
                    conversation.lastMessage ||
                    conversation.last_message ||
                    "Start chatting";

                const lastTime =
                    conversation.lastMessageTime ||
                    conversation.last_message_time;

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "list-item";

                item.innerHTML = `

                    <div class="avatar-wrap">

                        <img
                            class="avatar"
                            src="${avatarUrl(
                                picture,
                                name
                            )}"
                            alt=""
                        >

                        ${
                            online
                                ? `<span class="online-dot"></span>`
                                : ""
                        }

                    </div>

                    <div class="item-info">

                        <div class="item-top">

                            <div class="item-name">
                                ${escapeHtml(name)}
                            </div>

                            <div class="item-time">
                                ${formatTime(lastTime)}
                            </div>

                        </div>

                        <div class="item-bottom">

                            <div class="item-preview">
                                ${escapeHtml(lastMessage)}
                            </div>

                        </div>

                    </div>
                `;

                item.addEventListener(
                    "click",
                    () => {

                        openPrivateChat(
                            other
                        );

                    }
                );

                list.appendChild(
                    item
                );
            }
        );

    } catch (error) {

        console.error(
            "Load conversations error:",
            error
        );

        list.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h3>
                    Unable to load chats
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>
        `;
    }
}


/* =====================================================
   USER SEARCH
===================================================== */

let searchTimer = null;

document
    .getElementById("userSearch")
    .addEventListener(
        "input",
        function() {

            clearTimeout(
                searchTimer
            );

            const q =
                this.value.trim();

            const results =
                document.getElementById(
                    "searchResults"
                );

            if (!q) {

                results.innerHTML =
                    "";

                return;
            }

            searchTimer =
                setTimeout(
                    () => searchUsers(q),
                    350
                );
        }
    );


async function searchUsers(q) {

    const results =
        document.getElementById(
            "searchResults"
        );

    const userId =
        getUserId();

    if (!userId) {
        return;
    }

    results.innerHTML = `
        <div class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i>
            Searching...
        </div>
    `;

    try {

        const data =
            await apiRequest(
                `/api/users/search?q=${encodeURIComponent(q)}&userId=${encodeURIComponent(userId)}`
            );

        const users =
            data.users ||
            [];

        if (!users.length) {

            results.innerHTML = `
                <div class="loading">
                    No VibeChat users found.
                </div>
            `;

            return;
        }

        results.innerHTML = "";

        users.forEach(
            user => {

                const name =
                    user.fullName ||
                    user.full_name ||
                    "VibeChat User";

                const picture =
                    user.profilePicture ||
                    user.profile_picture;

                const about =
                    user.about ||
                    "using VibeChat";

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "user-result";

                item.innerHTML = `

                    <div class="avatar-wrap">

                        <img
                            class="avatar"
                            src="${avatarUrl(
                                picture,
                                name
                            )}"
                            alt=""
                        >

                        ${
                            user.isOnline ||
                            user.is_online
                                ? `<span class="online-dot"></span>`
                                : ""
                        }

                    </div>

                    <div class="item-info">

                        <div class="item-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="item-preview">
                            ${escapeHtml(about)}
                        </div>

                    </div>
                `;

                item.addEventListener(
                    "click",
                    () => {

                        results.innerHTML =
                            "";

                        document.getElementById(
                            "userSearch"
                        ).value = "";

                        openPrivateChat(
                            user
                        );

                    }
                );

                results.appendChild(
                    item
                );
            }
        );

    } catch (error) {

        results.innerHTML = `
            <div class="loading">
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}


/* =====================================================
   PRIVATE CHAT
===================================================== */

async function openPrivateChat(
    user
) {

    const userId =
        getUserId();

    const otherUserId =
        Number(
            user.id ||
            user.userId
        );

    if (!userId) {
        showToast(
            "Please login again."
        );
        return;
    }

    if (!otherUserId) {
        showToast(
            "This user has an invalid ID."
        );
        return;
    }

    if (
        userId ===
        otherUserId
    ) {
        showToast(
            "You cannot chat with yourself."
        );
        return;
    }

    currentChatUser =
        user;

    document.getElementById(
        "chatUserName"
    ).textContent =
        user.fullName ||
        user.full_name ||
        "VibeChat User";

    document.getElementById(
        "chatUserAvatar"
    ).src =
        avatarUrl(
            user.profilePicture ||
            user.profile_picture,
            user.fullName ||
            user.full_name
        );

    updateChatStatus(
        user
    );

    document.getElementById(
        "chatOverlay"
    ).classList.add("show");

    try {

        const data =
            await apiRequest(
                "/api/conversations",
                {
                    method: "POST",
                    body: JSON.stringify({
                        userId:
                            userId,
                        otherUserId:
                            otherUserId
                    })
                }
            );

        currentConversationId =
            data.conversation?.id ||
            data.conversation?.conversation_id ||
            null;

        await loadMessages();

        startMessagePolling();

    } catch (error) {

        showToast(
            error.message
        );
    }
}


function updateChatStatus(
    user
) {

    const online =
        user.isOnline ??
        user.is_online ??
        false;

    const status =
        document.getElementById(
            "chatUserStatus"
        );

    if (online) {

        status.textContent =
            "online";

        return;
    }

    const lastSeen =
        user.lastSeen ||
        user.last_seen;

    if (lastSeen) {

        status.textContent =
            "last seen " +
            formatTime(lastSeen);

    } else {

        status.textContent =
            "offline";
    }
}


function closePrivateChat() {

    document
        .getElementById(
            "chatOverlay"
        )
        .classList.remove("show");

    stopMessagePolling();

    currentChatUser =
        null;

    currentConversationId =
        null;

    document.getElementById(
        "messages"
    ).innerHTML = "";
}


async function loadMessages() {

    const userId =
        getUserId();

    if (
        !userId ||
        !currentChatUser
    ) {
        return;
    }

    const otherUserId =
        Number(
            currentChatUser.id ||
            currentChatUser.userId
        );

    if (!otherUserId) {
        return;
    }

    const messagesContainer =
        document.getElementById(
            "messages"
        );

    try {

        const data =
            await apiRequest(
                `/api/messages?userId=${encodeURIComponent(userId)}&otherUserId=${encodeURIComponent(otherUserId)}`
            );

        const messages =
            data.messages ||
            [];

        messagesContainer.innerHTML =
            "";

        if (!messages.length) {

            messagesContainer.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h3>
                        Start the conversation
                    </h3>
                    <p>
                        Send your first message.
                    </p>
                </div>
            `;

        } else {

            messages.forEach(
                message => {

                    const senderId =
                        Number(
                            message.sender_id ??
                            message.senderId
                        );

                    const mine =
                        senderId ===
                        userId;

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "message-row" +
                        (
                            mine
                                ? " mine"
                                : ""
                        );

                    const bubble =
                        document.createElement(
                            "div"
                        );

                    bubble.className =
                        "message";

                    bubble.innerHTML = `
                        ${escapeHtml(
                            message.message_text ??
                            message.messageText ??
                            ""
                        )}

                        <span class="message-time">
                            ${formatTime(
                                message.created_at ??
                                message.createdAt
                            )}
                        </span>
                    `;

                    row.appendChild(
                        bubble
                    );

                    messagesContainer.appendChild(
                        row
                    );
                }
            );
        }

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        await markMessagesRead();

    } catch (error) {

        console.error(
            "Load messages error:",
            error
        );

        if (
            !messagesContainer.children.length
        ) {

                        <i class="fa-solid fa-triangle-exclamation"></i>

                    </h3>
                    <p>

                        )}
                    </p>

            `;
        }
    }
}


async function markMessagesRead() {

    const userId =
        getUserId();

    if (
        !userId ||
        !currentChatUser
    ) {
        return;
    }

    const otherUserId =
        Number(
            currentChatUser.id ||
            currentChatUser.userId
        );

    if (!otherUserId) {
        return;
    }

    try {

        await apiRequest(
            "/api/messages/read",
            {
                method: "PUT",
                body: JSON.stringify({
                    userId,
                    otherUserId
                })
            }
        );

    } catch (error) {

        console.log(
            "Read status error:",
            error.message
        );
    }
}


async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const messageText =
        input.value.trim();

    const senderId =
        getUserId();

    if (
        !messageText ||
        !senderId ||
        !currentChatUser
    ) {
        return;
    }

    const receiverId =
        Number(
            currentChatUser.id ||
            currentChatUser.userId
        );

    if (!receiverId) {
        showToast(
            "Invalid receiver."
        );
        return;
    }

    input.value = "";

    try {

        await apiRequest(
            "/api/messages",
            {
                method: "POST",
                body: JSON.stringify({
                    senderId,
                    receiverId,
                    messageText
                })
            }
        );

        await loadMessages();

    } catch (error) {

        input.value =
            messageText;

        showToast(
            error.message
        );
    }
}


function startMessagePolling() {

    stopMessagePolling();

    messageRefreshTimer =
        setInterval(
            () => {

                if (
                    currentChatUser &&
                    document
                        .getElementById(
                            "chatOverlay"
                        )
                        .classList.contains(
                            "show"
                        )
                ) {
                    loadMessages();
                }

            },
            3000
        );
}


function stopMessagePolling() {

    if (
        messageRefreshTimer
    ) {

        clearInterval(
            messageRefreshTimer
        );

        messageRefreshTimer =
            null;
    }
}

async function loadGroups(
    search = ""
) {

    const container =
        document.getElementById(
            "groupsList"
        );

    const userId =
        getUserId();

    if (!userId) {
        return;
    }

    container.innerHTML = `
        <div class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i>
            Loading groups...
        </div>
    `;

    try {

        let endpoint =
            `/api/groups?userId=${encodeURIComponent(userId)}`;

        if (search) {

            endpoint +=
                `&q=${encodeURIComponent(search)}`;
        }

        const data =
            await apiRequest(
                endpoint
            );

        const groups =
            data.groups ||
            [];

        if (!groups.length) {

            container.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <h3>
                        No groups found
                    </h3>

                    <p>
                        Create a group and start vibing.
                    </p>

                </div>
            `;

            return;
        }

        container.innerHTML = "";

        groups.forEach(
            group => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "group-card";

                const fee =
                    Number(
                        group.join_fee ||
                        group.joinFee ||
                        0
                    );

                const privateGroup =
                    group.is_private ||
                    group.isPrivate;

                card.innerHTML = `

                    <div class="group-card-top">

                        <div class="group-icon">
                            <i class="fa-solid fa-users"></i>
                        </div>

                        <div class="item-info">

                            <div class="group-name">
                                ${escapeHtml(
                                    group.name
                                )}
                            </div>

                            <div class="group-description">
                                ${escapeHtml(
                                    group.description ||
                                    "Vibe with the community"
                                )}
                            </div>

                        </div>

                    </div>

                    <div class="group-meta">

                        <span>
                            <i class="fa-solid fa-user-group"></i>
                            ${Number(
                                group.member_count ||
                                group.memberCount ||
                                0
                            )} members
                        </span>

                        <span>
                            ${
                                privateGroup
                                    ? `<i class="fa-solid fa-lock"></i> Private`
                                    : `<i class="fa-solid fa-earth-africa"></i> Public`
                            }
                        </span>

                        ${
                            fee > 0
                                ? `<span>
                                    KSh ${fee}
                                   </span>`
                                : ""
                        }

                    </div>
                `;

                card.addEventListener(
                    "click",
                    () => {

                        openGroup(
                            group.id
                        );

                    }
                );

                container.appendChild(
                    card
                );
            }
        );

    } catch (error) {

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h3>
                    Unable to load groups
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>
        `;
    }
}

async function loadGroupMessages(
    groupId
) {

    const userId =
        getUserId();

    const container =
        document.getElementById(
            "groupMessages"
        );

    if (!container) {
        return;
    }

    try {

        const data =
            await apiRequest(
                `/api/groups/${encodeURIComponent(groupId)}/messages?userId=${encodeURIComponent(userId)}`
            );

        const messages =
            data.messages ||
            [];

        container.innerHTML =
            "";

        if (!messages.length) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No messages yet</h3>
                    <p>Start the group conversation.</p>
                </div>
            `;

        } else {

            messages.forEach(
                message => {

                    const mine =
                        Number(
                            message.sender_id
                        ) ===
                        userId;

                    const div =
                        document.createElement(
                            "div"
                        );

                    div.style.marginBottom =
                        "9px";

                    div.style.textAlign =
                        mine
                            ? "right"
                            : "left";

                    div.innerHTML = `

                        <div
                            style="
                                font-size:9px;
                                color:var(--muted);
                                margin-bottom:2px;
                            "
                        >
                            ${escapeHtml(
                                message.sender_name ||
                                "User"
                            )}
                        </div>

                        <span
                            style="
                                display:inline-block;
                                max-width:80%;
                                padding:8px 10px;
                                border-radius:11px;
                                background:${
                                    mine
                                        ? "linear-gradient(135deg,var(--gold),var(--orange))"
                                        : "var(--card2)"
                                };
                                color:${
                                    mine
                                        ? "#180e00"
                                        : "var(--white)"
                                };
                                font-size:11px;
                            "
                        >
                            ${escapeHtml(
                                message.message_text
                            )}
                        </span>
                    `;

                    container.appendChild(
                        div
                    );
                }
            );
        }

        container.scrollTop =
            container.scrollHeight;

    } catch (error) {

        container.innerHTML = `
            <div class="loading">
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}


async function sendGroupMessage(
    groupId
) {

    const input =
        document.getElementById(
            "groupMessageInput"
        );

    const text =
        input.value.trim();

    const userId =
        getUserId();

    if (
        !text ||
        !userId
    ) {
        return;
    }

    input.value = "";

    try {

        await apiRequest(
            `/api/groups/${encodeURIComponent(groupId)}/messages`,
            {
                method: "POST",
                body: JSON.stringify({
                    senderId:
                        userId,
                    messageText:
                        text
                })
            }
        );

        await loadGroupMessages(
            groupId
        );

    } catch (error) {

        input.value =
            text;

        showToast(
            error.message
        );
    }
}

/* =====================================================
   FILE TO BASE64
===================================================== */

function fileToBase64(
    file
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}

    }

    openModal(
        "Story Caption",

                        .getElementById(

                }
            }

/* =====================================================
   STORY VIEWER
===================================================== */

function openStoryGroup(
    group
) {

    if (
        !group ||
        !group.stories ||
        !group.stories.length
    ) {
        return;
    }

    currentStoryGroup =
        group;

    currentStoryIndex =
        0;

    document
        .getElementById(
            "storyViewer"
        )
        .classList.add(
            "show"
        );

    showCurrentStory();
}


async function showCurrentStory() {

    if (
        !currentStoryGroup ||
        !currentStoryGroup.stories
    ) {
        return;
    }

    const story =
        currentStoryGroup.stories[
            currentStoryIndex
        ];

    if (!story) {
        closeStoryViewer();
        return;
    }

    document.getElementById(
        "storyViewerAvatar"
    ).src =
        avatarUrl(
            currentStoryGroup.profilePicture,
            currentStoryGroup.fullName
        );

    document.getElementById(
        "storyViewerName"
    ).textContent =
        currentStoryGroup.fullName ||
        "User";

    const content =
        document.getElementById(
            "storyContent"
        );

    content.innerHTML =
        "";

    if (
        story.mediaType ===
        "video"
    ) {

        const video =
            document.createElement(
                "video"
            );

        video.src =
            story.mediaData;

        video.controls =
            true;

        video.autoplay =
            true;

        video.playsInline =
            true;

        content.appendChild(
            video
        );

    } else {

        const image =
            document.createElement(
                "img"
            );

        image.src =
            story.mediaData;

        content.appendChild(
            image
        );
    }

    document.getElementById(
        "storyCaption"
    ).textContent =
        story.caption ||
        "";

    const userId =
        getUserId();

    if (
        story.id &&
        userId &&
        Number(
            story.userId ||
            story.user_id
        ) !== userId
    ) {

        try {

            await apiRequest(
                `/api/stories/${encodeURIComponent(story.id)}/view`,
                {
                    method: "POST",
                    body: JSON.stringify({
                        userId
                    })
                }
            );

        } catch (error) {

            console.log(
                "Story view error:",
                error.message
            );
        }
    }
}


function closeStoryViewer() {

    document
        .getElementById(
            "storyViewer"
        )
        .classList.remove(
            "show"
        );

    document.getElementById(
        "storyContent"
    ).innerHTML =
        "";

    currentStoryGroup =
        null;

    currentStoryIndex =
        0;
}

async function saveProfile() {

    const userId =
        getUserId();

    const fullName =
        document
            .getElementById(
                "editFullName"
            )
            .value
            .trim();

    const about =
        document
            .getElementById(
                "editAbout"
            )
            .value
            .trim();

    if (!fullName) {

        showToast(
            "Name cannot be empty."
        );

        return;
    }

    try {

        const data =
            await apiRequest(
                `/api/users/${encodeURIComponent(userId)}/profile`,
                {
                    method: "PUT",
                    body: JSON.stringify({
                        fullName,
                        about
                    })
                }
            );

        currentUser =
            {
                ...currentUser,
                ...data.user
            };

        saveUser(
            currentUser
        );

        updateDrawerUser();

        closeModal();

        showToast(
            "Profile updated."
        );

        loadProfile();

    } catch (error) {

        showToast(
            error.message
        );
    }
}

function loadTheme() {

    const theme =
        localStorage.getItem(
            "vibeChatTheme"
        );

    if (theme === "light") {

        document.body.classList.add(
            "light"
        );

    } else {

        document.body.classList.remove(
            "light"
        );
    }
}


function toggleTheme() {

    const isLight =
        document.body.classList.toggle(
            "light"
        );

    localStorage.setItem(
        "vibeChatTheme",
        isLight
            ? "light"
            : "dark"
    );
}


/* =====================================================
   ONLINE STATUS
===================================================== */

async function setOnline() {

    const userId =
        getUserId();

    if (!userId) {
        return;
    }

    try {

        await apiRequest(
            `/api/users/${encodeURIComponent(userId)}/online`,
            {
                method: "PUT"
            }
        );

    } catch (error) {

        console.log(
            "Online status error:",
            error.message
        );
    }
}


function startOnlineTimer() {

    setOnline();

    if (onlineTimer) {

        clearInterval(
            onlineTimer
        );
    }

    onlineTimer =
        setInterval(
            setOnline,
            60000
        );
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    const userId =
        getUserId();

    try {

        if (userId) {

            await apiRequest(
                `/api/users/${encodeURIComponent(userId)}/offline`,
                {
                    method: "PUT"
                }
            );
        }

    } catch (error) {

        console.log(
            "Logout status error:",
            error.message
        );

    } finally {

        localStorage.removeItem(
            "vibeChatCurrentUser"
        );

        localStorage.removeItem(
            "cheryChatCurrentUser"
        );

        if (
            messageRefreshTimer
        ) {

            clearInterval(
                messageRefreshTimer
            );
        }

        if (
            onlineTimer
        ) {

            clearInterval(
                onlineTimer
            );
        }

        window.location.href =
            "index.html";
    }
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeAttribute(
    value
) {

    return escapeHtml(
        value
    );
}

/* =====================================================
   STORY TAP NAVIGATION
===================================================== */

document
    .getElementById(
        "storyViewer"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.closest(
                    ".story-viewer-header"
                )
            ) {
                return;
            }

            if (
                !currentStoryGroup
            ) {
                return;
            }

            const width =
                window.innerWidth;

            if (
                event.clientX >
                width / 2
            ) {

                if (
                    currentStoryIndex <
                    currentStoryGroup.stories.length - 1
                ) {

                    currentStoryIndex++;

                    showCurrentStory();

                } else {

                    closeStoryViewer();
                }

            } else {

                if (
                    currentStoryIndex >
                    0
                ) {

                    currentStoryIndex--;

                    showCurrentStory();

                }

            }
        }
    );
