<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

:root{
    --body-bg:#07030f;
    --header-bg:#120a22;
    --card:#120a22;
    --card2:#180d2c;
    --gold:#ffd54a;
    --gold2:#ff9e00;
    --text:#ffffff;
    --muted:#9d96aa;
    --border:rgba(255,255,255,.07);
    --danger:#ff4d67;
    --green:#22c55e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:var(--body-bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:70px;
    background:var(--header-bg);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:100;
}

.header-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.menu-button{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(255,213,74,.08);
    color:var(--gold);
    font-size:20px;
}

.logo{
    font-size:22px;
    font-weight:700;
    letter-spacing:-.5px;
}

.logo span{
    color:var(--gold);
}

.header-right{
    display:flex;
    align-items:center;
}

.profile-small{
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#170b00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    overflow:hidden;
}

.profile-small img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding-bottom:90px;
}

.search-box{
    padding:15px;
}

.search-inner{
    height:48px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:10px;
}

.search-inner i{
    color:var(--muted);
}

.search-inner input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:14px;
}

.search-inner input::placeholder{
    color:var(--muted);
}

.tabs{
    display:flex;
    gap:8px;
    padding:0 15px 15px;
    overflow-x:auto;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex-shrink:0;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    padding:8px 15px;
    border-radius:20px;
    font-size:12px;
}

.tab.active{
    background:var(--gold);
    color:#170b00;
    border-color:var(--gold);
    font-weight:600;
}

.section-title{
    padding:4px 15px 10px;
    color:var(--muted);
    font-size:12px;
    font-weight:500;
}

.conversations{
    padding:0 10px;
}

.conversation{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 8px;
    border-radius:15px;
    cursor:pointer;
    transition:.2s;
}

.conversation:hover{
    background:rgba(255,255,255,.04);
}

.avatar-wrap{
    position:relative;
    flex-shrink:0;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:linear-gradient(135deg,#34205a,#1c1232);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-weight:700;
    font-size:18px;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.online-dot{
    position:absolute;
    width:13px;
    height:13px;
    background:var(--green);
    border:3px solid var(--body-bg);
    border-radius:50%;
    right:0;
    bottom:0;
}

.conversation-info{
    min-width:0;
    flex:1;
}

.conversation-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.conversation-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:var(--muted);
    font-size:10px;
    white-space:nowrap;
}

.conversation-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:4px;
}

.conversation-preview{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:20px;
    background:var(--gold);
    color:#170b00;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.empty{
    padding:70px 25px;
    text-align:center;
    color:var(--muted);
}

.empty i{
    font-size:45px;
    color:var(--gold);
    margin-bottom:15px;
}

.empty h3{
    color:var(--text);
    margin-bottom:7px;
}

.empty p{
    font-size:12px;
    line-height:1.6;
}

.search-results{
    padding:0 10px;
}

.search-user{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 8px;
    border-radius:15px;
    cursor:pointer;
}

.search-user:hover{
    background:rgba(255,255,255,.04);
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:14px;
    font-weight:600;
}

.user-about{
    color:var(--muted);
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-screen{
    position:fixed;
    inset:0;
    background:var(--body-bg);
    z-index:500;
    display:none;
    flex-direction:column;
}

.chat-screen.show{
    display:flex;
}

.chat-header{
    height:68px;
    background:var(--header-bg);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
}

.chat-back{
    width:40px;
    height:40px;
    border:none;
    background:transparent;
    color:var(--text);
    font-size:19px;
}

.chat-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,#34205a,#1c1232);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    overflow:hidden;
    flex-shrink:0;
}

.chat-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-user-info{
    min-width:0;
    flex:1;
}

.chat-user-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-user-status{
    color:var(--muted);
    font-size:10px;
    margin-top:2px;
}

.chat-user-status.online{
    color:var(--green);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 13px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message-row{
    display:flex;
    width:100%;
}

.message-row.sent{
    justify-content:flex-end;
}

.message-row.received{
    justify-content:flex-start;
}

.message{
    max-width:78%;
    padding:9px 12px;
    border-radius:15px;
    font-size:13px;
    line-height:1.45;
    word-wrap:break-word;
}

.message-row.sent .message{
    background:linear-gradient(135deg,#ffd54a,#ff9e00);
    color:#1a0c00;
    border-bottom-right-radius:4px;
}

.message-row.received .message{
    background:var(--card);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
    margin-top:4px;
    font-size:8px;
    opacity:.65;
}

.message-input-area{
    padding:10px;
    background:var(--header-bg);
    border-top:1px solid var(--border);
}

.message-form{
    display:flex;
    gap:8px;
    align-items:center;
}

.message-input{
    flex:1;
    min-width:0;
    height:45px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:23px;
    outline:none;
    color:var(--text);
    padding:0 16px;
    font-size:13px;
}

.message-input::placeholder{
    color:var(--muted);
}

.send-button{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#170b00;
    font-size:17px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:rgba(18,10,34,.97);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:200;
    backdrop-filter:blur(15px);
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--muted);
    font-size:10px;
    cursor:pointer;
}

.nav-item i{
    font-size:18px;
}

.nav-item.active{
    color:var(--gold);
}

.side-menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:900;
    display:none;
}

.side-menu-overlay.show{
    display:block;
}

.side-menu{
    position:fixed;
    left:-300px;
    top:0;
    bottom:0;
    width:285px;
    background:#10071d;
    z-index:1000;
    transition:.3s ease;
    border-right:1px solid var(--border);
    padding:22px 15px;
    overflow-y:auto;
}

.side-menu.show{
    left:0;
}

.menu-profile{
    padding:12px 8px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:12px;
}

.menu-profile-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#170b00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    overflow:hidden;
}

.menu-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.menu-profile-name{
    font-weight:600;
    font-size:14px;
}

.menu-profile-email{
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
    word-break:break-all;
}

.menu-item{
    height:48px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 13px;
    border-radius:12px;
    color:#d8d2df;
    font-size:13px;
    cursor:pointer;
    margin-bottom:3px;
}

.menu-item i{
    width:20px;
    text-align:center;
    color:var(--gold);
}

.menu-item:hover{
    background:rgba(255,255,255,.05);
}

.menu-item.logout{
    color:var(--danger);
    margin-top:12px;
}

.menu-item.logout i{
    color:var(--danger);
}

.theme-switch{
    margin-left:auto;
    width:42px;
    height:23px;
    background:#3a3144;
    border-radius:20px;
    position:relative;
}

.theme-switch::after{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    top:3px;
    left:3px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

body.light{
    --body-bg:#f7f4fb;
    --header-bg:#ffffff;
    --card:#ffffff;
    --card2:#f2edf8;
    --text:#1c1525;
    --muted:#777080;
    --border:rgba(0,0,0,.08);
}

body.light .side-menu{
    background:#ffffff;
}

body.light .bottom-nav{
    background:rgba(255,255,255,.96);
}

body.light .online-dot{
    border-color:#f7f4fb;
}

body.light .theme-switch{
    background:var(--gold);
}

body.light .theme-switch::after{
    left:22px;
}

.loading{
    text-align:center;
    padding:30px;
    color:var(--muted);
    font-size:12px;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid rgba(255,213,74,.2);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#21142f;
    border:1px solid var(--border);
    color:white;
    padding:10px 16px;
    border-radius:10px;
    font-size:11px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:2000;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:420px){

    .header{
        height:64px;
    }

    .logo{
        font-size:20px;
    }

    .conversation{
        padding:12px 7px;
    }

    .avatar{
        width:50px;
        height:50px;
    }

    .message{
        max-width:84%;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="header-left">

        <button class="menu-button"
                onclick="openMenu()"
                aria-label="Open menu">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <div class="logo">
            Vibe<span>Chat</span>
        </div>

    </div>

    <div class="header-right">

        <div class="profile-small" id="headerAvatar">
            U
        </div>

    </div>

</header>


<!-- MAIN -->
<main class="container">

    <!-- SEARCH -->
    <div class="search-box">

        <div class="search-inner">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search people..."
                autocomplete="off"
            >

        </div>

    </div>


    <!-- TABS -->
    <div class="tabs">

        <button class="tab active"
                onclick="changeTab(this,'all')">
            All
        </button>

        <button class="tab"
                onclick="changeTab(this,'unread')">
            Unread
        </button>

        <button class="tab"
                onclick="changeTab(this,'groups')">
            Groups
        </button>

        <button class="tab"
                onclick="changeTab(this,'friends')">
            Friends
        </button>

    </div>


    <!-- SEARCH RESULTS -->
    <div id="searchResults"
         class="search-results"
         style="display:none;">
    </div>


    <!-- CONVERSATIONS -->
    <div id="conversationSection">

        <div class="section-title">
            Recent chats
        </div>

        <div id="conversations"
             class="conversations">

            <div class="loading">
                <div class="spinner"></div>
                Loading chats...
            </div>

        </div>

    </div>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <div class="nav-item active"
         onclick="goHome()">
        <i class="fa-solid fa-comment"></i>
        <span>Chats</span>
    </div>

    <div class="nav-item"
         onclick="showComingSoon('Groups')">
        <i class="fa-solid fa-users"></i>
        <span>Groups</span>
    </div>

    <div class="nav-item"
         onclick="showComingSoon('Stories')">
        <i class="fa-solid fa-circle-play"></i>
        <span>Stories</span>
    </div>

    <div class="nav-item"
         onclick="showComingSoon('Friends')">
        <i class="fa-solid fa-user-group"></i>
        <span>Friends</span>
    </div>

    <div class="nav-item"
         onclick="openMenu()">
        <i class="fa-solid fa-bars"></i>
        <span>More</span>
    </div>

</nav>


<!-- SIDE MENU OVERLAY -->
<div id="sideMenuOverlay"
     class="side-menu-overlay"
     onclick="closeMenu()">
</div>


<!-- SIDE MENU -->
<aside id="sideMenu"
       class="side-menu">

    <div class="menu-profile">

        <div class="menu-profile-top">

            <div class="menu-avatar"
                 id="menuAvatar">
                U
            </div>

            <div>

                <div class="menu-profile-name"
                     id="menuName">
                    VibeChat User
                </div>

                <div class="menu-profile-email"
                     id="menuEmail">
                    —
                </div>

            </div>

        </div>

    </div>


    <div class="menu-item"
         onclick="goHome();closeMenu();">

        <i class="fa-solid fa-comments"></i>

        <span>Chats</span>

    </div>


    <div class="menu-item"
         onclick="showComingSoon('Groups');closeMenu();">

        <i class="fa-solid fa-users"></i>

        <span>Groups</span>

    </div>


    <div class="menu-item"
         onclick="showComingSoon('Stories');closeMenu();">

        <i class="fa-solid fa-circle-play"></i>

        <span>Stories</span>

    </div>


    <div class="menu-item"
         onclick="showComingSoon('Friends');closeMenu();">

        <i class="fa-solid fa-user-group"></i>

        <span>Friends</span>

    </div>


    <div class="menu-item"
         onclick="showComingSoon('Verification');closeMenu();">

        <i class="fa-solid fa-circle-check"></i>

        <span>Verification</span>

    </div>


    <div class="menu-item"
         onclick="showComingSoon('Settings');closeMenu();">

        <i class="fa-solid fa-gear"></i>

        <span>Settings</span>

    </div>


    <div class="menu-item"
         onclick="toggleTheme();">

        <i class="fa-solid fa-moon"></i>

        <span>Theme</span>

        <div class="theme-switch"></div>

    </div>


    <div class="menu-item logout"
         onclick="logout();">

        <i class="fa-solid fa-right-from-bracket"></i>

        <span>Logout</span>

    </div>

</aside>


<!-- CHAT SCREEN -->
<section id="chatScreen"
         class="chat-screen">

    <div class="chat-header">

        <button class="chat-back"
                onclick="closeChat()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="chat-avatar"
             id="chatAvatar">
            U
        </div>


        <div class="chat-user-info">

            <div class="chat-user-name"
                 id="chatUserName">
                VibeChat User
            </div>

            <div class="chat-user-status"
                 id="chatUserStatus">
                Offline
            </div>

        </div>

    </div>


    <div id="messages"
         class="messages">

    </div>


    <div class="message-input-area">

        <form id="messageForm"
              class="message-form">

            <input
                id="messageInput"
                class="message-input"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button
                class="send-button"
                type="submit">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </form>

    </div>

</section>


<!-- TOAST -->
<div id="toast"
     class="toast">
</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "https://cherychat-backend.onrender.com";

const CURRENT_USER_KEY = "cheryChatCurrentUser";

const THEME_KEY = "vibeChatTheme";


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let conversations = [];

let activeConversation = null;

let activeChatUser = null;

let messageRefreshTimer = null;

let presenceTimer = null;

let searchTimer = null;

let currentTab = "all";


/* =====================================================
   DOM
===================================================== */

const conversationsElement =
    document.getElementById("conversations");

const searchInput =
    document.getElementById("searchInput");

const searchResults =
    document.getElementById("searchResults");

const conversationSection =
    document.getElementById("conversationSection");

const chatScreen =
    document.getElementById("chatScreen");

const messagesElement =
    document.getElementById("messages");

const messageForm =
    document.getElementById("messageForm");

const messageInput =
    document.getElementById("messageInput");

const toast =
    document.getElementById("toast");


/* =====================================================
   INIT
===================================================== */

document.addEventListener("DOMContentLoaded", async () => {

    applySavedTheme();

    await loadUser();

    if (!currentUser) {
        window.location.href = "index.html";
        return;
    }

    setupPresence();

    await loadConversations();

});


/* =====================================================
   USER
===================================================== */

async function loadUser(){

    try{

        const saved =
            localStorage.getItem(CURRENT_USER_KEY);

        if(!saved){

            currentUser = null;
            return;

        }

        currentUser = JSON.parse(saved);

        updateProfileUI();

        /*
         * Keep local user information fresh.
         * This is optional and will not break the dashboard
         * if the endpoint is unavailable.
         */

        try{

            const response = await fetch(
                `${API_URL}/api/test-users`
            );

            if(response.ok){

                // We intentionally do not overwrite the
                // logged-in user from this endpoint.

            }

        }catch(error){

async function loadConversations(){

    if(!currentUser) return;

    try{

        const response = await fetch(
            `${API_URL}/api/conversations?userId=${encodeURIComponent(currentUser.id)}`

async function openExistingConversation(chat){

    if(!chat) return;

    const conversationId =
        Number(
            chat.conversationId ||
            chat.id
        );


    if(!conversationId) {

        showToast("Conversation not found.");

        return;

    }


    activeConversation = {
        id: conversationId
    };


    activeChatUser =
        chat.otherUser || null;


    setupChatHeader();


    chatScreen.classList.add("show");


    await loadMessages();

    await markMessagesRead();

    await loadConversations();

    startMessageRefresh();

}


/* =====================================================
   OPEN CHAT WITH SEARCH USER
===================================================== */

async function openChatWithUser(user){

    if(!currentUser || !user) return;


    if(Number(user.id) === Number(currentUser.id)){

        showToast("You cannot chat with yourself.");

        return;

    }


    try{

        showToast("Opening chat...");


        const response =
            await fetch(
                `${API_URL}/api/conversations`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        userId:currentUser.id,

                        otherUserId:user.id

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not open conversation."
            );

        }


        const conversation =
            data.conversation ||
            data;


        const conversationId =
            Number(
                conversation.id ||
                conversation.conversationId
            );


        if(!conversationId){

            throw new Error(
                "Invalid conversation response."
            );

        }


        activeConversation = {
            id:conversationId
        };


        activeChatUser = user;


        setupChatHeader();


        chatScreen.classList.add("show");


        searchInput.value = "";

        searchResults.style.display = "none";

        conversationSection.style.display = "block";


        await loadMessages();

        await markMessagesRead();

        await loadConversations();

        startMessageRefresh();


    }catch(error){

        console.error(
            "Open chat error:",
            error
        );

        showToast(
            error.message ||
            "Could not open chat."
        );

    }

}

/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(
        !currentUser ||
        !activeConversation
    ) return;


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages/${encodeURIComponent(activeConversation.id)}?userId=${encodeURIComponent(currentUser.id)}`
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Could not load messages."
            );

        }


        const messages =
            Array.isArray(data)
                ? data
                : Array.isArray(data.messages)
                    ? data.messages
                    : [];


        renderMessages(messages);


    }catch(error){

        console.error(
            "Load messages error:",
            error
        );

        messagesElement.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-message"></i>

                <h3>Unable to load messages</h3>

                <p>
                    Please try again.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(messages){

    if(!Array.isArray(messages) || messages.length === 0){

        messagesElement.innerHTML = `

            <div class="empty"
                 style="padding-top:100px;">

                <i class="fa-regular fa-comment-dots"></i>

                <h3>Start the vibe</h3>

                <p>
                    Send a message to start chatting.
                </p>

            </div>

        `;

        return;

    }


    const shouldScroll =
        messagesElement.scrollHeight -
        messagesElement.scrollTop -
        messagesElement.clientHeight <
        120;


    messagesElement.innerHTML =
        messages.map(message => {

            const text =
                message.message ||
                message.messageText ||
                message.text ||
                "";


            const senderId =
                Number(
                    message.senderId ??
                    message.sender_id
                );


            const isSent =
                senderId === Number(currentUser.id);


            const createdAt =
                message.createdAt ||
                message.created_at;


            const time =
                createdAt
                    ? formatMessageTime(createdAt)
                    : "";


            const read =
                message.isRead === true ||
                message.is_read === true;


            return `

                <div class="message-row ${
                    isSent
                        ? "sent"
                        : "received"
                }">

                    <div class="message">

                        <div>
                            ${escapeHtml(text)}
                        </div>

                        <div class="message-meta">

                            <span>
                                ${escapeHtml(time)}
                            </span>

                            ${
                                isSent
                                ? `
                                    <i class="fa-solid ${
                                        read
                                        ? "fa-check-double"
                                        : "fa-check"
                                    }"></i>
                                `
                                : ""
                            }

                        </div>

                    </div>

                </div>

            `;

        }).join("");


    if(shouldScroll){

        messagesElement.scrollTop =
            messagesElement.scrollHeight;

    }

}

/* =====================================================
   FORMAT TIME
===================================================== */

function formatConversationTime(value){

    const date =
        new Date(value);


    if(isNaN(date.getTime()))
        return "";


    const now =
        new Date();


    const diff =
        now.getTime() -
        date.getTime();


    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 1)
        return "now";


    if(minutes < 60)
        return `${minutes}m`;


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24)
        return `${hours}h`;


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7)
        return `${days}d`;


    return date.toLocaleDateString(
        [],
        {
            day:"numeric",
            month:"short"
        }
    );

}


function formatMessageTime(value){

    const date =
        new Date(value);


    if(isNaN(date.getTime()))
        return "";


    return date.toLocaleTimeString(
        [],
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );

}


function formatLastSeen(value){

    const date =
        new Date(value);


    if(isNaN(date.getTime()))
        return "recently";


    const now =
        new Date();


    const diff =
        now.getTime() -
        date.getTime();


    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 1)
        return "just now";


    if(minutes < 60)
        return `${minutes}m ago`;


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24)
        return `${hours}h ago`;


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 7)
        return `${days}d ago`;


    return date.toLocaleDateString(
        [],
        {
            day:"numeric",
            month:"short"
        }
    );

}
