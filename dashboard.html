<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>VibeChat</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#120a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#07030f;
    color:#fff;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

img{
    max-width:100%;
}

:root{
    --bg:#07030f;
    --header:#120a22;
    --card:#120a22;
    --card2:#180d2b;
    --gold:#ffd54a;
    --orange:#ff9e00;
    --white:#fff;
    --muted:#9d96aa;
    --green:#22c55e;
    --red:#ef4444;
    --border:rgba(255,255,255,.08);
}

body.light{
    --bg:#f5f3f8;
    --header:#ffffff;
    --card:#ffffff;
    --card2:#f0edf5;
    --gold:#c99700;
    --orange:#e58b00;
    --white:#17121f;
    --muted:#706978;
    --border:rgba(0,0,0,.08);
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
    background:var(--bg);
}

.header{
    height:68px;
    background:var(--header);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:100;
}

.menu-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:transparent;
    color:var(--white);
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.menu-btn:active{
    background:rgba(255,213,74,.12);
}

.logo-wrap{
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
}

.logo{
    width:39px;
    height:39px;
    object-fit:cover;
    border-radius:12px;
}

.logo-text{
    font-size:20px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.2px;
}

.header-action{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:transparent;
    color:var(--white);
    font-size:18px;
}

/* =========================
   SCREENS
========================= */

.screen{
    display:none;
    min-height:calc(100vh - 68px);
    padding-bottom:80px;
}

.screen.active{
    display:block;
}

/* =========================
   SEARCH
========================= */

.search-wrap{
    padding:13px 15px 8px;
}

.search-box{
    width:100%;
    height:46px;
    border-radius:24px;
    background:var(--card);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:10px;
}

.search-box i{
    color:var(--muted);
}

.search-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    color:var(--white);
    font-size:14px;
}

.search-box input::placeholder{
    color:var(--muted);
}

/* =========================
   STORIES
========================= */

.stories-row{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding:10px 15px 15px;
    scrollbar-width:none;
}

.stories-row::-webkit-scrollbar{
    display:none;
}

.story{
    flex:0 0 70px;
    text-align:center;
}

.story-circle{
    width:64px;
    height:64px;
    border-radius:50%;
    padding:2px;
    background:linear-gradient(135deg,var(--gold),var(--orange));
    margin:auto;
}

.story-circle img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--bg);
}

.story-add{
    position:relative;
}

.story-plus{
    position:absolute;
    right:0;
    bottom:0;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--gold);
    color:#160d20;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    border:2px solid var(--bg);
}

.story-name{
    font-size:11px;
    color:var(--white);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:5px;
}

/* =========================
   SECTION
========================= */

.section-title{
    padding:5px 15px 9px;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.7px;
}

/* =========================
   CONVERSATIONS
========================= */

.conversation-list{
    padding:0 10px;
}

.conversation{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 8px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.conversation:active{
    background:rgba(255,255,255,.04);
}

.avatar{
    width:53px;
    height:53px;
    border-radius:50%;
    object-fit:cover;
    background:var(--card2);
    flex-shrink:0;
}

.conversation-main{
    flex:1;
    min-width:0;
}

.conversation-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.conversation-name{
    font-size:14px;
    font-weight:600;
    color:var(--white);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.conversation-time{
    color:var(--muted);
    font-size:10px;
    white-space:nowrap;
}

.conversation-bottom{
    margin-top:3px;
    display:flex;
    align-items:center;
    gap:5px;
}

.last-message{
    color:var(--muted);
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.online-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    flex-shrink:0;
}

.empty{
    text-align:center;
    padding:70px 25px;
    color:var(--muted);
}

.empty i{
    font-size:42px;
    color:var(--gold);
    margin-bottom:15px;
}

.empty h3{
    color:var(--white);
    font-size:17px;
    margin-bottom:7px;
}

.empty p{
    font-size:13px;
    line-height:1.6;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
    padding:0 10px;
}

.search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 8px;
    border-bottom:1px solid var(--border);
}

.search-result-info{
    flex:1;
    min-width:0;
}

.search-result-name{
    font-size:14px;
    font-weight:600;
}

.search-result-about{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.chat-btn{
    border:none;
    background:var(--gold);
    color:#160d20;
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:var(--header);
    border-top:1px solid var(--border);
    display:flex;
    z-index:120;
    padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
    flex:1;
    border:none;
    background:transparent;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
}

.nav-item i{
    font-size:19px;
}

.nav-item.active{
    color:var(--gold);
}

/* =========================
   SIDE MENU
========================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:200;
}

.overlay.show{
    display:block;
}

.side-menu{
    position:fixed;
    top:0;
    left:-310px;
    width:290px;
    max-width:85vw;
    height:100vh;
    background:var(--header);
    z-index:210;
    transition:.25s ease;
    box-shadow:8px 0 30px rgba(0,0,0,.4);
    overflow-y:auto;
}

.side-menu.open{
    left:0;
}

.menu-profile{
    padding:25px 20px 20px;
    background:linear-gradient(145deg,#180d2c,#0e0719);
    border-bottom:1px solid var(--border);
}

body.light .menu-profile{
    background:linear-gradient(145deg,#fff,#eeeaf5);
}

.menu-profile-row{
    display:flex;
    align-items:center;
    gap:13px;
}

.menu-profile-image{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--gold);
}

.menu-profile-info{
    min-width:0;
}

.menu-profile-name{
    font-size:16px;
    font-weight:700;
    color:var(--white);
}

.menu-profile-about{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.menu-close{
    margin-left:auto;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:19px;
}

.menu-list{
    padding:9px 0;
}

.menu-item{
    width:100%;
    border:none;
    background:transparent;
    color:var(--white);
    display:flex;
    align-items:center;
    gap:15px;
    padding:14px 20px;
    text-align:left;
    font-size:14px;
}

.menu-item i{
    width:22px;
    color:var(--gold);
    text-align:center;
}

.menu-item:active{
    background:rgba(255,213,74,.08);
}

.menu-item.logout{
    color:#ff6b6b;
}

.menu-item.logout i{
    color:#ff6b6b;
}

/* =========================
   PROFILE
========================= */

.profile-container{
    padding:20px 15px 30px;
}

.profile-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px 18px;
    text-align:center;
}

.profile-photo-wrap{
    position:relative;
    width:110px;
    height:110px;
    margin:0 auto 14px;
}

.profile-image{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--gold);
    background:var(--card2);
}

.change-photo{
    position:absolute;
    right:2px;
    bottom:2px;
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid var(--card);
    background:var(--gold);
    color:#160d20;
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-name{
    font-size:20px;
    font-weight:700;
}

.profile-about{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.profile-details{
    margin-top:22px;
    text-align:left;
}

.detail{
    padding:13px 2px;
    border-bottom:1px solid var(--border);
}

.detail-label{
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.5px;
}

.detail-value{
    margin-top:3px;
    font-size:13px;
    color:var(--white);
    word-break:break-word;
}

.edit-profile-btn{
    width:100%;
    height:46px;
    border:none;
    border-radius:12px;
    background:var(--gold);
    color:#160d20;
    font-weight:700;
    margin-top:20px;
}

/* =========================
   GROUPS
========================= */

.group-tools{
    padding:15px;
    display:flex;
    gap:10px;
}

.primary-btn,
.secondary-btn{
    flex:1;
    height:45px;
    border-radius:12px;
    font-weight:600;
    border:1px solid var(--border);
}

.primary-btn{
    background:var(--gold);
    color:#160d20;
    border:none;
}

.secondary-btn{
    background:var(--card);
    color:var(--white);
}

.group-card{
    margin:0 15px 12px;
    padding:15px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
}

.group-card-top{
    display:flex;
    gap:12px;
    align-items:center;
}

.group-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--gold),var(--orange));
    color:#160d20;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.group-info{
    flex:1;
    min-width:0;
}

.group-name{
    font-size:14px;
    font-weight:700;
}

.group-description{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.group-meta{
    color:var(--muted);
    font-size:10px;
    margin-top:10px;
}

.group-action{
    margin-top:12px;
    width:100%;
    height:40px;
    border:none;
    border-radius:10px;
    background:var(--gold);
    color:#160d20;
    font-weight:600;
}

/* =========================
   CHAT
========================= */

.chat-screen{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:300;
    display:none;
    flex-direction:column;
}

.chat-screen.open{
    display:flex;
}

.chat-header{
    height:68px;
    flex-shrink:0;
    background:var(--header);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
}

.back-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:transparent;
    color:var(--white);
    font-size:18px;
}

.chat-user-image{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
}

.chat-user-info{
    flex:1;
    min-width:0;
}

.chat-user-name{
    font-size:14px;
    font-weight:600;
}

.chat-user-status{
    color:var(--muted);
    font-size:10px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px 12px;
    background:
        radial-gradient(circle at top right,rgba(255,213,74,.04),transparent 35%),
        var(--bg);
}

.message-row{
    display:flex;
    margin-bottom:9px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-bubble{
    max-width:78%;
    padding:9px 12px;
    border-radius:15px;
    background:var(--card);
    border:1px solid var(--border);
    font-size:13px;
    line-height:1.45;
    word-wrap:break-word;
}

.message-row.mine .message-bubble{
    background:#3a2810;
    border-color:rgba(255,213,74,.15);
}

body.light .message-row.mine .message-bubble{
    background:#fff0bd;
}

.message-time{
    font-size:8px;
    color:var(--muted);
    margin-top:4px;
    text-align:right;
}

.chat-input-wrap{
    min-height:65px;
    background:var(--header);
    border-top:1px solid var(--border);
    padding:9px 10px;
    display:flex;
    gap:8px;
    align-items:center;
}

.chat-input{
    flex:1;
    min-height:45px;
    max-height:110px;
    resize:none;
    border:none;
    outline:none;
    border-radius:23px;
    background:var(--card2);
    color:var(--white);
    padding:12px 15px;
    font-size:13px;
}

.send-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:var(--gold);
    color:#160d20;
    font-size:16px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:400;
    background:rgba(0,0,0,.7);
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    background:var(--header);
    border-radius:22px 22px 0 0;
    padding:20px;
}

.modal-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:18px;
}

.form-group{
    margin-bottom:14px;
}

.form-label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.form-input,
.form-textarea{
    width:100%;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--white);
    border-radius:12px;
    outline:none;
    padding:12px;
    font-size:13px;
}

.form-textarea{
    min-height:90px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.modal-actions button{
    flex:1;
    height:45px;
    border-radius:11px;
    font-weight:600;
}

.cancel-btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--white);
}

.save-btn{
    border:none;
    background:var(--gold);
    color:#160d20;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#20152d;
    color:#fff;
    border:1px solid var(--border);
    padding:11px 17px;
    border-radius:25px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:600;
    white-space:nowrap;
    max-width:90vw;
    overflow:hidden;
    text-overflow:ellipsis;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   LOADING
========================= */

.loading{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
}

.loading i{
    color:var(--gold);
    font-size:25px;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){
    .app{
        max-width:700px;
        margin:auto;
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
    }

    .header{
        max-width:700px;
        left:50%;
        transform:translateX(-50%);
        width:100%;
    }

    .bottom-nav{
        max-width:700px;
        left:50%;
        transform:translateX(-50%);
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <button class="menu-btn" onclick="openMenu()" aria-label="Menu">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <div class="logo-wrap">
            <img src="./icon-192.png"
                 class="logo"
                 alt="VibeChat">

            <div class="logo-text">VibeChat</div>
        </div>

        <button class="header-action"
                onclick="showScreen('profileScreen')"
                aria-label="Profile">
            <i class="fa-regular fa-user"></i>
        </button>

    </header>


    <!-- ================= CHATS SCREEN ================= -->

    <main id="chatsScreen" class="screen active">

        <div class="search-wrap">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    id="userSearch"
                    type="search"
                    placeholder="Search VibeChat users..."
                    autocomplete="off"
                    oninput="handleUserSearch(this.value)">
            </div>
        </div>


        <!-- Stories -->

        <div class="stories-row">

            <div class="story" onclick="showStoryPlaceholder()">

                <div class="story-circle story-add">

                    <img id="yourStoryImage"
                         src=""
                         alt="Your story">

                    <div class="story-plus">
                        <i class="fa-solid fa-plus"></i>
                    </div>

                </div>

                <div class="story-name">
                    Your story
                </div>

            </div>

            <div id="storyPlaceholder1" style="display:none"></div>

        </div>


        <!-- Search results -->

        <div id="searchResults"
             class="search-results"
             style="display:none">
        </div>


        <div id="conversationSection">

            <div class="section-title">
                Chats
            </div>

            <div id="conversationList"
                 class="conversation-list">

                <div class="loading">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                </div>

            </div>

        </div>

    </main>


    <!-- ================= GROUPS SCREEN ================= -->

    <main id="groupsScreen" class="screen">

        <div class="group-tools">

            <button class="primary-btn"
                    onclick="openCreateGroupModal()">
                <i class="fa-solid fa-plus"></i>
                Create Group
            </button>

            <button class="secondary-btn"
                    onclick="loadDiscoverGroups()">
                <i class="fa-solid fa-compass"></i>

<script>
/* =========================================================
   CONFIG
========================================================= */

const API_URL = "https://cherychat-backend.onrender.com";

const SESSION_KEYS = [
    "cheryChatCurrentUser",
    "vibeChatCurrentUser"
];

let currentUser = null;
let activeChatUser = null;
let messageRefreshTimer = null;
let searchTimer = null;


/* =========================================================
   SESSION
========================================================= */

function loadCurrentUser(){

    let saved = null;

    for(const key of SESSION_KEYS){

        const value = localStorage.getItem(key);

        if(value){

            try{
                saved = JSON.parse(value);
                break;
            }catch(error){
                localStorage.removeItem(key);
            }

        }

    }

    if(!saved || !saved.id){

        window.location.href = "index.html";
        return false;
    }

    currentUser = saved;

    return true;
}


function saveCurrentUser(){

    if(!currentUser) return;

    localStorage.setItem(
        "cheryChatCurrentUser",
        JSON.stringify(currentUser)
    );

}


/* =========================================================
   AVATAR
========================================================= */

function createFallbackAvatar(name){

    return "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name || "User") +
        "&background=241538&color=ffd54a&bold=true";

}


function getUserImage(user){

    if(!user) return createFallbackAvatar("User");

    return (
        user.profilePicture ||
        user.profile_picture ||
        createFallbackAvatar(
            user.fullName ||
            user.full_name ||
            "User"
        )
    );

}


/* =========================================================
   PROFILE UI
========================================================= */

        currentUser.fullName ||

    const about =
        currentUser.about ||

    const email =
        currentUser.email ||

    const phone =
        currentUser.phone ||

    const image = getUserImage(currentUser);


    const profileImage =

    const menuProfileImage =

    const yourStoryImage =
        document.getElementById("yourStoryImage");

    const storiesProfileImage =
        document.getElementById("storiesProfileImage");


    if(profileImage)
        profileImage.src = image;

    if(menuProfileImage)
        menuProfileImage.src = image;

    if(yourStoryImage)
        yourStoryImage.src = image;

    if(storiesProfileImage)

    const profileAbout =

        document.getElementById("profilePhone");

/* =========================================================
   PROFILE PICTURE
========================================================= */

async function uploadProfilePicture(input){

    const file =
        input &&
        input.files &&
        input.files[0];

    if(!file) return;


    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if(!allowedTypes.includes(file.type)){

        showToast(
            "Please choose a JPG, PNG or WEBP image."
        );

        input.value = "";
        return;

    }


    /*
       Allow a reasonably sized original file.
       We compress it before sending.
    */

    if(file.size > 10 * 1024 * 1024){

        showToast(
            "Image must be 10MB or smaller."
        );

        input.value = "";
        return;

    }


    try{

        showToast("Preparing profile picture...");


        const compressedImage =
            await compressImage(file);


        const base64Part =
            compressedImage.split(",")[1] || "";

        const estimatedBytes =
            Math.ceil(
                (base64Part.length * 3) / 4
            );


        if(
            estimatedBytes >
            2 * 1024 * 1024
        ){

            showToast(
                "Image is still too large. Please choose a smaller photo."
            );

            input.value = "";
            return;

        }


        /*
           Immediate local preview.
        */

        currentUser.profilePicture =
            compressedImage;

        currentUser.profile_picture =
            compressedImage;

        saveCurrentUser();

        updateProfileUI();


        showToast(
            "Saving profile picture..."
        );


        const response =
            await fetch(
                `${API_URL}/api/users/${currentUser.id}/profile-picture`,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        profilePicture:
                            compressedImage
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Unable to update profile picture."
            );

        }


        if(data.user){

            currentUser = {
                ...currentUser,
                ...data.user
            };

        }


        saveCurrentUser();

        updateProfileUI();


        showToast(
            "Profile picture updated successfully."
        );


    }catch(error){

        console.error(
            "PROFILE PICTURE ERROR:",
            error
        );

        showToast(
            error.message ||
            "Unable to update profile picture."
        );

    }finally{

        input.value = "";

    }

}


/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload = event => {

                const img =
                    new Image();


                img.onload = () => {

                    const maxSize = 800;

                    let width =
                        img.width;

                    let height =
                        img.height;


                    if(
                        width > maxSize ||
                        height > maxSize
                    ){

                        if(width > height){

                            height =
                                Math.round(
                                    height *
                                    maxSize /
                                    width
                                );

                            width =
                                maxSize;

                        }else{

                            width =
                                Math.round(
                                    width *
                                    maxSize /
                                    height
                                );

                            height =
                                maxSize;

                        }

                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width = width;
                    canvas.height = height;


                    const ctx =
                        canvas.getContext("2d");


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .82
                        )
                    );

                };


                img.onerror = () => {

                    reject(
                        new Error(
                            "Unable to read image."
                        )
                    );

                };


                img.src =
                    event.target.result;

            };


            reader.onerror = () => {

                reject(
                    new Error(
                        "Unable to process image."
                    )
                );

            };


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================================
   USER SEARCH
========================================================= */

function handleUserSearch(value){

    clearTimeout(searchTimer);

    const q = value.trim();


    if(!q){

        document
            .getElementById("searchResults")
            .style.display = "none";

        document
            .getElementById("conversationSection")
            .style.display = "block";

        return;

    }


    searchTimer =
        setTimeout(
            () => searchUsers(q),
            300
        );

}


async function searchUsers(q){

    const results =
        document.getElementById(
            "searchResults"
        );

    const conversationSection =
        document.getElementById(
            "conversationSection"
        );


    conversationSection.style.display =
        "none";

    results.style.display =
        "block";

    results.innerHTML = `
        <div class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
    `;


    try{

        const response =
            await fetch(
                `${API_URL}/api/users/search?q=${encodeURIComponent(q)}&userId=${currentUser.id}`
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Search failed."
            );

        }


        if(!data.users ||
           !data.users.length){

            results.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-user-slash"></i>
                    <h3>No users found</h3>
                    <p>
                        Try another name, email or phone number.
                    </p>
                </div>
            `;

            return;

        }


        results.innerHTML =
            data.users.map(user => `

                <div class="search-result">

                    <img
                        class="avatar"
                        src="${escapeAttribute(
                            getUserImage(user)
                        )}"
                        alt="User">

                    <div class="search-result-info">

                        <div class="search-result-name">
                            ${escapeHtml(
                                user.fullName ||
                                user.full_name ||
                                "User"
                            )}
                        </div>

                        <div class="search-result-about">
                            ${escapeHtml(
                                user.about ||
                                "VibeChat user"
                            )}
                        </div>

                    </div>

                    <button
                        class="chat-btn"
                        onclick='startChat(${JSON.stringify(user)})'>

                        <i class="fa-solid fa-comment"></i>

                    </button>

                </div>

            `).join("");


    }catch(error){

        console.error(
            "SEARCH ERROR:",
            error
        );

        results.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <h3>Search failed</h3>
                <p>
                    Please try again.
                </p>
            </div>
        `;

    }

}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations(){

    const list =
        document.getElementById(
            "conversationList"
        );


    if(!currentUser) return;


    try{

        const response =
            await fetch(
                `${API_URL}/api/conversations?userId=${currentUser.id}`
            );


        const data =
            await response.json();


        if(!response.ok ||
           !data.success){

            throw new Error(
                data.message ||
                "Unable to load conversations."
            );

        }


        const conversations =
            data.conversations || [];


        if(!conversations.length){

            list.innerHTML = `
                <div class="empty">

                    <i class="fa-regular fa-comments"></i>

                    <h3>No conversations yet</h3>

                    <p>
                        Search for another VibeChat user
                        above to start chatting.
                    </p>

                </div>
            `;

            return;

        }


        list.innerHTML =
            conversations.map(conversation => {

                const user =
                    conversation.otherUser;

                const name =
                    user.fullName ||
                    user.full_name ||
                    "User";

                const image =
                    getUserImage(user);

                const lastMessage =
                    conversation.lastMessage ||
                    "Start a conversation";

                const time =
                    formatTime(
                        conversation.lastMessageTime
                    );


                return `

                    <div
                        class="conversation"
                        onclick='startChat(${JSON.stringify(user)})'>

                        <img
                            class="avatar"
                            src="${escapeAttribute(image)}"
                            alt="User">

                        <div class="conversation-main">

                            <div class="conversation-top">

                                <div class="conversation-name">
                                    ${escapeHtml(name)}
                                </div>

                                <div class="conversation-time">
                                    ${escapeHtml(time)}
                                </div>

                            </div>

                            <div class="conversation-bottom">

                                ${
                                    user.isOnline ||
                                    user.is_online
                                    ?
                                    `<span class="online-dot"></span>`
                                    :
                                    ""
                                }

                                <div class="last-message">
                                    ${escapeHtml(lastMessage)}
                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");


    }catch(error){

        console.error(
            "CONVERSATIONS ERROR:",
            error
        );

        list.innerHTML = `
            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h3>Unable to load chats</h3>

                <p>
                    Please check your connection
                    and try again.
                </p>

            </div>
        `;

    }

}


/* =========================================================

========================================================= */

async function startChat(user){

    if(!user || !user.id) return;


    activeChatUser = user;


    document.getElementById(
        "chatUserName"
    ).textContent =
        user.fullName ||
        user.full_name ||
        "User";


    document.getElementById(
        "chatUserImage"
    ).src =
        getUserImage(user);


    updateChatStatus(user);


    document
        .getElementById("chatScreen")
        .classList.add("open");


    document
        .getElementById("messageInput")
        .value = "";


    await ensureConversation(
        user.id
    );


    await loadMessages();


    startMessagePolling();

}


async function ensureConversation(otherUserId){

    try{

        await fetch(
            `${API_URL}/api/conversations`,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    userId:currentUser.id,
                    otherUserId:otherUserId
                })
            }
        );

/* =========================================================
   CHAT STATUS
========================================================= */

function updateChatStatus(user){

    const status =
        document.getElementById(
            "chatUserStatus"
        );


    if(
        user.isOnline ||
        user.is_online
    ){

        status.textContent =
            "Online";

        return;

    }


    if(user.lastSeen || user.last_seen){

        status.textContent =
            "Last seen " +
            formatTime(
                user.lastSeen ||
                user.last_seen
            );

        return;

    }


    status.textContent =
        "Offline";

}


/* =========================================================
   MESSAGES
========================================================= */

async function loadMessages(){

    if(
        !currentUser ||
        !activeChatUser
    ) return;


    const container =
        document.getElementById(
            "messages"
        );


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages?userId=${currentUser.id}&otherUserId=${activeChatUser.id}`
            );


        const data =
            await response.json();


        if(!response.ok ||
           !data.success){

            throw new Error(
                data.message ||
                "Unable to load messages."
            );

        }


        const messages =
            data.messages || [];


        if(!messages.length){

            container.innerHTML = `
                <div class="empty">

                    <i class="fa-regular fa-message"></i>

                    <h3>Start chatting</h3>

                    <p>
                        Send your first message to
                        ${
                            escapeHtml(
                                activeChatUser.fullName ||
                                activeChatUser.full_name ||
                                "this user"
                            )
                        }.
                    </p>

                </div>
            `;

        }else{

            container.innerHTML =
                messages.map(message => {

                    const mine =
                        Number(
                            message.senderId
                        ) === Number(
                            currentUser.id
                        );


                    return `

                        <div
                            class="message-row ${mine ? "mine" : ""}">

                            <div class="message-bubble">

                                ${escapeHtml(
                                    message.messageText
                                )}

                                <div class="message-time">

                                    ${formatTime(
                                        message.createdAt
                                    )}

                                    ${
                                        mine
                                        ?
                                        (
                                            message.isRead
                                            ?
                                            " ✓✓"
                                            :
                                            " ✓"
                                        )
                                        :
                                        ""
                                    }

                                </div>

                            </div>

                        </div>

                    `;

                }).join("");

        }


        container.scrollTop =
            container.scrollHeight;


        await markMessagesRead();


    }catch(error){

        console.error(
            "MESSAGES ERROR:",
            error
        );

    }

}


async function markMessagesRead(){

    if(
        !currentUser ||
        !activeChatUser
    ) return;


    try{

        await fetch(
            `${API_URL}/api/messages/read`,
            {
                method:"PUT",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    userId:currentUser.id,
                    otherUserId:
                        activeChatUser.id
                })
            }
        );

    }catch(error){

        console.error(
            "READ ERROR:",
            error
        );

    }

}


async function sendMessage(){

    if(
        !currentUser ||
        !activeChatUser
    ) return;


    const input =
        document.getElementById(
            "messageInput"
        );


    const messageText =
        input.value.trim();


    if(!messageText) return;


    input.value = "";


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        senderId:
                            currentUser.id,

                        receiverId:
                            activeChatUser.id,

                        messageText:
                            messageText
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok ||
           !data.success){

            throw new Error(
                data.message ||
                "Unable to send message."
            );

        }


        await loadMessages();

        await loadConversations();


    }catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );

        showToast(
            error.message ||
            "Unable to send message."
        );

    }

}


function handleMessageKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}

async function loadDiscoverGroups(){

        document.getElementById(
            "discoverGroupsList"
        );


    if(!container) return;


    try{

        const response =
            await fetch(
                `${API_URL}/api/groups?userId=${currentUser.id}`
            );

            await response.json();


        if(!response.ok ||
           !data.success){

            throw new Error(
                data.message ||
                "Unable to load groups."
            );

        }


        const groups =
            data.groups || [];


        if(!groups.length){

            container.innerHTML = `
                <div class="empty">
                    <p>
                        No public groups available yet.
                    </p>
                </div>
            `;

            return;

        }


        container.innerHTML =
            groups.map(group => {

                const membership =
                    group.membership;


                let buttonText =
                    "Join Group";


                let action =
                    `joinGroup(${Number(group.id)})`;

                    membership &&
                    membership.status === "active"
                ){

                    buttonText =
                        "Open Group";

                    action =
                        `openGroup(${Number(group.id)})`;

                }


                return `

                    <div class="group-card">

                        <div class="group-card-top">

                `;

    }catch(error){

        console.error(

            .value

        document
            .getElementById(
                "editAboutInput"

        showToast(
            "Name is required."
        );

    }


    try{

        const response =
            await fetch(
                `${API_URL}/api/users/${currentUser.id}/profile`,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        fullName,
                        about
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok ||
           !data.success){

                data.message ||
                "Unable to update profile."

        if(data.user){

            currentUser = {
                ...currentUser,

        }else{

            currentUser.full_name =

        }


        saveCurrentUser();

        updateProfileUI();

/* =========================================================
   HELPERS
========================================================= */

function formatTime(value){

    if(!value) return "";

    const date =
        new Date(value);


    if(Number.isNaN(
        date.getTime()
    )) return "";


    const now =
        new Date();


    const sameDay =
        date.toDateString() ===
        now.toDateString();


    if(sameDay){

        return date.toLocaleTimeString(
            [],
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }


    return date.toLocaleDateString(
        [],
        {
            day:"numeric",
            month:"short"
        }
    );

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}
