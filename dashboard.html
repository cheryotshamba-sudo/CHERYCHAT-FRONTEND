
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>VibeChat</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#120a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#07030f;
    color:#fff;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

button,input,textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* HEADER */
.header{
    height:64px;
    width:100%;
    background:#120a22;
    border-bottom:1px solid rgba(255,213,74,.12);
    display:flex;
    align-items:center;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:100;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-btn,
.header-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    color:#ffd54a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.logo{
    width:38px;
    height:38px;
    object-fit:contain;
    border-radius:50%;
}

.brand{
    font-size:19px;
    font-weight:700;
    color:#ffd54a;
}

.header-spacer{
    flex:1;
}

/* SEARCH */
.search-area{
    padding:12px 14px 8px;
    background:#07030f;
}

.search-box{
    width:100%;
    height:46px;
    background:#120a22;
    border:1px solid rgba(255,255,255,.06);
    border-radius:25px;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:10px;
}

.search-box i{
    color:#9d96aa;
}

.search-box input{
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:14px;
}

.search-box input::placeholder{
    color:#777181;
}

/* STORIES */
.stories-section{
    padding:10px 0 12px;
}

.section-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px 9px;
}

.section-heading h3{
    font-size:15px;
    font-weight:600;
}

.section-heading span{
    color:#9d96aa;
    font-size:11px;
}

.stories-container{
    display:flex;
    gap:13px;
    overflow-x:auto;
    padding:3px 15px 8px;
    scrollbar-width:none;
}

.stories-container::-webkit-scrollbar{
    display:none;
}

.story-item{
    flex:0 0 auto;
    width:64px;
    text-align:center;
}

.story-avatar{
    width:62px;
    height:62px;
    border-radius:50%;
    padding:2px;
    background:linear-gradient(135deg,#ffd54a,#ff9e00,#ff4d8d);
    position:relative;
}

.story-avatar img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #07030f;
}

.add-story .story-avatar{
    background:#120a22;
    border:1px dashed #ffd54a;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.add-story-icon{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ffd54a;
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

.story-name{
    margin-top:5px;
    font-size:10px;
    color:#c7c1d0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

/* CHATS */
.section-title{
    padding:8px 15px 10px;
    font-size:15px;
    font-weight:600;
}

.conversation-list{
    padding-bottom:85px;
}

.conversation{
    min-height:74px;
    padding:10px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.035);
    cursor:pointer;
}

.conversation:active{
    background:rgba(255,255,255,.04);
}

.avatar{
    width:54px;
    height:54px;
    flex:0 0 54px;
    border-radius:50%;
    background:#211732;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:#ffd54a;
    font-weight:600;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.conversation-info{
    flex:1;
    min-width:0;
}

.conversation-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.conversation-name{
    font-size:14px;
    font-weight:600;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.conversation-time{
    font-size:10px;
    color:#777181;
    white-space:nowrap;
}

.conversation-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
}

.last-message{
    font-size:12px;
    color:#9d96aa;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.unread{
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:12px;
    background:#ffd54a;
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
}

.empty-state{
    padding:55px 25px;
    text-align:center;
}

.empty-icon{
    width:70px;
    height:70px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#120a22;
    color:#ffd54a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.empty-state h3{
    font-size:16px;
    margin-bottom:7px;
}

.empty-state p{
    color:#8d8798;
    font-size:12px;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#120a22;
    border-top:1px solid rgba(255,213,74,.12);
    display:flex;
    z-index:200;
    padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#777181;
    font-size:10px;
    cursor:pointer;
}

.nav-item i{
    font-size:18px;
}

.nav-item.active{
    color:#ffd54a;
}

/* SIDE MENU */
.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:400;
}

.side-menu{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:280px;
    background:#120a22;
    box-shadow:10px 0 30px rgba(0,0,0,.5);
    padding:20px 15px;
}

.menu-profile{
    padding:10px 5px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.menu-profile .avatar{
    width:48px;
    height:48px;
    flex-basis:48px;
}

.menu-profile-name{
    font-size:14px;
    font-weight:600;
}

.menu-profile-about{
    color:#8d8798;
    font-size:11px;
    margin-top:3px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.menu-items{
    margin-top:15px;
}

.menu-item{
    width:100%;
    height:50px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 13px;
    border-radius:12px;
    background:transparent;
    color:#ddd8e5;
    font-size:13px;
    margin-bottom:4px;
    text-align:left;
}

.menu-item i{
    width:22px;
    text-align:center;
    color:#ffd54a;
}

.menu-item:active{
    background:rgba(255,213,74,.08);
}

.menu-item.logout{
    color:#ff7777;
}

.menu-item.logout i{
    color:#ff7777;
}

/* CHAT */
.chat-screen{
    position:fixed;
    inset:0;
    background:#07030f;
    z-index:300;
    display:flex;
    flex-direction:column;
}

.chat-header{
    height:64px;
    background:#120a22;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.back-btn{
    width:38px;
    height:38px;
    background:transparent;
    color:#fff;
    font-size:18px;
}

.chat-user-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    background:#241a35;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffd54a;
}

.chat-user-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-user-info{
    flex:1;
    min-width:0;
}

.chat-user-name{
    font-size:14px;
    font-weight:600;
}

.chat-user-status{
    font-size:10px;
    color:#22c55e;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message{
    max-width:78%;
    padding:9px 12px;
    border-radius:15px;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.message.mine{
    align-self:flex-end;
    background:#ffd54a;
    color:#120a22;
    border-bottom-right-radius:4px;
}

.message.theirs{
    align-self:flex-start;
    background:#1b132a;
    color:#fff;
    border-bottom-left-radius:4px;
}

.message-time{
    display:block;
    font-size:8px;
    margin-top:3px;
    opacity:.6;
    text-align:right;
}

.chat-input-area{
    min-height:62px;
    padding:8px;
    background:#120a22;
    display:flex;
    gap:7px;
    align-items:center;
}

.chat-input{
    flex:1;
    min-width:0;
    height:44px;
    border:0;
    outline:0;
    border-radius:23px;
    background:#1b132a;
    color:#fff;
    padding:0 15px;
    font-size:13px;
}

.send-btn{
    width:44px;
    height:44px;
    flex:0 0 44px;
    border-radius:50%;
    background:#ffd54a;
    color:#120a22;
    font-size:16px;
}

/* STORY VIEWER */
.story-viewer{
    position:fixed;
    inset:0;
    background:#000;
    z-index:600;
    display:flex;
    flex-direction:column;
}

.story-progress{
    position:absolute;
    top:9px;
    left:10px;
    right:10px;
    display:flex;
    gap:4px;
    z-index:5;
}

.story-progress-bar{
    height:3px;
    flex:1;
    background:rgba(255,255,255,.3);
    border-radius:4px;
    overflow:hidden;
}

.story-progress-fill{
    height:100%;
    background:#fff;
}

.story-viewer-header{
    position:absolute;
    top:20px;
    left:12px;
    right:12px;
    display:flex;
    align-items:center;
    z-index:5;
    gap:10px;
}

.story-viewer-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid #ffd54a;
}

.story-viewer-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.story-viewer-name{
    font-size:13px;
    font-weight:600;
}

.story-viewer-time{
    display:block;
    color:#aaa;
    font-size:9px;
}

.close-story{
    margin-left:auto;
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(0,0,0,.4);
    color:#fff;
    font-size:19px;
}

.story-content{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:70px 15px 80px;
}

.story-content img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:4px;
}

.story-text-content{
    width:100%;
    text-align:center;
    font-size:28px;
    font-weight:600;
    line-height:1.35;
    word-break:break-word;
    padding:20px;
}

/* STORY MODAL */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:500;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.story-modal{
    width:100%;
    max-width:500px;
    background:#120a22;
    border-radius:22px 22px 0 0;
    padding:20px;
}

.modal-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.modal-title h3{
    font-size:16px;
}

.modal-close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#211631;
    color:#fff;
}

.story-tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.story-tab{
    flex:1;
    height:40px;
    border-radius:10px;
    background:#211631;
    color:#aaa;
    font-size:12px;
}

.story-tab.active{
    background:#ffd54a;
    color:#120a22;
}

.story-text-input{
    width:100%;
    min-height:120px;
    resize:none;
    border:1px solid rgba(255,255,255,.08);
    outline:0;
    border-radius:13px;
    background:#0b0712;
    color:#fff;
    padding:13px;
    font-size:13px;
}

.story-file{
    width:100%;
    padding:20px;
    border:1px dashed #50465e;
    border-radius:13px;
    text-align:center;
    color:#aaa;
    font-size:12px;
}

.story-file i{
    display:block;
    font-size:28px;
    color:#ffd54a;
    margin-bottom:8px;
}

.story-file input{
    width:100%;
    margin-top:10px;
}

.post-story-btn{
    width:100%;
    height:48px;
    border-radius:24px;
    background:#ffd54a;
    color:#120a22;
    font-size:13px;
    font-weight:700;
    margin-top:15px;
}

/* TOAST */
.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    background:#211631;
    color:#fff;
    padding:10px 16px;
    border-radius:20px;
    font-size:11px;
    z-index:1000;
    white-space:nowrap;
}

/* LIGHT THEME */
body.light{
    background:#f5f4f8;
    color:#16121c;
}

body.light .header,
body.light .bottom-nav,
body.light .side-menu,
body.light .chat-header,
body.light .chat-input-area,
body.light .story-modal{
    background:#fff;
}

body.light .search-area{
    background:#f5f4f8;
}

body.light .search-box{
    background:#fff;
}

body.light .conversation:active{
    background:#eeeaf3;
}

body.light .last-message,
body.light .conversation-time,
body.light .section-heading span{
    color:#777;
}

body.light .story-name{
    color:#555;
}

body.light .story-avatar img{
    border-color:#f5f4f8;
}

body.light .empty-icon{
    background:#fff;
}

body.light .chat-screen{
    background:#f5f4f8;
}

body.light .message.theirs{
    background:#fff;
    color:#222;
}

body.light .chat-input{
    background:#eeeaf3;
    color:#222;
}

/* DESKTOP */
@media(min-width:700px){
    body{
        max-width:700px;
        margin:auto;
        border-left:1px solid rgba(255,255,255,.05);
        border-right:1px solid rgba(255,255,255,.05);
    }

    .bottom-nav{
        max-width:700px;
        margin:auto;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">

        <button class="menu-btn" onclick="openMenu()">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <img src="./icon-192.png" class="logo" alt="VibeChat">

        <div class="brand">VibeChat</div>
    </div>

    <div class="header-spacer"></div>

    <button class="header-btn" onclick="focusSearch()">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>
</header>

<section class="search-area">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            id="searchInput"
            type="text"
            placeholder="Search VibeChat users..."
            autocomplete="off">
    </div>
</section>

<section class="stories-section" id="storiesSection">

    <div class="section-heading">
        <h3>Stories</h3>
        <span id="storyCount"></span>
    </div>

    <div class="stories-container" id="storiesContainer">

        <div class="story-item add-story" onclick="openStoryModal()">

            <div class="story-avatar">

                <div class="add-story-icon">
                    <i class="fa-solid fa-plus"></i>
                </div>

            </div>

            <div class="story-name">
                Add Story
            </div>

        </div>

    </div>
</section>

<div class="section-title">
    Chats
</div>

<main id="conversationList" class="conversation-list">

    <div class="empty-state">

        <div class="empty-icon">
            <i class="fa-regular fa-comments"></i>
        </div>

        <h3>No conversations yet</h3>

        <p>
            Search for another VibeChat user to start chatting.
        </p>

    </div>

</main>

<nav class="bottom-nav">

    <div class="nav-item active" onclick="showChats()">
        <i class="fa-solid fa-message"></i>
        <span>Chats</span>
    </div>

    <div class="nav-item" onclick="showGroups()">
        <i class="fa-solid fa-user-group"></i>
        <span>Groups</span>
    </div>

    <div class="nav-item" onclick="scrollToStories()">
        <i class="fa-solid fa-circle-play"></i>
        <span>Stories</span>
    </div>

    <div class="nav-item" onclick="openProfile()">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </div>

</nav>

<!-- SIDE MENU -->
<div id="menuOverlay" class="menu-overlay hidden" onclick="closeMenu(event)">

    <div class="side-menu" onclick="event.stopPropagation()">

        <div class="menu-profile">

            <div id="menuAvatar" class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <div>
                <div id="menuName" class="menu-profile-name">
                    VibeChat User
                </div>

                <div id="menuAbout" class="menu-profile-about">
                    using VibeChat
                </div>
            </div>

        </div>

        <div class="menu-items">

            <button class="menu-item" onclick="showChats();closeMenu()">
                <i class="fa-solid fa-message"></i>
                Chats
            </button>

            <button class="menu-item" onclick="showGroups();closeMenu()">
                <i class="fa-solid fa-users"></i>
                Groups
            </button>

            <button class="menu-item" onclick="scrollToStories();closeMenu()">
                <i class="fa-solid fa-circle-play"></i>
                Stories
            </button>

            <button class="menu-item" onclick="openFriends();closeMenu()">
                <i class="fa-solid fa-user-group"></i>
                Friends
            </button>

            <button class="menu-item" onclick="openVerification();closeMenu()">
                <i class="fa-solid fa-circle-check"></i>
                Verification
            </button>

            <button class="menu-item" onclick="openSettings();closeMenu()">
                <i class="fa-solid fa-gear"></i>
                Settings
            </button>

            <button class="menu-item" onclick="toggleTheme()">
                <i class="fa-solid fa-moon"></i>
                Theme
            </button>

            <button class="menu-item logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>
    </div>
</div>

<!-- CHAT -->
<div id="chatScreen" class="chat-screen hidden">

    <div class="chat-header">

        <button class="back-btn" onclick="closeChat()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div id="chatAvatar" class="chat-user-avatar">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="chat-user-info">

            <div id="chatUserName" class="chat-user-name">
                User
            </div>

            <div id="chatUserStatus" class="chat-user-status">
                Offline
            </div>

        </div>
    </div>

    <div id="messages" class="messages"></div>

    <form class="chat-input-area" onsubmit="sendMessage(event)">

        <input
            id="messageInput"
            class="chat-input"
            placeholder="Type a message..."
            autocomplete="off">

        <button type="submit" class="send-btn">
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </form>
</div>

<!-- STORY VIEWER -->
<div id="storyViewer" class="story-viewer hidden">

    <div id="storyProgress" class="story-progress"></div>

    <div class="story-viewer-header">

        <div id="viewerAvatar" class="story-viewer-avatar">
            <img src="./icon-192.png" alt="">
        </div>

        <div>
            <div id="viewerName" class="story-viewer-name">
                Story
            </div>

            <span id="viewerTime" class="story-viewer-time"></span>
        </div>

        <button class="close-story" onclick="closeStoryViewer()">
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>

    <div id="storyContent" class="story-content"></div>

</div>

<!-- ADD STORY -->
<div
    id="storyModalOverlay"
    class="modal-overlay hidden"
    onclick="closeStoryModal(event)">

    <div class="story-modal" onclick="event.stopPropagation()">

        <div class="modal-title">

            <h3>Create Story</h3>

            <button class="modal-close" onclick="closeStoryModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div class="story-tabs">

            <button
                id="textStoryTab"
                class="story-tab active"
                onclick="selectStoryType('text')">
                Text Story
            </button>

            <button
                id="imageStoryTab"
                class="story-tab"
                onclick="selectStoryType('image')">
                Photo Story
            </button>

        </div>

        <div id="textStoryArea">

            <textarea
                id="storyText"
                class="story-text-input"
                maxlength="500"
                placeholder="What's your vibe today?"></textarea>

        </div>

        <div id="imageStoryArea" class="story-file hidden">

            <i class="fa-solid fa-image"></i>

            Select a photo for your story

            <input
                id="storyImage"
                type="file"
                accept="image/*">

        </div>

        <button
            id="postStoryButton"
            class="post-story-btn"
            onclick="postStory()">

            Post Story

        </button>

    </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const API_URL = "https://cherychat-backend.onrender.com";

let currentUser = null;
let conversations = [];
let selectedConversation = null;
let messageRefreshTimer = null;

let stories = [];
let storyViewerIndex = 0;
let storyViewerList = [];

let currentStoryType = "text";

document.addEventListener("DOMContentLoaded", () => {

    loadTheme();
    loadUser();

    if(currentUser){

        loadConversations();
        loadStories();

        setInterval(loadStories,30000);
        setInterval(loadConversations,15000);

    }

});

/* USER */

function loadUser(){

    const saved =
        localStorage.getItem("cheryChatCurrentUser") ||
        localStorage.getItem("vibeChatCurrentUser");

    if(!saved){

        window.location.href = "index.html";
        return;

    }

    try{

        currentUser = JSON.parse(saved);

    }catch(error){

        localStorage.removeItem("cheryChatCurrentUser");
        localStorage.removeItem("vibeChatCurrentUser");

        window.location.href = "index.html";
        return;

    }

    updateUserUI();
}

function updateUserUI(){

    const name =
        currentUser.full_name ||
        currentUser.name ||
        "VibeChat User";

    const about =
        currentUser.about ||
        "using VibeChat";

    document.getElementById("menuName").textContent = name;
    document.getElementById("menuAbout").textContent = about;

    const picture = currentUser.profile_picture;

    if(picture){

        document.getElementById("menuAvatar").innerHTML =
            `<img src="${escapeAttribute(picture)}" alt="">`;

    }

}

/* CONVERSATIONS */

async function loadConversations(){

    if(!currentUser) return;

    const userId =
        currentUser.id ||
        currentUser.user_id;

    if(!userId) return;

    try{

        const response = await fetch(
            `${API_URL}/api/conversations?userId=${encodeURIComponent(userId)}`
        );

        if(!response.ok) return;

        const data = await response.json();

        conversations =
            Array.isArray(data)
            ? data
            : Array.isArray(data.conversations)
            ? data.conversations
            : [];

        renderConversations();

    }catch(error){

        console.error("Conversation error:",error);

    }

}

function renderConversations(){

    const list =
        document.getElementById("conversationList");

    if(!conversations.length){

        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="fa-regular fa-comments"></i>
                </div>
                <h3>No conversations yet</h3>
                <p>
                    Search for another VibeChat user to start chatting.
                </p>
            </div>
        `;

        return;
    }

    list.innerHTML = "";

    conversations.forEach(conversation => {

        const other =
            conversation.other_user ||
            conversation.user ||
            conversation;

        const name =
            other.full_name ||
            other.name ||
            "VibeChat User";

        const picture =
            other.profile_picture ||
            "";

        const lastMessage =
            conversation.last_message ||
            conversation.message ||
            "Start chatting";

        const time =
            formatTime(
                conversation.last_message_at ||
                conversation.updated_at
            );

        const unread =
            Number(
                conversation.unread_count ||
                conversation.unread ||
                0
            );

        const item =
            document.createElement("div");

        item.className = "conversation";

        item.onclick = () => openChat(conversation);

        item.innerHTML = `
            <div class="avatar">
                ${
                    picture
                    ? `<img src="${escapeAttribute(picture)}" alt="">`
                    : escapeHTML(getInitials(name))
                }
            </div>

            <div class="conversation-info">

                <div class="conversation-top">

                    <div class="conversation-name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="conversation-time">
                        ${escapeHTML(time)}
                    </div>

                </div>

                <div class="conversation-bottom">

                    <div class="last-message">
                        ${escapeHTML(lastMessage)}
                    </div>

                    ${
                        unread > 0
                        ? `<div class="unread">${unread}</div>`
                        : ""
                    }

                </div>

            </div>
        `;

        list.appendChild(item);

    });

}

/* SEARCH */

function focusSearch(){

    document.getElementById("searchInput").focus();

}

let searchTimer = null;

document.getElementById("searchInput").addEventListener(
    "input",
    searchUsers
);

function searchUsers(){

    const query =
        document.getElementById("searchInput").value.trim();

    clearTimeout(searchTimer);

    if(!query){

        loadConversations();
        return;

    }

    searchTimer = setTimeout(async () => {

        try{

            const response = await fetch(
                `${API_URL}/api/users/search?q=${encodeURIComponent(query)}`
            );

            if(!response.ok) return;

            const data = await response.json();

            const users =
                Array.isArray(data)
                ? data
                : Array.isArray(data.users)
                ? data.users
                : [];

            renderSearchResults(users);

        }catch(error){

            console.error("Search error:",error);
            showToast("User search is unavailable");

        }

    },400);

}

function renderSearchResults(users){

    const list =
        document.getElementById("conversationList");

    if(!users.length){

        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="fa-solid fa-user-slash"></i>
                </div>
                <h3>No users found</h3>
                <p>Try another name, email or phone.</p>
            </div>
        `;

        return;

    }

    list.innerHTML = "";

    users.forEach(user => {

        const name =
            user.full_name ||
            user.name ||
            "VibeChat User";

        const picture =
            user.profile_picture ||
            "";

        const item =
            document.createElement("div");

        item.className = "conversation";

        item.onclick = () =>
            startConversationWithUser(user);

        item.innerHTML = `
            <div class="avatar">

                ${
                    picture
                    ? `<img src="${escapeAttribute(picture)}" alt="">`
                    : escapeHTML(getInitials(name))
                }

            </div>

            <div class="conversation-info">

                <div class="conversation-name">
                    ${escapeHTML(name)}
                </div>

                <div class="last-message">
                    Tap to start chatting
                </div>

            </div>
        `;

        list.appendChild(item);

    });

}

async function startConversationWithUser(user){

    const otherId =
        user.id ||
        user.user_id;

    if(!otherId) return;

    try{

        const response = await fetch(
            `${API_URL}/api/conversations`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

                    userOne:
                        currentUser.id ||
                        currentUser.user_id,

                    userTwo:
                        otherId

                })
            }
        );

        if(response.ok){

            const data = await response.json();

            openChat(
                data.conversation ||
                data
            );

            return;

        }

    }catch(error){

        console.error(error);

    }

    openChat({
        id:null,
        conversation_id:null,
        other_user:user
    });

}

/* CHAT */

function openChat(conversation){

    selectedConversation = conversation;

    const other =
        conversation.other_user ||
        conversation.user ||
        conversation;

    const name =
        other.full_name ||
        other.name ||
        "VibeChat User";

    const picture =
        other.profile_picture ||
        "";

    document.getElementById("chatUserName").textContent = name;

    if(picture){

        document.getElementById("chatAvatar").innerHTML =
            `<img src="${escapeAttribute(picture)}" alt="">`;

    }else{

        document.getElementById("chatAvatar").innerHTML =
            escapeHTML(getInitials(name));

    }

    document.getElementById("chatScreen")
        .classList.remove("hidden");

    loadMessages();

    clearInterval(messageRefreshTimer);

    messageRefreshTimer =
        setInterval(loadMessages,5000);

}

function closeChat(){

    document.getElementById("chatScreen")
        .classList.add("hidden");

    clearInterval(messageRefreshTimer);

    messageRefreshTimer = null;
    selectedConversation = null;

}

async function loadMessages(){

    if(!selectedConversation) return;

    const conversationId =
        selectedConversation.id ||
        selectedConversation.conversation_id;

    if(!conversationId) return;

    try{

        const response = await fetch(
            `${API_URL}/api/messages/${conversationId}`
        );

        if(!response.ok) return;

        const data = await response.json();

        const messages =
            Array.isArray(data)
            ? data
            : Array.isArray(data.messages)
            ? data.messages
            : [];

        renderMessages(messages);

    }catch(error){

        console.error("Messages error:",error);

    }

}

function renderMessages(messages){

    const box =
        document.getElementById("messages");

    box.innerHTML = "";

    messages.forEach(message => {

        const senderId =
            message.sender_id ||
            message.senderId;

        const myId =
            currentUser.id ||
            currentUser.user_id;

        const mine =
            String(senderId) === String(myId);

        const div =
            document.createElement("div");

        div.className =
            "message " +
            (mine ? "mine" : "theirs");

        const text =
            message.message_text ||
            message.message ||
            "";

        div.innerHTML = `
            ${escapeHTML(text)}

            <span class="message-time">
                ${escapeHTML(formatTime(message.created_at))}
            </span>
        `;

        box.appendChild(div);

    });

    box.scrollTop = box.scrollHeight;

}

async function sendMessage(event){

    event.preventDefault();

    if(!selectedConversation) return;

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if(!message) return;

    const conversationId =
        selectedConversation.id ||
        selectedConversation.conversation_id;

    if(!conversationId){

        showToast("Conversation is not ready yet");
        return;

    }

    try{

        const response = await fetch(
            `${API_URL}/api/messages`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({

                    conversationId,

                    senderId:
                        currentUser.id ||
                        currentUser.user_id,

                    messageText:message

                })
            }
        );

        if(!response.ok){

            showToast("Message could not be sent");
            return;

        }

        input.value = "";

        loadMessages();
        loadConversations();

    }catch(error){

        console.error(error);
        showToast("Network error");

    }

}

/* STORIES */

async function loadStories(){

    if(!currentUser) return;

    const userId =
        currentUser.id ||
        currentUser.user_id;

    if(!userId) return;

    try{

        const response = await fetch(
            `${API_URL}/api/stories?userId=${encodeURIComponent(userId)}`
        );

        if(!response.ok) return;

        const data = await response.json();

        stories =
            Array.isArray(data)
            ? data
            : Array.isArray(data.stories)
            ? data.stories
            : [];

        renderStories();

    }catch(error){

        console.error("Stories error:",error);

    }

}

function renderStories(){

    const container =
        document.getElementById("storiesContainer");

    container.innerHTML = `
        <div class="story-item add-story"
             onclick="openStoryModal()">

            <div class="story-avatar">

                <div class="add-story-icon">
                    <i class="fa-solid fa-plus"></i>
                </div>

            </div>

            <div class="story-name">
                Add Story
            </div>

        </div>
    `;

    if(!stories.length){

        document.getElementById("storyCount")
            .textContent = "";

        return;

    }

    document.getElementById("storyCount")
        .textContent =
        `${stories.length} active`;

    const grouped =
        groupStories(stories);

    Object.values(grouped).forEach(group => {

        const first = group[0];

        const user =
            first.user ||
            first.author ||
            first;

        const name =
            user.full_name ||
            user.name ||
            "User";

        const picture =
            user.profile_picture ||
            first.profile_picture ||
            "./icon-192.png";

        const item =
            document.createElement("div");

        item.className = "story-item";

        item.onclick = () =>
            openStoryViewer(group);

        item.innerHTML = `
            <div class="story-avatar">

                <img
                    src="${escapeAttribute(picture)}"
                    alt="">

            </div>

            <div class="story-name">
                ${escapeHTML(name)}
            </div>
        `;

        container.appendChild(item);

    });

}

function groupStories(list){

    const groups = {};

    list.forEach(story => {

        const user =
            story.user ||
            story.author ||
            story;

        const id =
            user.id ||
            user.user_id ||
            story.user_id ||
            "unknown";

        if(!groups[id]){
            groups[id] = [];
        }

        groups[id].push(story);

    });

    return groups;

}

/* CREATE STORY */

function openStoryModal(){

    document.getElementById("storyModalOverlay")
        .classList.remove("hidden");

}

function closeStoryModal(event){

    if(
        event &&
        event.target !==
        document.getElementById("storyModalOverlay")
    ){
        return;
    }

    document.getElementById("storyModalOverlay")
        .classList.add("hidden");

}

function selectStoryType(type){

    currentStoryType = type;

    const textTab =
        document.getElementById("textStoryTab");

    const imageTab =
        document.getElementById("imageStoryTab");

    const textArea =
        document.getElementById("textStoryArea");

    const imageArea =
        document.getElementById("imageStoryArea");

    if(type === "text"){

        textTab.classList.add("active");
        imageTab.classList.remove("active");

        textArea.classList.remove("hidden");
        imageArea.classList.add("hidden");

    }else{

        imageTab.classList.add("active");
        textTab.classList.remove("active");

        imageArea.classList.remove("hidden");
        textArea.classList.add("hidden");

    }

}

async function postStory(){

    if(!currentUser) return;

    const button =
        document.getElementById("postStoryButton");

    button.disabled = true;

    try{

        const userId =
            currentUser.id ||
            currentUser.user_id;

        if(currentStoryType === "text"){

            const text =
                document.getElementById("storyText")
                .value.trim();

            if(!text){

                showToast("Write something first");

                button.disabled = false;
                return;

            }

            const response = await fetch(
                `${API_URL}/api/stories`,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({

                        userId:userId,
                        storyType:"text",
                        storyText:text

                    })
                }
            );

            if(!response.ok){

                throw new Error("Story failed");

            }

        }else{

            const file =
                document.getElementById("storyImage")
                .files[0];

            if(!file){

                showToast("Choose a photo first");

                button.disabled = false;
                return;

            }

            if(file.size > 5 * 1024 * 1024){

                showToast("Photo must be under 5MB");

                button.disabled = false;
                return;

            }

            const base64 =
                await fileToBase64(file);

            const response = await fetch(
                `${API_URL}/api/stories`,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({

                        userId:userId,
                        storyType:"image",
                        storyMedia:base64

                    })
                }
            );

            if(!response.ok){

                throw new Error("Story failed");

            }

        }

        showToast("Story posted successfully");

        document.getElementById("storyText").value = "";
        document.getElementById("storyImage").value = "";

        closeStoryModal();

        loadStories();

    }catch(error){

        console.error(error);
        showToast("Could not post story");

    }

    button.disabled = false;

}

/* STORY VIEWER */

function openStoryViewer(group){

    if(!group || !group.length) return;

    storyViewerList = group;
    storyViewerIndex = 0;

    document.getElementById("storyViewer")
        .classList.remove("hidden");

    renderCurrentStory();

}

function renderCurrentStory(){

    const story =
        storyViewerList[storyViewerIndex];

    if(!story){

        closeStoryViewer();
        return;

    }

    const user =
        story.user ||
        story.author ||
        story;

    const name =
        user.full_name ||
        user.name ||
        "User";

    const picture =
        user.profile_picture ||
        story.profile_picture ||
        "./icon-192.png";

    document.getElementById("viewerName")
        .textContent = name;

    document.getElementById("viewerTime")
        .textContent = timeAgo(story.created_at);

    document.getElementById("viewerAvatar").innerHTML =
        `<img src="${escapeAttribute(picture)}" alt="">`;

    const content =
        document.getElementById("storyContent");

    const type =
        story.story_type ||
        story.storyType ||
        "text";

    if(
        type === "image" ||
        story.story_media ||
        story.media_url ||
        story.image_url
    ){

        const image =
            story.story_media ||
            story.media_url ||
            story.image_url;

        content.innerHTML =
            `<img src="${escapeAttribute(image)}" alt="Story">`;

    }else{

        const text =
            story.story_text ||
            story.text ||
            "";

        content.innerHTML =
            `<div class="story-text-content">
                ${escapeHTML(text)}
             </div>`;

    }

    renderStoryProgress();

}

function renderStoryProgress(){

    const box =
        document.getElementById("storyProgress");

    box.innerHTML = "";

    storyViewerList.forEach((story,index) => {

        const bar =
            document.createElement("div");

        bar.className = "story-progress-bar";

        const fill =
            document.createElement("div");

        fill.className = "story-progress-fill";

        fill.style.width =
            index <= storyViewerIndex
            ? "100%"
            : "0%";

        bar.appendChild(fill);
        box.appendChild(bar);

    });

}

function closeStoryViewer(){

    document.getElementById("storyViewer")
        .classList.add("hidden");

    storyViewerList = [];
    storyViewerIndex = 0;

}

document.getElementById("storyContent")
.addEventListener("click",event => {

    const width = window.innerWidth;

    if(event.clientX < width / 2){

        previousStory();

    }else{

        nextStory();

    }

});

function nextStory(){

    if(
        storyViewerIndex <
        storyViewerList.length - 1
    ){

        storyViewerIndex++;

        renderCurrentStory();

    }else{

        closeStoryViewer();

    }

}

function previousStory(){

    if(storyViewerIndex > 0){

        storyViewerIndex--;

        renderCurrentStory();

    }

}

/* MENU */

function openMenu(){

    document.getElementById("menuOverlay")
        .classList.remove("hidden");

}

function closeMenu(event){

    if(
        event &&
        event.target !==
        document.getElementById("menuOverlay")
    ){
        return;
    }

    document.getElementById("menuOverlay")
        .classList.add("hidden");

}

/* NAVIGATION */

function showChats(){

    closeMenu();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function scrollToStories(){

    closeMenu();

    document.getElementById("storiesSection")
        .scrollIntoView({
            behavior:"smooth"
        });

}

function showGroups(){

    showToast("Groups coming soon");

}

function openFriends(){

    showToast("Friends coming soon");

}

function openVerification(){

    showToast("Verification coming soon");

}

function openSettings(){

    showToast("Settings coming soon");

}

function openProfile(){

    showToast("Profile coming soon");

}

/* THEME */

function toggleTheme(){

    document.body.classList.toggle("light");

    const light =
        document.body.classList.contains("light");

    localStorage.setItem(
        "vibeChatTheme",
        light ? "light" : "dark"
    );

    closeMenu();

}

function loadTheme(){

    if(
        localStorage.getItem("vibeChatTheme")
        === "light"
    ){

        document.body.classList.add("light");

    }

}

/* LOGOUT */

function logout(){

    localStorage.removeItem("cheryChatCurrentUser");
    localStorage.removeItem("vibeChatCurrentUser");

    window.location.href = "index.html";

}

/* HELPERS */

function getInitials(name){

    return String(name)
        .trim()
        .split(/\s+/)
        .slice(0,2)
        .map(word => word.charAt(0))
        .join("")
        .toUpperCase();

}

function formatTime(date){

    if(!date) return "";

    const d = new Date(date);

    if(Number.isNaN(d.getTime())) return "";

    const now = new Date();

    if(d.toDateString() === now.toDateString()){

        return d.toLocaleTimeString([],{
            hour:"numeric",
            minute:"2-digit"
        });

    }

    return d.toLocaleDateString([],{
        day:"numeric",
        month:"short"
    });

}

function timeAgo(date){

    if(!date) return "";

    const d = new Date(date);

    if(Number.isNaN(d.getTime())) return "";

    const seconds =
        Math.floor(
            (Date.now() - d.getTime()) / 1000
        );

    if(seconds < 60) return "Just now";

    const minutes =
        Math.floor(seconds / 60);

    if(minutes < 60) return `${minutes}m ago`;

    const hours =
        Math.floor(minutes / 60);

    if(hours < 24) return `${hours}h ago`;

    const days =
        Math.floor(hours / 24);

    return `${days}d ago`;

}

function fileToBase64(file){

    return new Promise((resolve,reject) => {

        const reader = new FileReader();

        reader.onload = () =>
            resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeAttribute(value){

    return escapeHTML(value);

}

/* TOAST */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.remove("hidden");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            toast.classList.add("hidden");

        },2500);

}

/* SERVICE WORKER */

if("serviceWorker" in navigator){

    window.addEventListener("load",() => {

        navigator.serviceWorker
            .register("./sw.js")
            .catch(error =>
                console.log("Service worker:",error)
            );

    });

}
</script>
