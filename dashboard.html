<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CheryChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#02091f;
    --header:#0d193d;
    --card:#0d193d;
    --card2:#07112f;
    --text:#ffffff;
    --muted:#9ca8c7;
    --border:#26365f;
    --gold:#ffd700;
    --gold2:#d4af37;
    --green:#22c55e;
    --red:#ef4444;
}

body.light{
    --bg:#f5f7fa;
    --header:#ffffff;
    --card:#ffffff;
    --card2:#f0f2f5;
    --text:#111827;
    --muted:#667085;
    --border:#e1e5eb;
    --gold:#b8860b;
    --gold2:#d4af37;
    --green:#16a34a;
    --red:#dc2626;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    padding-bottom:75px;
}

/* HEADER */

.header{
    height:65px;
    padding:0 12px;
    display:grid;
    grid-template-columns:45px 1fr 85px;
    align-items:center;
    background:var(--header);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:50;
}

.menu-button{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--text);
    font-size:23px;
    cursor:pointer;
}

.logo{
    color:var(--gold);
    font-size:21px;
    font-weight:800;
    text-align:center;
}

.header-right{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
}

.header-icon{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:var(--text);
    font-size:20px;
    cursor:pointer;
}

/* SEARCH */

.search-box{
    padding:10px 13px;
    background:var(--bg);
}

.search{
    height:44px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
}

.search-icon{
    color:var(--muted);
    font-size:18px;
}

.search input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:12px;
}

.search input::placeholder{
    color:var(--muted);
}

/* TABS */

.tabs{
    display:flex;
    gap:8px;
    padding:5px 13px 12px;
    background:var(--bg);
    overflow-x:auto;
    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    padding:7px 14px;
    border-radius:18px;
    font-family:inherit;
    font-size:10px;
    white-space:nowrap;
    cursor:pointer;
}

.tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#02091f;
    font-weight:700;
}

/* CONTENT */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}

/* EMPTY CHAT */

.empty-chat{
    min-height:calc(100vh - 220px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.empty-content{
    max-width:300px;
}

.empty-icon{
    width:78px;
    height:78px;
    margin:0 auto 18px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
}

.empty-content h2{
    font-size:17px;
    margin-bottom:7px;
}

.empty-content p{
    color:var(--muted);
    font-size:11px;
    line-height:1.7;
}

/* SIDE MENU */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:100;
    display:none;
}

.overlay.show{
    display:block;
}

.side-menu{
    position:fixed;
    left:-310px;
    top:0;
    width:290px;
    max-width:85%;
    height:100vh;
    background:var(--card);
    border-right:1px solid var(--border);
    z-index:150;
    transition:.25s;
    overflow-y:auto;
}

.side-menu.open{
    left:0;
}

.menu-header{
    padding:22px 18px;
    border-bottom:1px solid var(--border);
}

.menu-logo{
    color:var(--gold);
    font-size:22px;
    font-weight:800;
}

.menu-profile{
    display:flex;
    align-items:center;
    gap:11px;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
}

.menu-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        var(--gold),
        var(--gold2)
    );
    color:#02091f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:800;
}

.menu-profile strong{
    display:block;
    font-size:13px;
}

.menu-profile span{
    color:var(--muted);
    font-size:9px;
}

.menu-list{
    padding:10px;
}

.menu-item{
    width:100%;
    min-height:46px;
    padding:10px 11px;
    display:flex;
    align-items:center;
    gap:13px;
    border:0;
    border-radius:10px;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:12px;
    text-align:left;
    cursor:pointer;
}

.menu-item:hover{
    background:var(--card2);
}

.menu-icon{
    width:25px;
    text-align:center;
    font-size:17px;
}

.menu-item.logout{
    color:var(--red);
}

/* THEME SWITCH */

.theme-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 11px;
}

.theme-label{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:12px;
}

.switch{
    width:45px;
    height:24px;
    border-radius:20px;
    background:#34415f;
    padding:3px;
    cursor:pointer;
}

.switch span{
    display:block;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

body.light .switch{
    background:var(--gold);
}

body.light .switch span{
    transform:translateX(21px);
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:var(--header);
    border-top:1px solid var(--border);
    z-index:80;
}

.nav-item{
    min-width:58px;
    color:var(--muted);
    text-decoration:none;
    text-align:center;
    font-size:9px;
}

.nav-icon{
    display:block;
    font-size:20px;
    margin-bottom:2px;
}

.nav-item.active{
    color:var(--gold);
}

@media(min-width:700px){

    .container{
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
        min-height:calc(100vh - 65px);
    }

    .bottom-nav{
        max-width:650px;
        left:50%;
        transform:translateX(-50%);
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
        border-radius:18px 18px 0 0;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <button
        class="menu-button"
        onclick="openMenu()"
        aria-label="Open menu"
    >
        ☰
    </button>

    <div class="logo">
        CheryChat
    </div>

    <div class="header-right">

        <button
            class="header-icon"
            onclick="toggleSearch()"
            aria-label="Search"
        >
            🔍
        </button>

    </div>

</header>


<!-- SIDE MENU -->

<div
    class="overlay"
    id="overlay"
    onclick="closeMenu()"
></div>


<aside
    class="side-menu"
    id="sideMenu"
>

    <div class="menu-header">

        <div class="menu-logo">
            CHERYCHAT
        </div>

    </div>


    <div class="menu-profile">

        <div class="menu-avatar">
            CY
        </div>

        <div>

            <strong>Cheryot Y</strong>

            <span>
                CheryChat account
            </span>

        </div>

    </div>


    <div class="menu-list">

        <button class="menu-item">

            <span class="menu-icon">
                💬
            </span>

            Chats

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                👥
            </span>

            Groups

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                ◉
            </span>

            Stories

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                👤
            </span>

            Friends

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                🟢
            </span>

            Online Users

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                ✓
            </span>

            Verification

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                💰
            </span>

            Earn Online

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                📱
            </span>

            Install CheryChat App

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                🔔
            </span>

            Enable Notifications

        </button>


        <button class="menu-item">

            <span class="menu-icon">
                ⚙️
            </span>

            Settings

        </button>


        <!-- DARK / LIGHT MODE -->

        <div class="theme-row">

            <div class="theme-label">

                <span class="menu-icon">
                    🌙
                </span>

                Dark / Light Mode

            </div>


            <div
                class="switch"
                onclick="toggleTheme()"
            >

                <span></span>

            </div>

        </div>


        <button
            class="menu-item logout"
            onclick="logout()"
        >

            <span class="menu-icon">
                ↪
            </span>

            Logout

        </button>

    </div>

</aside>


<!-- MAIN -->

<main class="container">


    <!-- SEARCH -->

    <div
        class="search-box"
        id="searchBox"
        style="display:none;"
    >

        <div class="search">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="search"
                id="searchInput"
                placeholder="Search CheryChat..."
                autocomplete="off"
            >

        </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
        >
            All
        </button>

        <button class="tab">
            Unread
        </button>

        <button class="tab">
            Groups
        </button>

        <button class="tab">
            Friends
        </button>

    </div>


    <!-- EMPTY STATE -->

    <section class="empty-chat">

        <div class="empty-content">

            <div class="empty-icon">
                💬
            </div>

            <h2>
                No conversations yet
            </h2>

            <p>
                Start a conversation with another
                CheryChat user. Your chats will appear
                here once you send or receive a message.
            </p>

        </div>

    </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item active"
    >

        <span class="nav-icon">
            💬
        </span>

        Chats

    </a>


    <a
        href="#"
        class="nav-item"
    >

        <span class="nav-icon">
            👥
        </span>

        Groups

    </a>


    <a
        href="#"
        class="nav-item"
    >

        <span class="nav-icon">
            ◉
        </span>

        Stories

    </a>


    <a
        href="#"
        class="nav-item"
    >

        <span class="nav-icon">
            👤
        </span>

        Friends

    </a>


    <a
        href="#"
        class="nav-item"
    >

        <span class="nav-icon">
            ⚙️
        </span>

        Settings

    </a>

</nav>


<script>

/* MENU */

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("show");

}


function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* SEARCH */

function toggleSearch(){

    const box =
        document.getElementById("searchBox");

    if(box.style.display === "none"){

        box.style.display = "block";

        document
            .getElementById("searchInput")
            .focus();

    }else{

        box.style.display = "none";

    }

}


/* THEME */

function applyTheme(){

    const theme =
        localStorage.getItem("cheryChatTheme") || "dark";

    if(theme === "light"){

        document.body.classList.add("light");

    }else{

        document.body.classList.remove("light");

    }

}


function toggleTheme(){

    const isLight =
        document.body.classList.contains("light");

    localStorage.setItem(
        "cheryChatTheme",
        isLight ? "dark" : "light"
    );

    applyTheme();

}


/* LOGOUT */

function logout(){

    localStorage.removeItem("cheryChatUser");

    window.location.href =
        "login.html";

}


/* START */

applyTheme();

</script>

</body>
</html>
