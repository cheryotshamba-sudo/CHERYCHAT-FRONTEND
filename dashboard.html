<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

:root{
    --body-bg:#07030f;
    --header-bg:#120a22;
    --card:#120a22;
    --card2:#0d071b;
    --border:rgba(255,255,255,.08);
    --text:#ffffff;
    --muted:#9d96aa;
    --gold:#ffd54a;
    --gold2:#ff9e00;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Poppins,sans-serif;
    background:var(--body-bg);
    color:var(--text);
    min-height:100vh;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:65px;
    background:var(--header-bg);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:22px;
    font-weight:700;
}

.logo span{
    color:var(--gold);
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.header-right i{
    font-size:19px;
    color:#ddd;
    cursor:pointer;
}

.profile-small{
    width:36px;
    height:36px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#160b00;
    font-weight:700;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.search-box{
    background:var(--card);
    border:1px solid var(--border);
    height:48px;
    border-radius:14px;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:10px;
}

.search-box i{
    color:var(--muted);
}

.search-box input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font-size:14px;
}

.search-box input::placeholder{
    color:#777080;
}

.search-results{
    margin-top:8px;
    display:none;
}

.search-user{
    background:var(--card);
    border:1px solid var(--border);
    padding:12px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:7px;
    cursor:pointer;
}

.user-avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#160b00;
    font-weight:700;
    flex-shrink:0;
    overflow:hidden;
}

.user-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.search-user-info{
    flex:1;
}

.search-user-name{
    font-weight:600;
    font-size:14px;
}

.search-user-about{
    color:var(--muted);
    font-size:12px;
}

.tabs{
    display:flex;
    gap:8px;
    margin:18px 0 12px;
    overflow-x:auto;
}

.tab{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    padding:8px 16px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

.tab.active{
    background:var(--gold);
    color:#160b00;
    border-color:var(--gold);
    font-weight:600;
}

.conversations{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.conversation-item{
    min-height:72px;
    background:var(--card);
    border:1px solid transparent;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    cursor:pointer;
    transition:.2s;
}

.conversation-item:hover{
    border-color:var(--border);
    background:#160d28;
}

.conversation-avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#160b00;
    font-weight:700;
    flex-shrink:0;
    overflow:hidden;
}

.conversation-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.conversation-info{
    flex:1;
    min-width:0;
}

.conversation-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.conversation-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:var(--muted);
    font-size:10px;
    white-space:nowrap;
}

.conversation-preview{
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--gold);
    flex-shrink:0;
}

.chat-empty{
    text-align:center;
    padding:35px 20px;
    color:var(--muted);
    font-size:13px;
}

.empty-chat{
    min-height:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.empty-icon{
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(255,213,74,.1);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:15px;
}

.empty-chat h2{
    font-size:19px;
    margin-bottom:7px;
}

.empty-chat p{
    color:var(--muted);
    font-size:12px;
    max-width:350px;
}

.side-menu{
    position:fixed;
    top:0;
    left:-310px;
    width:290px;
    height:100vh;
    background:#0e071b;
    z-index:100;
    padding:22px;
    transition:.3s;
    border-right:1px solid var(--border);
}

.side-menu.show{
    left:0;
}

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:90;
    display:none;
}

.menu-overlay.show{
    display:block;
}

.menu-profile{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:25px;
}

.menu-profile-avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#160b00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.menu-name{
    font-weight:600;
}

.menu-email{
    color:var(--muted);
    font-size:11px;
}

.menu-item{
    height:48px;
    display:flex;
    align-items:center;
    gap:14px;
    color:#ddd;
    padding:0 12px;
    border-radius:10px;
    margin-bottom:4px;
    cursor:pointer;
    font-size:13px;
}

.menu-item:hover{
    background:#18102a;
}

.menu-item i{
    width:20px;
    color:var(--gold);
}

.menu-item.logout{
    color:#ff7777;
}

.menu-item.logout i{
    color:var(--red);
}

.chat-screen{
    position:fixed;
    inset:0;
    background:var(--body-bg);
    z-index:80;
    display:none;
    flex-direction:column;
}

.chat-screen.show{
    display:flex;
}

.chat-header{
    height:65px;
    background:var(--header-bg);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 14px;
}

.back-button{
    width:36px;
    height:36px;
    border:none;
    background:transparent;
    color:white;
    font-size:19px;
}

.chat-header-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#160b00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.chat-user-info{
    flex:1;
}

.chat-user-name{
    font-size:14px;
    font-weight:600;
}

.chat-user-status{
    color:var(--muted);
    font-size:10px;
}

.chat-user-status.online{
    color:var(--green);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 90px;
}

.message-row{
    display:flex;
    margin-bottom:9px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-bubble{
    max-width:78%;
    padding:9px 12px;
    border-radius:14px;
    background:#171024;
    font-size:13px;
    line-height:1.4;
}

.message-row.mine .message-bubble{
    background:linear-gradient(135deg,#a87900,#ffd54a);
    color:#160b00;
    border-bottom-right-radius:4px;
}

.message-row:not(.mine) .message-bubble{
    border-bottom-left-radius:4px;
}

.message-time{
    font-size:9px;
    opacity:.65;
    margin-top:4px;
    text-align:right;
}

.message-form{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding:10px;
    background:var(--header-bg);
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
}

.message-form input{
    flex:1;
    height:44px;
    border:none;
    outline:none;
    border-radius:22px;
    background:#1a1029;
    color:white;
    padding:0 16px;
    font-size:13px;
}

.send-button{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:var(--gold);
    color:#160b00;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:var(--header-bg);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:40;
}

.bottom-nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:var(--muted);
    font-size:9px;
}

.bottom-nav-item i{
    font-size:17px;
}

.bottom-nav-item.active{
    color:var(--gold);
}

@media(min-width:700px){

    .bottom-nav{
        display:none;
    }

    .container{
        padding-bottom:30px;
    }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        Vibe<span>Chat</span>
    </div>

    <div class="header-right">

        <i class="fa-solid fa-bars"
           onclick="openMenu()"></i>

        <div class="profile-small"
             id="headerAvatar">
            U
        </div>

    </div>

</header>


<!-- ================= MENU ================= -->

<div class="menu-overlay"
     id="menuOverlay"
     onclick="closeMenu()">
</div>

<aside class="side-menu"
       id="sideMenu">

    <div class="menu-profile">

        <div class="menu-profile-avatar"
             id="menuAvatar">
            U
        </div>

        <div>

            <div class="menu-name"
                 id="menuName">
                User
            </div>

            <div class="menu-email"
                 id="menuEmail">
                VibeChat
            </div>

        </div>

    </div>

    <div class="menu-item">
        <i class="fa-solid fa-comment"></i>
        Chats
    </div>

    <div class="menu-item">
        <i class="fa-solid fa-users"></i>
        Groups
    </div>

    <div class="menu-item">
        <i class="fa-solid fa-circle-play"></i>
        Stories
    </div>

    <div class="menu-item">
        <i class="fa-solid fa-user-group"></i>
        Friends
    </div>

    <div class="menu-item">
        <i class="fa-solid fa-circle-check"></i>
        Verification
    </div>

    <div class="menu-item">
        <i class="fa-solid fa-gear"></i>
        Settings
    </div>

    <div class="menu-item"
         onclick="toggleTheme()">

        <i class="fa-solid fa-moon"></i>
        Theme

    </div>

    <div class="menu-item logout"
         onclick="logout()">

        <i class="fa-solid fa-right-from-bracket"></i>
        Logout

    </div>

</aside>


<!-- ================= MAIN ================= -->

<main class="container">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            id="searchInput"
            type="text"
            placeholder="Search VibeChat users..."
            autocomplete="off"
        >

    </div>


    <div class="search-results"
         id="searchResults">
    </div>


    <div class="tabs">

        <button class="tab active">
            All
        </button>

        <button class="tab">
            Unread
        </button>

        <button class="tab">
            Groups
        </button>

        <button class="tab">
            Friends
        </button>

    </div>


    <div class="conversations"
         id="conversations">
    </div>


    <section class="empty-chat"
             id="emptyChat">

        <div class="empty-icon">
            <i class="fa-regular fa-comments"></i>
        </div>

        <h2>
            No conversations yet
        </h2>

        <p>
            Search for another VibeChat user above
            and start a private conversation.
        </p>

    </section>

</main>


<!-- ================= CHAT ================= -->

<section class="chat-screen"
         id="chatScreen">

    <div class="chat-header">

        <button class="back-button"
                onclick="closeChat()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="chat-header-avatar"
             id="chatAvatar">
            U
        </div>


        <div class="chat-user-info">

            <div class="chat-user-name"
                 id="chatUserName">
                User
            </div>

            <div class="chat-user-status"
                 id="chatUserStatus">
                Offline
            </div>

        </div>

    </div>


    <div class="messages"
         id="messages">
    </div>


    <form class="message-form"
          id="messageForm">

        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button
            class="send-button"
            type="submit">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </form>

</section>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <div class="bottom-nav-item active">
        <i class="fa-solid fa-comment"></i>
        <span>Chats</span>
    </div>

    <div class="bottom-nav-item">
        <i class="fa-solid fa-users"></i>
        <span>Groups</span>
    </div>

    <div class="bottom-nav-item">
        <i class="fa-solid fa-circle-play"></i>
        <span>Stories</span>
    </div>

    <div class="bottom-nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </div>

</nav>


<script>

/* =========================
   API
========================= */

const API_URL =
    "https://cherychat-backend.onrender.com";


/* =========================
   STATE
========================= */

let currentUser = null;

let activeConversation = null;

let activeChatUser = null;

let messageRefreshTimer = null;

let searchTimer = null;


/* =========================
   LOAD USER
========================= */

function loadUser(){

    const storedUser =
        localStorage.getItem(
            "cheryChatCurrentUser"
        );

    if(!storedUser){

        window.location.href =
            "login.html";

        return false;
    }

    try{

        currentUser =
            JSON.parse(storedUser);

    }catch(error){

        localStorage.removeItem(
            "cheryChatCurrentUser"
        );

        window.location.href =
            "login.html";

        return false;
    }


    const name =
        currentUser.full_name ||
        currentUser.fullName ||
        currentUser.name ||
        "User";

    const email =
        currentUser.email ||
        currentUser.phone ||
        "VibeChat";


    document.getElementById(
        "menuName"
    ).textContent = name;


    document.getElementById(
        "menuEmail"
    ).textContent = email;


    const initials =
        getInitials(name);


    document.getElementById(
        "menuAvatar"
    ).textContent = initials;


    document.getElementById(
        "headerAvatar"
    ).textContent = initials;


    return true;
}


/* =========================
   LOAD CONVERSATIONS
========================= */

async function loadConversations(){

    if(!currentUser){

        return;
    }


    const container =
        document.getElementById(
            "conversations"
        );


    const emptyChat =
        document.getElementById(
            "emptyChat"
        );


    container.innerHTML = `
        <div class="chat-empty">
            Loading conversations...
        </div>
    `;


    try{

        const response =
            await fetch(
                `${API_URL}/api/conversations?userId=${encodeURIComponent(currentUser.id)}`
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load conversations"
            );

        }


        const conversations =
            data.conversations || [];


        if(
            conversations.length === 0
        ){

            container.innerHTML = "";

            emptyChat.style.display =
                "flex";

            return;
        }


        emptyChat.style.display =
            "none";


        container.innerHTML = "";


        conversations.forEach(
            (chat, index) => {

                const name =
                    chat.otherUser?.fullName ||
                    "VibeChat User";


                const initials =
                    getInitials(name);


                const preview =
                    chat.lastMessage ||
                    "Start a conversation";


                const time =
                    chat.lastMessageTime
                    ?
                    formatConversationTime(
                        chat.lastMessageTime
                    )
                    :
                    "";


                const unread =
                    Number(
                        chat.unreadCount || 0
                    );


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "conversation-item";


                item.dataset.index =
                    index;


                item.innerHTML = `

                    <div class="conversation-avatar">

                        ${
                            chat.otherUser?.profilePicture
                            ?
                            `
                            <img
                                src="${escapeHtml(chat.otherUser.profilePicture)}"
                                alt=""
                            >
                            `
                            :
                            initials
                        }

                    </div>


                    <div class="conversation-info">

                        <div class="conversation-top">

                            <div class="conversation-name">
                                ${escapeHtml(name)}
                            </div>

                            <div class="conversation-time">
                                ${escapeHtml(time)}
                            </div>

                        </div>


                        <div class="conversation-preview">

                            ${
                                chat.lastMessageSenderId &&
                                Number(chat.lastMessageSenderId) ===
                                Number(currentUser.id)
                                ?
                                "You: "
                                :
                                ""
                            }

                            ${escapeHtml(preview)}

                        </div>

                    </div>


                    ${
                        unread > 0
                        ?
                        `<div class="unread-dot"></div>`
                        :
                        ""
                    }

                `;


                item.addEventListener(
                    "click",
                    () => {

                        openExistingConversation(
                            chat
                        );

                    }
                );


                container.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "LOAD CONVERSATIONS ERROR:",
            error
        );


        container.innerHTML = `

            <div class="chat-empty">

                Unable to load conversations.

                <br><br>

                <small>
                    ${escapeHtml(error.message)}
                </small>

            </div>

        `;


        emptyChat.style.display =
            "none";

    }

}


/* =========================
   OPEN EXISTING CHAT
========================= */

async function openExistingConversation(
    chat
){

    if(
        !currentUser ||
        !chat
    ){

        return;
    }


    activeConversation = {

        id:
            Number(
                chat.conversationId
            )

    };


    activeChatUser =
        chat.otherUser;


    const user =
        chat.otherUser;


    const userName =
        user?.fullName ||
        "User";


    document.getElementById(
        "chatUserName"
    ).textContent =
        userName;


    const status =
        document.getElementById(
            "chatUserStatus"
        );


    if(user?.isOnline){

        status.textContent =
            "Online";

        status.className =
            "chat-user-status online";

    }else{

        status.textContent =
            "Offline";

        status.className =
            "chat-user-status";

    }


    document.getElementById(
        "chatAvatar"
    ).textContent =
        getInitials(userName);


    document.getElementById(
        "chatScreen"
    ).classList.add(
        "show"
    );


    await loadMessages();

    await markMessagesRead();

    await loadConversations();

    startMessageRefresh();


    setTimeout(
        () => {

            document.getElementById(
                "messageInput"
            ).focus();

        },
        100
    );

}


/* =========================
   SEARCH USERS
========================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );


searchInput.addEventListener(
    "input",
    () => {

        clearTimeout(
            searchTimer
        );


        const query =
            searchInput.value.trim();


        if(query.length < 2){

            document.getElementById(
                "searchResults"
            ).style.display =
                "none";

            return;
        }


        searchTimer =
            setTimeout(
                () => {

                    searchUsers(query);

                },
                350
            );

    }
);


/* =========================
   SEARCH
========================= */

async function searchUsers(
    query
){

    const results =
        document.getElementById(
            "searchResults"
        );


    results.style.display =
        "block";


    results.innerHTML = `

        <div class="chat-empty">
            Searching...
        </div>

    `;


    try{

        const response =
            await fetch(
                `${API_URL}/api/users/search?q=${encodeURIComponent(query)}`
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Search failed"
            );

        }


        const users =
            data.users || [];


        if(users.length === 0){

            results.innerHTML = `

                <div class="chat-empty">
                    No VibeChat users found.
                </div>

            `;

            return;
        }


        results.innerHTML = "";


        users.forEach(
            user => {

                if(
                    Number(user.id) ===
                    Number(currentUser.id)
                ){

                    return;
                }


                const name =
                    user.fullName ||
                    user.full_name ||
                    "User";


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "search-user";


                item.innerHTML = `

                    <div class="user-avatar">

                        ${
                            user.profilePicture
                            ?
                            `
                            <img
                                src="${escapeHtml(user.profilePicture)}"
                                alt=""
                            >
                            `
                            :
                            getInitials(name)
                        }

                    </div>


                    <div class="search-user-info">

                        <div class="search-user-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="search-user-about">
                            ${escapeHtml(
                                user.about ||
                                "Hey there! I am using VibeChat."
                            )}
                        </div>

                    </div>

                `;


                item.addEventListener(
                    "click",
                    () => {

                        results.style.display =
                            "none";

                        searchInput.value =
                            "";

                        openChatWithUser(
                            user
                        );

                    }
                );


                results.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "SEARCH ERROR:",
            error
        );


        results.innerHTML = `

            <div class="chat-empty">
                Unable to search users.
            </div>

        `;

    }

}


/* =========================
   OPEN NEW CHAT
========================= */

async function openChatWithUser(
    user
){

    if(!currentUser){

        return;
    }


    activeChatUser =
        user;


    const userName =
        user.fullName ||
        user.full_name ||
        "User";


    document.getElementById(
        "chatUserName"
    ).textContent =
        userName;


    const status =
        document.getElementById(
            "chatUserStatus"
        );


    if(user.isOnline){

        status.textContent =
            "Online";

        status.className =
            "chat-user-status online";

    }else{

        status.textContent =
            "Offline";

        status.className =
            "chat-user-status";

    }


    document.getElementById(
        "chatAvatar"
    ).textContent =
        getInitials(userName);


    document.getElementById(
        "chatScreen"
    ).classList.add(
        "show"
    );


    try{

        const response =
            await fetch(
                `${API_URL}/api/conversations`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        userId:
                            currentUser.id,

                        otherUserId:
                            user.id

                    })

                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to create conversation"
            );

        }


        activeConversation =
            data.conversation;


        await loadMessages();

        await markMessagesRead();

        await loadConversations();

        startMessageRefresh();


        setTimeout(
            () => {

                document.getElementById(
                    "messageInput"
                ).focus();

            },
            100
        );


    }catch(error){

        console.error(
            "OPEN CHAT ERROR:",
            error
        );

        alert(
            "Unable to open conversation."
        );

    }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

    if(
        !activeConversation ||
        !currentUser
    ){

        return;
    }


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages/${activeConversation.id}?userId=${encodeURIComponent(currentUser.id)}`
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load messages"
            );

        }


        renderMessages(
            data.messages || []
        );


    }catch(error){

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );

    }

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(
    messages
){

    const container =
        document.getElementById(
            "messages"
        );


    if(!messages.length){

        container.innerHTML = `

            <div class="chat-empty">

                Say hello 👋

                <br>

                Start the conversation.

            </div>

        `;

        return;
    }


    container.innerHTML =
        messages.map(
            message => {

                const mine =
                    Number(
                        message.senderId
                    ) ===
                    Number(
                        currentUser.id
                    );


                return `

                    <div class="message-row ${
                        mine ? "mine" : ""
                    }">

                        <div class="message-bubble">

                            ${escapeHtml(
                                message.messageText ||
                                ""
                            )}

                            <div class="message-time">

                                ${formatTime(
                                    message.createdAt
                                )}

                                ${
                                    mine
                                    ?
                                    (
                                        message.isRead
                                        ?
                                        " ✓✓"
                                        :
                                        " ✓"
                                    )
                                    :
                                    ""
                                }

                            </div>

                        </div>

                    </div>

                `;

            }
        ).join("");


    container.scrollTop =
        container.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

document.getElementById(
    "messageForm"
).addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const input =
            document.getElementById(
                "messageInput"
            );


        const message =
            input.value.trim();


        if(
            !message ||
            !activeConversation ||
            !currentUser
        ){

            return;
        }


        const button =
            event.submitter;


        if(button){

            button.disabled =
                true;

        }


        try{

            const response =
                await fetch(
                    `${API_URL}/api/messages`,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            conversationId:
                                activeConversation.id,

                            senderId:
                                currentUser.id,

                            message:
                                message

                        })

                    }
                );


            const data =
                await response.json();


            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Unable to send message"
                );

            }


            input.value = "";


            await loadMessages();

            await loadConversations();

            await markMessagesRead();


        }catch(error){

            console.error(
                "SEND MESSAGE ERROR:",
                error
            );


            alert(
                error.message ||
                "Unable to send message."
            );

        }finally{

            if(button){

                button.disabled =
                    false;

            }

        }

    }
);

        );

/* =========================
   MESSAGE REFRESH
========================= */

function startMessageRefresh(){

    stopMessageRefresh();


    messageRefreshTimer =
        setInterval(
            async () => {

                if(
                    activeConversation &&
                    document
                        .getElementById(
                            "chatScreen"
                        )
                        .classList
                        .contains("show")
                ){

                    await loadMessages();

                    await markMessagesRead();

                }

            },
            3000
        );

}


function stopMessageRefresh(){

    if(messageRefreshTimer){

        clearInterval(
            messageRefreshTimer
        );

        messageRefreshTimer =
            null;

    }

}


/* =========================
   CLOSE CHAT
========================= */

function closeChat(){

    stopMessageRefresh();


    document.getElementById(
        "chatScreen"
    ).classList.remove(
        "show"
    );


    activeConversation =
        null;

    activeChatUser =
        null;


    loadConversations();

}

/* =========================
   HELPERS
========================= */

function getInitials(
    name
){

    if(!name){

        return "U";

    }


    const parts =
        String(name)
            .trim()
            .split(/\s+/);


    if(parts.length >= 2){

        return (
            parts[0][0] +
            parts[1][0]
        ).toUpperCase();

    }


    return String(name)
        .substring(0,2)
        .toUpperCase();

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function formatTime(
    value
){

    if(!value){

        return "";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    return date.toLocaleTimeString(
        [],
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );

}
