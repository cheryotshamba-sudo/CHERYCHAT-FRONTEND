    async function getGroupInvite() {

        if (!currentGroup) {
            return;
        }

        try {

            const data =
                await apiRequest(
                    `/api/groups/${currentGroup.id}/invite?userId=${encodeURIComponent(
                        userId()
                    )}`
                );

            const inviteCode =
                data.inviteCode ||
                data.invite_code ||
                "";

            const inviteLink =
                data.inviteLink ||
                data.invite_link ||
                `https://cherychat.onrender.com/dashboard.html?group=${encodeURIComponent(
                    inviteCode
                )}`;

            openModal(`
                <div class="modal-header">

                    <h3>
                        Group Invite
                    </h3>

                    <button
                        class="close-button"
                        id="closeInviteModal"
                    >
                        ×
                    </button>

                </div>

                <div class="form-group">

                    <label>
                        Invite code
                    </label>

                    <input
                        class="form-control"
                        value="${escapeHTML(
                            inviteCode
                        )}"
                        readonly
                    >

                </div>

                <div class="form-group">

                    <label>
                        Invite link
                    </label>

                    <input
                        class="form-control"
                        id="inviteLinkInput"
                        value="${escapeHTML(
                            inviteLink
                        )}"
                        readonly
                    >

                </div>

                <button
                    class="button"
                    id="copyInviteButton"
                    style="width:100%;"
                >
                    <i class="fa-solid fa-copy"></i>
                    Copy Invite Link
                </button>
            `);

            $("closeInviteModal")
                .onclick =
                closeModal;

            $("copyInviteButton")
                .onclick =
                async () => {

                    try {

                        await navigator.clipboard.writeText(
                            inviteLink
                        );

                        alert(
                            "Invite link copied."
                        );

                    } catch (error) {

                        $("inviteLinkInput")
                            .select();

                        alert(
                            "Copy the invite link manually."
                        );
                    }
                };

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    function openEditGroup() {

        if (!currentGroup) {
            return;
        }

        openModal(`
            <div class="modal-header">

                <h3>
                    Edit Group
                </h3>

                <button
                    class="close-button"
                    id="closeEditGroup"
                >
                    ×
                </button>

            </div>

            <div class="form-group">

                <label>
                    Group name
                </label>

                <input
                    class="form-control"
                    id="editGroupName"
                    maxlength="100"
                    value="${escapeHTML(
                        currentGroup.name ||
                        ""
                    )}"
                >

            </div>

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    class="form-control"
                    id="editGroupDescription"
                    maxlength="500"
                >${escapeHTML(
                    currentGroup.description ||
                    ""
                )}</textarea>

            </div>

            <button
                class="button"
                id="saveGroupButton"
                style="width:100%;"
            >
                Save Changes
            </button>
        `);

        $("closeEditGroup")
            .onclick =
            closeModal;

        $("saveGroupButton")
            .onclick =
            saveGroup;
    }

    async function saveGroup() {

        if (!currentGroup) {
            return;
        }

        const name =
            $("editGroupName")
                .value
                .trim();

        const description =
            $("editGroupDescription")
                .value
                .trim();

        if (!name) {

            alert(
                "Enter a group name."
            );

            return;
        }

        try {

            const data =
                await apiRequest(
                    `/api/groups/${currentGroup.id}`,
                    {
                        method:
                            "PUT",
                        body:
                            JSON.stringify({
                                userId:
                                    userId(),
                                name,
                                description
                            })
                    }
                );

            currentGroup =
                data.group ||
                {
                    ...currentGroup,
                    name,
                    description
                };

            closeModal();

            await loadGroups();

            viewGroup(
                currentGroup
            );

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    async function leaveGroup() {

        if (!currentGroup) {
            return;
        }

        if (
            !confirm(
                "Leave this group?"
            )
        ) {
            return;
        }

        try {

            await apiRequest(
                `/api/groups/${currentGroup.id}/leave`,
                {
                    method:
                        "POST",
                    body:
                        JSON.stringify({
                            userId:
                                userId()
                        })
                }
            );

            if (groupRefreshTimer) {

                clearInterval(
                    groupRefreshTimer
                );

                groupRefreshTimer =
                    null;
            }

            currentGroup =
                null;

            closeModal();

            await loadGroups();

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    /* =========================
       PROFILE
    ========================= */

    async function loadProfile() {

        try {

            const data =
                await apiRequest(
                    `/api/users/${encodeURIComponent(
                        userId()
                    )}`
                );

            const updatedUser =
                data.user ||
                data;

            saveUser(
                updatedUser
            );

            const name =
                updatedUser.fullName ||
                updatedUser.full_name ||
                "VibeChat User";

            const picture =
                updatedUser.profilePicture ||
                updatedUser.profile_picture ||
                avatarFor(name);

            $("profileContent").innerHTML = `

                <div class="card profile-card">

                    <div class="profile-picture-wrap">

                        <img
                            src="${picture}"
                            alt="Profile"
                        >

                    </div>

                    <div class="profile-name">
                        ${escapeHTML(
                            name
                        )}
                    </div>

                    <div class="profile-about">
                        ${escapeHTML(
                            updatedUser.about ||
                            ""
                        )}
                    </div>

                    <div class="profile-contact">
                        ${escapeHTML(
                            updatedUser.email ||
                            updatedUser.phone ||
                            ""
                        )}
                    </div>

                    <div class="button-row">

                        <button
                            class="button"
                            id="editProfileButton"
                        >
                            Edit Profile
                        </button>

                        <button
                            class="button secondary"
                            id="changePhotoButton"
                        >
                            Change Photo
                        </button>

                    </div>

                </div>

                <div class="card">

                    <div class="list-item">

                        <i
                            class="fa-solid fa-user"
                            style="
                                color:#ffd54a;
                                width:25px;
                            "
                        ></i>

                        <div class="list-content">

                            <div class="list-name">
                                Your Profile
                            </div>

                            <div class="list-preview">
                                Manage your VibeChat profile.
                            </div>

                        </div>

                    </div>

                    <div class="list-item">

                        <i
                            class="fa-solid fa-right-from-bracket"
                            style="
                                color:#ffd54a;
                                width:25px;
                            "
                        ></i>

                        <div class="list-content">

                            <div class="list-name">
                                Logout
                            </div>

                            <div class="list-preview">
                                Sign out of this device.
                            </div>

                        </div>

                        <button
                            class="button danger"
                            id="profileLogoutButton"
                        >
                            Logout
                        </button>

                    </div>

                </div>
            `;

            $("editProfileButton")
                .onclick =
                openEditProfile;

            $("changePhotoButton")
                .onclick =
                openChangePhoto;

            $("profileLogoutButton")
                .onclick =
                logout;

        } catch (error) {

            $("profileContent").innerHTML = `
                <div class="empty">

                    <i class="fa-solid fa-user"></i>

                    <h3>
                        Unable to load profile
                    </h3>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                </div>
            `;
        }
    }

    function openEditProfile() {

        openModal(`
            <div class="modal-header">

                <h3>
                    Edit Profile
                </h3>

                <button
                    class="close-button"
                    id="closeEditProfile"
                >
                    ×
                </button>

            </div>

            <div class="form-group">

                <label>
                    Full name
                </label>

                <input
                    class="form-control"
                    id="profileNameInput"
                    maxlength="100"
                    value="${escapeHTML(
                        currentUser.fullName ||
                        currentUser.full_name ||
                        ""
                    )}"
                >

            </div>

            <div class="form-group">

                <label>
                    About
                </label>

                <textarea
                    class="form-control"
                    id="profileAboutInput"
                    maxlength="500"
                >${escapeHTML(
                    currentUser.about ||
                    ""
                )}</textarea>

            </div>

            <button
                class="button"
                id="saveProfileButton"
                style="width:100%;"
            >
                Save Changes
            </button>
        `);

        $("closeEditProfile")
            .onclick =
            closeModal;

        $("saveProfileButton")
            .onclick =
            saveProfile;
    }

    async function saveProfile() {

        const fullName =
            $("profileNameInput")
                .value
                .trim();

        const about =
            $("profileAboutInput")
                .value
                .trim();

        if (!fullName) {

            alert(
                "Enter your full name."
            );

            return;
        }

        try {

            const data =
                await apiRequest(
                    `/api/users/${userId()}/profile`,
                    {
                        method:
                            "PUT",
                        body:
                            JSON.stringify({
                                fullName,
                                about
                            })
                    }
                );

            saveUser(
                data.user ||
                data
            );

            closeModal();

            await loadProfile();

        } catch (error) {

            alert(
                error.message
            );
        }
    }

    function openChangePhoto() {

        openModal(`
            <div class="modal-header">

                <h3>
                    Change Profile Picture
                </h3>

                <button
                    class="close-button"
                    id="closePhotoModal"
                >
                    ×
                </button>

            </div>

            <div class="form-group">

                <label>
                    Choose an image
                </label>

                <input
                    class="form-control"
                    id="profilePhotoFile"
                    type="file"
                    accept="image/jpeg,image/jpg,image/png,image/webp"
                >

            </div>

            <button
                class="button"
                id="uploadPhotoButton"
                style="width:100%;"
            >
                Upload Photo
            </button>
        `);

        $("closePhotoModal")
            .onclick =
            closeModal;

        $("uploadPhotoButton")
            .onclick =
            uploadProfilePhoto;
    }

    async function uploadProfilePhoto() {

        const file =
            $("profilePhotoFile")
                .files[0];

        if (!file) {

            alert(
                "Choose an image."
            );

            return;
        }

        if (
            file.size >
            2 * 1024 * 1024
        ) {

            alert(
                "Profile picture must be below 2MB."
            );

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            async () => {

                try {

                    const data =
                        await apiRequest(
                            `/api/users/${userId()}/profile-picture`,
                            {
                                method:
                                    "PUT",
                                body:
                                    JSON.stringify({
                                        profilePicture:
                                            reader.result
                                    })
                            }
                        );

                    saveUser(
                        data.user ||
                        data
                    );

                    closeModal();

                    await loadProfile();

                } catch (error) {

                    alert(
                        error.message
                    );
                }
            };

        reader.readAsDataURL(
            file
        );
    }

    /* =========================
       ONLINE STATUS
    ========================= */

    async function setOnline() {

        if (!userId()) {
            return;
        }

        try {

            await apiRequest(
                `/api/users/${userId()}/online`,
                {
                    method:
                        "PUT",
                    body:
                        JSON.stringify({})
                }
            );

        } catch (error) {
            // Ignore temporary status errors.
        }
    }

    setOnline();

    setInterval(
        setOnline,
        60000
    );

    /* =========================
       SERVICE WORKER
    ========================= */

    if (
        "serviceWorker" in
        navigator
    ) {

        navigator.serviceWorker
            .register(
                "./sw.js"
            )
            .catch(
                () => {}
            );
    }

    /* =========================
       INITIAL LOAD
    ========================= */

    updateDrawerUser();

    loadConversations();
</script>
