<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#120a22">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:#07030f;
    color:#fff;
    min-height:100vh;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.top-header{
    height:65px;
    background:#120a22;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:13px;
    border-bottom:1px solid rgba(255,255,255,.07);
    position:sticky;
    top:0;
    z-index:100;
}

.menu-button{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#ffd54a;
    font-size:21px;
}

.menu-button:active{
    transform:scale(.94);
}

.logo{
    width:40px;
    height:40px;
    object-fit:cover;
    border-radius:12px;
}

.brand{
    font-size:20px;
    font-weight:700;
    color:#ffd54a;
}

.header-spacer{
    flex:1;
}

.header-icon{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:18px;
}

/* =========================
   SEARCH
========================= */

.search-area{
    padding:13px 14px;
    background:#07030f;
}

.search-box{
    height:48px;
    background:#120a22;
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:10px;
}

.search-box i{
    color:#9d96aa;
}

.search-box input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:14px;
}

.search-box input::placeholder{
    color:#777080;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
    padding:0 14px;
}

.search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid rgba(255,255,255,.06);
    cursor:pointer;
}

.search-result:hover{
    background:rgba(255,255,255,.03);
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd54a,#ff9e00);
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    flex-shrink:0;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-details{
    flex:1;
    min-width:0;
}

.user-name{
    font-weight:600;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-about{
    color:#9d96aa;
    font-size:12px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   CONTENT
========================= */

.page-content{
    padding-bottom:80px;
}

.section-title{
    padding:12px 16px 7px;
    color:#9d96aa;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.conversation-list{
    padding:0 10px;
}

.conversation{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 7px;
    border-bottom:1px solid rgba(255,255,255,.05);
    cursor:pointer;
}

.conversation:hover{
    background:rgba(255,255,255,.03);
}

.conversation:active{
    background:rgba(255,255,255,.06);
}

.conversation-info{
    flex:1;
    min-width:0;
}

.conversation-name{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-last{
    color:#9d96aa;
    font-size:12px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:#777080;
    font-size:10px;
    white-space:nowrap;
}

/* =========================
   EMPTY
========================= */

.empty-state{
    text-align:center;
    padding:80px 25px;
    color:#9d96aa;
}

.empty-state i{
    font-size:48px;
    color:#ffd54a;
    margin-bottom:18px;
}

.empty-state h3{
    color:#fff;
    margin-bottom:7px;
}

.empty-state p{
    font-size:13px;
}

/* =========================
   GROUPS
========================= */

.groups-box{
    display:none;
    padding:10px 14px 100px;
}

.groups-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.groups-title{
    font-size:19px;
    font-weight:600;
}

.create-group-button{
    border:0;
    background:#ffd54a;
    color:#120a22;
    width:42px;
    height:42px;
    border-radius:50%;
    font-size:18px;
}

.groups-empty{
    background:#120a22;
    border-radius:18px;
    padding:55px 20px;
    text-align:center;
    border:1px solid rgba(255,255,255,.06);
}

.groups-empty i{
    font-size:48px;
    color:#ffd54a;
    margin-bottom:18px;
}

.groups-empty h3{
    font-size:17px;
    margin-bottom:7px;
}

.groups-empty p{
    color:#9d96aa;
    font-size:13px;
    line-height:1.6;
}

/* =========================
   PROFILE
========================= */

.profile-box{
    display:none;
    padding:20px;
}

.profile-card{
    background:#120a22;
    border-radius:18px;
    padding:25px 20px;
    text-align:center;
}

.profile-large{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd54a,#ff9e00);
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:700;
    overflow:hidden;
}

.profile-large img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    margin-top:12px;
    font-size:19px;
    font-weight:600;
}

.profile-email{
    color:#9d96aa;
    font-size:12px;
    margin-top:3px;
}

/* =========================
   CHAT SCREEN
========================= */

.chat-screen{
    position:fixed;
    inset:0;
    background:#07030f;
    z-index:500;
    display:none;
    flex-direction:column;
}

.chat-screen.show{
    display:flex;
}

.chat-header{
    height:66px;
    min-height:66px;
    background:#120a22;
    display:flex;
    align-items:center;
    gap:11px;
    padding:0 12px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.back-button{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:20px;
    flex-shrink:0;
}

.chat-header-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd54a,#ff9e00);
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    overflow:hidden;
    flex-shrink:0;
}

.chat-header-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-user-info{
    flex:1;
    min-width:0;
}

.chat-user-name{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-user-status{
    font-size:11px;
    color:#9d96aa;
}

.chat-user-status.online{
    color:#22c55e;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px 12px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message-row{
    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{
    max-width:78%;
    padding:9px 12px;
    border-radius:15px;
    background:#120a22;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.message-row.mine .message{
    background:#5d4800;
    border-bottom-right-radius:4px;
}

.message-row:not(.mine) .message{
    border-bottom-left-radius:4px;
}

.message-meta{
    display:block;
    text-align:right;
    font-size:9px;
    color:#aaa;
    margin-top:3px;
}

/* =========================
   MESSAGE FORM
========================= */

.message-form{
    display:flex;
    gap:8px;
    padding:10px;
    background:#120a22;
    border-top:1px solid rgba(255,255,255,.07);
}

.message-form input{
    flex:1;
    height:45px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    border-radius:24px;
    padding:0 16px;
    background:#07030f;
    color:#fff;
    font-size:14px;
}

.message-form input:focus{
    border-color:rgba(255,213,74,.4);
}

.send-button{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#ffd54a;
    color:#120a22;
    font-size:16px;
    flex-shrink:0;
}

.send-button:active{
    transform:scale(.94);
}

/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:0;
    left:-290px;
    width:280px;
    height:100vh;
    background:#120a22;
    z-index:1000;
    transition:.25s ease;
    box-shadow:8px 0 30px rgba(0,0,0,.4);
}

.side-menu.open{
    left:0;
}

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:900;
    display:none;
}

.menu-overlay.show{
    display:block;
}

.menu-top{
    padding:20px 17px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.menu-brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.menu-brand img{
    width:45px;
    height:45px;
    border-radius:13px;
    object-fit:cover;
}

.menu-brand strong{
    color:#ffd54a;
    font-size:20px;
}

.menu-items{
    padding:10px;
}

.menu-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:15px;
    padding:13px;
    border:0;
    background:transparent;
    color:#fff;
    border-radius:10px;
    text-align:left;
    font-size:14px;
}

.menu-item:hover{
    background:rgba(255,255,255,.06);
}

.menu-item i{
    width:23px;
    color:#ffd54a;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#120a22;
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;
    z-index:100;
}

.bottom-item{
    flex:1;
    border:0;
    background:transparent;
    color:#777080;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
}

.bottom-item i{
    font-size:18px;
}

.bottom-item.active{
    color:#ffd54a;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:30px;
    color:#9d96aa;
    font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:85px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#120a22;
    border:1px solid rgba(255,213,74,.3);
    color:#fff;
    padding:10px 17px;
    border-radius:25px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<div class="app">

<header class="top-header">

    <button class="menu-button" onclick="openMenu()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>

    <img
        src="./icon-192.png"
        class="logo"
        alt="VibeChat"
    >

    <div class="brand">
        VibeChat
    </div>

    <div class="header-spacer"></div>

    <button
        class="header-icon"
        onclick="focusSearch()"
        aria-label="Search"
    >
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>

</header>


<div class="search-area">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            id="searchInput"
            type="text"
            placeholder="Search VibeChat users..."
            autocomplete="off"
        >

    </div>

</div>


<div
    id="searchResults"
    class="search-results"
></div>


<main class="page-content">

    <!-- CHATS -->

    <section id="chatsSection">

        <div class="section-title">
            Chats
        </div>

        <div
            id="conversationList"
            class="conversation-list"
        >

            <div class="loading">
                Loading conversations...
            </div>

        </div>

    </section>


    <!-- GROUPS -->

    <section
        id="groupsBox"
        class="groups-box"
    >

        <div class="groups-header">

            <div class="groups-title">
                Groups
            </div>

            <button
                class="create-group-button"
                onclick="createGroup()"
                aria-label="Create group"
            >
                <i class="fa-solid fa-plus"></i>
            </button>

        </div>


        <div class="groups-empty">

            <i class="fa-solid fa-users"></i>

            <h3>
                VibeChat Groups
            </h3>

            <p>
                Create and join groups to chat,
                connect and vibe with other people.
            </p>

            <p style="margin-top:10px;">
                Group payments will be added later.
            </p>

        </div>

    </section>


    <!-- PROFILE -->

    <section
        id="profileBox"
        class="profile-box"
    >

        <div class="profile-card">

            <div
                id="profileLarge"
                class="profile-large"
            >
                U
            </div>

            <div
                id="profileName"
                class="profile-name"
            >
                User
            </div>

            <div
                id="profileEmail"
                class="profile-email"
            >
                -
            </div>

        </div>

    </section>

</main>


<!-- CHAT -->

<section
    class="chat-screen"
    id="chatScreen"
>

    <div class="chat-header">

        <button
            class="back-button"
            onclick="closeChat()"
            aria-label="Back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div
            class="chat-header-avatar"
            id="chatAvatar"
        >
            U
        </div>

        <div class="chat-user-info">

            <div
                class="chat-user-name"
                id="chatUserName"
            >
                User
            </div>

            <div
                class="chat-user-status"
                id="chatUserStatus"
            >
                Offline
            </div>

        </div>

    </div>


    <div
        class="messages"
        id="messages"
    ></div>


    <form
        class="message-form"
        id="messageForm"
    >

        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
            required
        >

        <button
            class="send-button"
            type="submit"
            aria-label="Send message"
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </form>

</section>


<!-- SIDE MENU -->

<div
    id="menuOverlay"
    class="menu-overlay"
    onclick="closeMenu()"
></div>


<aside
    id="sideMenu"
    class="side-menu"
>

    <div class="menu-top">

        <div class="menu-brand">

            <img
                src="./icon-192.png"
                alt="VibeChat"
            >

            <strong>
                VibeChat
            </strong>

        </div>

    </div>


    <div class="menu-items">

        <button
            class="menu-item"
            onclick="showChats()"
        >
            <i class="fa-solid fa-comments"></i>
            Chats
        </button>


        <button
            class="menu-item"
            onclick="showGroups()"
        >
            <i class="fa-solid fa-users"></i>
            Groups
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Stories')"
        >
            <i class="fa-solid fa-circle-play"></i>
            Stories
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Friends')"
        >
            <i class="fa-solid fa-user-group"></i>
            Friends
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Verification')"
        >
            <i class="fa-solid fa-circle-check"></i>
            Verification
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Settings')"
        >
            <i class="fa-solid fa-gear"></i>
            Settings
        </button>


        <button
            class="menu-item"
            onclick="toggleTheme()"
        >
            <i class="fa-solid fa-moon"></i>
            Theme
        </button>


        <button
            class="menu-item"
            onclick="logout()"
        >
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>

</aside>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button
        id="bottomChats"
        class="bottom-item active"
        onclick="showChats()"
    >
        <i class="fa-solid fa-comments"></i>
        Chats
    </button>


    <button
        id="bottomGroups"
        class="bottom-item"
        onclick="showGroups()"
    >
        <i class="fa-solid fa-users"></i>
        Groups
    </button>


    <button
        class="bottom-item"
        onclick="showComingSoon('Stories')"
    >
        <i class="fa-solid fa-circle-play"></i>
        Stories
    </button>


    <button
        class="bottom-item"
        onclick="showProfile()"
    >
        <i class="fa-solid fa-user"></i>
        Profile
    </button>

</nav>


<div
    id="toast"
    class="toast"
></div>

</div>

<script>

/* =========================================================
   VIBECHAT CONFIGURATION
========================================================= */

const API_URL = "https://cherychat-backend.onrender.com";

const CURRENT_USER_KEY = "cheryChatCurrentUser";
const LOGIN_KEY = "cheryChatLoggedIn";
const THEME_KEY = "vibeChatTheme";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentConversation = null;
let currentChatUser = null;

let messageRefreshTimer = null;

let searchTimer = null;


/* =========================================================
   PAGE ELEMENTS
========================================================= */

const searchInput =
    document.getElementById("searchInput");

const searchResults =
    document.getElementById("searchResults");

const conversationList =
    document.getElementById("conversationList");

const chatsSection =
    document.getElementById("chatsSection");

const groupsBox =
    document.getElementById("groupsBox");

const profileBox =
    document.getElementById("profileBox");

const chatScreen =
    document.getElementById("chatScreen");

const messagesBox =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const messageForm =
    document.getElementById("messageForm");

const chatUserName =
    document.getElementById("chatUserName");

const chatUserStatus =
    document.getElementById("chatUserStatus");

const chatAvatar =
    document.getElementById("chatAvatar");

const sideMenu =
    document.getElementById("sideMenu");

const menuOverlay =
    document.getElementById("menuOverlay");

const toast =
    document.getElementById("toast");

const profileLarge =
    document.getElementById("profileLarge");

const profileName =
    document.getElementById("profileName");

const profileEmail =
    document.getElementById("profileEmail");


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    loadTheme();

    loadUser();

    setupSearch();

    setupMessageForm();

    registerServiceWorker();

});


/* =========================================================
   LOAD CURRENT USER
========================================================= */

function loadUser(){

    const savedUser =
        localStorage.getItem(CURRENT_USER_KEY);

    const loggedIn =
        localStorage.getItem(LOGIN_KEY);

    if(!savedUser || loggedIn !== "true"){

        window.location.href = "login.html";

        return;
    }

    try{

        currentUser =
            JSON.parse(savedUser);

    }catch(error){

        console.error(
            "Invalid saved user:",
            error
        );

        localStorage.removeItem(CURRENT_USER_KEY);
        localStorage.removeItem(LOGIN_KEY);

        window.location.href = "login.html";

        return;
    }

    updateUserUI();

    loadConversations();

}


/* =========================================================
   USER HELPERS
========================================================= */

function getUserId(){

    if(!currentUser){
        return null;
    }

    return (
        currentUser.id ||
        currentUser.user_id ||
        currentUser.userId
    );
}


function getUserName(user = currentUser){

    if(!user){
        return "User";
    }

    return (
        user.full_name ||
        user.fullName ||
        user.name ||
        user.username ||
        "User"
    );
}


function getUserEmail(user = currentUser){

    if(!user){
        return "";
    }

    return (
        user.email ||
        user.phone ||
        ""
    );
}


function getUserPicture(user = currentUser){

    if(!user){
        return "";
    }

    return (
        user.profile_picture ||
        user.profilePicture ||
        user.avatar ||
        user.photo ||
        ""
    );
}


function getOnlineStatus(user){

    if(!user){
        return false;
    }

    return (
        user.is_online === true ||
        user.is_online === 1 ||
        user.isOnline === true ||
        user.online === true
    );
}

/* =========================================================
   GET OTHER USER FROM CONVERSATION
========================================================= */

function getOtherUser(conversation){

    if(!conversation){
        return null;
    }

    const userId =
        Number(getUserId());

    const possibleUsers = [

        conversation.otherUser,

        conversation.other_user,

        conversation.other_user_data,

        conversation.partner,

        conversation.recipient,

        conversation.user,

        conversation.userData

    ];

    for(const user of possibleUsers){

        if(user && typeof user === "object"){

            return user;

        }

    }

    const userOne =
        conversation.user_one ||
        conversation.userOne ||
        conversation.user1;

    const userTwo =
        conversation.user_two ||
        conversation.userTwo ||
        conversation.user2;

    if(userOne && Number(userOne) !== userId){

        return {
            id:userOne
        };

    }

    if(userTwo && Number(userTwo) !== userId){

        return {
            id:userTwo
        };

    }

    return null;

}

function renderConversations(

){

                <h3>No conversations yet</h3>

                    to start chatting.
                </p>

        return;
    }


    conversationList.innerHTML = "";

            }

/* =========================================================
   SEARCH USERS API
========================================================= */

async function searchUsers(query){

    searchResults.innerHTML = `
        <div class="loading">
            Searching...
        </div>
    `;


    try{

        const response =
            await fetch(
                `${API_URL}/api/users/search?q=${encodeURIComponent(query)}`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        let users = [];


        if(Array.isArray(data)){

            users = data;

        }else if(Array.isArray(data.users)){

            users = data.users;

        }else if(Array.isArray(data.data)){

            users = data.data;

        }


        const myId =
            Number(getUserId());


        users =
            users.filter(
                user =>
                    Number(
                        user.id ||
                        user.user_id ||
                        user.userId
                    ) !== myId
            );


        renderSearchResults(
            users
        );


    }catch(error){

        console.error(
            "User search error:",
            error
        );


        searchResults.innerHTML = `
            <div class="loading">
                Unable to search users right now.
            </div>
        `;

    }

}

/* =========================================================
   OPEN CHAT WITH USER
========================================================= */

async function openChatWithUser(
    user
){

    if(!user){
        return;
    }


    const userId =
        getUserId();


    const otherUserId =
        user.id ||
        user.user_id ||
        user.userId;


    if(!userId || !otherUserId){

        showToast(
            "User information is incomplete."
        );

        return;
    }


    searchResults.innerHTML = "";

    searchInput.value = "";


    try{

        showToast(
            "Opening chat..."
        );


        const response =
            await fetch(
                `${API_URL}/api/conversations`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        userOne:
                            Number(userId),

                        userTwo:
                            Number(otherUserId)

                    })

                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        const conversation =
            data.conversation ||
            data.data ||
            data;


        const conversationId =
            conversation.id ||
            conversation.conversation_id ||
            conversation.conversationId;


        if(!conversationId){

            throw new Error(
                "No conversation ID returned."
            );

        }


        currentConversation = {

            ...conversation,

            id:conversationId

        };


        currentChatUser =
            user;


        setupChatHeader();


        chatScreen.classList.add(
            "show"
        );


        loadMessages();

        startMessageRefresh();


        loadConversations();


        setTimeout(
            () => {

                messageInput.focus();

            },
            250
        );


    }catch(error){

        console.error(
            "Open chat error:",
            error
        );


        showToast(
            "Unable to open this chat."
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    if(!currentConversation){
        return;
    }


    const conversationId =
        currentConversation.id;


    const userId =
        getUserId();


    if(!conversationId || !userId){
        return;
    }


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages?conversationId=${encodeURIComponent(conversationId)}&userId=${encodeURIComponent(userId)}`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        let messages = [];


        if(Array.isArray(data)){

            messages = data;

        }else if(Array.isArray(data.messages)){

            messages =
                data.messages;

        }else if(Array.isArray(data.data)){

            messages =
                data.data;

        }


        renderMessages(
            messages
        );


        markMessagesRead();


    }catch(error){

        console.error(
            "Load messages error:",
            error
        );


        if(!messagesBox.children.length){

            messagesBox.innerHTML = `
                <div class="empty-state"
                     style="padding:60px 20px;">
                    <i class="fa-solid fa-message"></i>
                    <h3>Unable to load messages</h3>
                    <p>
                        Please check your connection and try again.
                    </p>
                </div>
            `;

        }

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    messages
){

    if(!Array.isArray(messages)){

        messages = [];

    }


    if(messages.length === 0){

        messagesBox.innerHTML = `
            <div class="empty-state"
                 style="padding:60px 20px;">
                <i class="fa-solid fa-comments"></i>
                <h3>Start the conversation</h3>
                <p>
                    Send your first message to ${escapeHtml(
                        getUserName(currentChatUser)
                    )}.
                </p>
            </div>
        `;

        return;
    }


    const myId =
        Number(getUserId());


    messagesBox.innerHTML = "";


    messages.forEach(
        message => {

            const senderId =
                Number(
                    message.sender_id ||
                    message.senderId ||
                    message.sender ||
                    0
                );


            const text =
                message.message_text ||
                message.messageText ||
                message.text ||
                message.message ||
                "";


            const createdAt =
                message.created_at ||
                message.createdAt ||
                message.sent_at ||
                message.sentAt ||
                "";


            const mine =
                senderId === myId;


            const row =
                document.createElement("div");


            row.className =
                "message-row" +
                (
                    mine
                    ? " mine"
                    : ""
                );


            const bubble =
                document.createElement("div");


            bubble.className =
                "message";


            bubble.innerHTML = `

                ${escapeHtml(text)}

                <span class="message-meta">
                    ${formatTime(createdAt)}
                </span>

            `;


            row.appendChild(
                bubble
            );


            messagesBox.appendChild(
                row
            );

        }
    );


    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(!text){
        return;
    }


    if(!currentConversation){

        showToast(
            "Open a chat first."
        );

        return;
    }


    const senderId =
        getUserId();


    const conversationId =
        currentConversation.id;


    if(!senderId || !conversationId){

        showToast(
            "Chat information is missing."
        );

        return;
    }


    messageInput.disabled = true;


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        conversationId:
                            Number(conversationId),

                        senderId:
                            Number(senderId),

                        messageText:
                            text

                    })

                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        messageInput.value = "";


        await loadMessages();


        loadConversations();


    }catch(error){

        console.error(
            "Send message error:",
            error
        );


        showToast(
            "Message could not be sent."
        );

    }finally{

        messageInput.disabled = false;

        messageInput.focus();

    }

}

        );

    }

}

/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    value
){

    if(!value){
        return "";
    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    const now =
        new Date();


    const sameDay =
        date.toDateString() ===
        now.toDateString();


    if(sameDay){

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }


    return date.toLocaleDateString(
        [],
        {
            day:"2-digit",
            month:"short"
        }
    );

}


/* =========================================================
   GET INITIAL
========================================================= */

function getInitial(
    name
){

    if(!name){
        return "U";
    }


    return name
        .trim()
        .charAt(0)
        .toUpperCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SERVICE WORKER
========================================================= */

function registerServiceWorker(){

    if(
        "serviceWorker" in navigator
    ){

        navigator.serviceWorker
            .register("./sw.js")
            .then(
                registration => {

                    console.log(
                        "VibeChat service worker registered:",
                        registration.scope
                    );

                }
            )
            .catch(
                error => {

                    console.warn(
                        "Service worker registration failed:",
                        error
                    );

                }
            );

    }

}
