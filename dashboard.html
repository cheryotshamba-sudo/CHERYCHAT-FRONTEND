<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#120a22">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:#07030f;
    color:#fff;
    min-height:100vh;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.top-header{
    height:65px;
    background:#120a22;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:13px;
    border-bottom:1px solid rgba(255,255,255,.07);
    position:sticky;
    top:0;
    z-index:100;
}

.menu-button{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#ffd54a;
    font-size:21px;
}

.menu-button:active{
    transform:scale(.94);
}

.logo{
    width:40px;
    height:40px;
    object-fit:cover;
    border-radius:12px;
}

.brand{
    font-size:20px;
    font-weight:700;
    color:#ffd54a;
}

.header-spacer{
    flex:1;
}

.header-icon{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:18px;
}

/* =========================
   SEARCH
========================= */

.search-area{
    padding:13px 14px;
    background:#07030f;
}

.search-box{
    height:48px;
    background:#120a22;
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:10px;
}

.search-box i{
    color:#9d96aa;
}

.search-box input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:14px;
}

.search-box input::placeholder{
    color:#777080;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
    padding:0 14px;
}

.search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid rgba(255,255,255,.06);
    cursor:pointer;
}

.search-result:hover{
    background:rgba(255,255,255,.03);
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd54a,#ff9e00);
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    flex-shrink:0;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-details{
    flex:1;
    min-width:0;
}

.user-name{
    font-weight:600;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-about{
    color:#9d96aa;
    font-size:12px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   CONTENT
========================= */

.page-content{
    padding-bottom:80px;
}

.section-title{
    padding:12px 16px 7px;
    color:#9d96aa;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.conversation-list{
    padding:0 10px;
}

.conversation{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 7px;
    border-bottom:1px solid rgba(255,255,255,.05);
    cursor:pointer;
}

.conversation:hover{
    background:rgba(255,255,255,.03);
}

.conversation:active{
    background:rgba(255,255,255,.06);
}

.conversation-info{
    flex:1;
    min-width:0;
}

.conversation-name{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-last{
    color:#9d96aa;
    font-size:12px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.conversation-time{
    color:#777080;
    font-size:10px;
    white-space:nowrap;
}

/* =========================
   EMPTY
========================= */

.empty-state{
    text-align:center;
    padding:80px 25px;
    color:#9d96aa;
}

.empty-state i{
    font-size:48px;
    color:#ffd54a;
    margin-bottom:18px;
}

.empty-state h3{
    color:#fff;
    margin-bottom:7px;
}

.empty-state p{
    font-size:13px;
}

/* =========================
   CHAT SCREEN
========================= */

.chat-screen{
    position:fixed;
    inset:0;
    background:#07030f;
    z-index:500;
    display:none;
    flex-direction:column;
}

.chat-screen.show{
    display:flex;
}

.chat-header{
    height:66px;
    min-height:66px;
    background:#120a22;
    display:flex;
    align-items:center;
    gap:11px;
    padding:0 12px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.back-button{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:20px;
    flex-shrink:0;
}

.chat-header-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd54a,#ff9e00);
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    overflow:hidden;
    flex-shrink:0;
}

.chat-header-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-user-info{
    flex:1;
    min-width:0;
}

.chat-user-name{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-user-status{
    font-size:11px;
    color:#9d96aa;
}

.chat-user-status.online{
    color:#22c55e;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px 12px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message-row{
    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{
    max-width:78%;
    padding:9px 12px;
    border-radius:15px;
    background:#120a22;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.message-row.mine .message{
    background:#5d4800;
    border-bottom-right-radius:4px;
}

.message-row:not(.mine) .message{
    border-bottom-left-radius:4px;
}

.message-meta{
    display:block;
    text-align:right;
    font-size:9px;
    color:#aaa;
    margin-top:3px;
}

/* =========================
   MESSAGE FORM
========================= */

.message-form{
    display:flex;
    gap:8px;
    padding:10px;
    background:#120a22;
    border-top:1px solid rgba(255,255,255,.07);
}

.message-form input{
    flex:1;
    height:45px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    border-radius:24px;
    padding:0 16px;
    background:#07030f;
    color:#fff;
    font-size:14px;
}

.message-form input:focus{
    border-color:rgba(255,213,74,.4);
}

.send-button{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#ffd54a;
    color:#120a22;
    font-size:16px;
    flex-shrink:0;
}

.send-button:active{
    transform:scale(.94);
}

/* =========================
   SIDE MENU
========================= */

.side-menu{
    position:fixed;
    top:0;
    left:-290px;
    width:280px;
    height:100vh;
    background:#120a22;
    z-index:1000;
    transition:.25s ease;
    box-shadow:8px 0 30px rgba(0,0,0,.4);
}

.side-menu.open{
    left:0;
}

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:900;
    display:none;
}

.menu-overlay.show{
    display:block;
}

.menu-top{
    padding:20px 17px;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.menu-brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.menu-brand img{
    width:45px;
    height:45px;
    border-radius:13px;
    object-fit:cover;
}

.menu-brand strong{
    color:#ffd54a;
    font-size:20px;
}

.menu-items{
    padding:10px;
}

.menu-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:15px;
    padding:13px;
    border:0;
    background:transparent;
    color:#fff;
    border-radius:10px;
    text-align:left;
    font-size:14px;
}

.menu-item:hover{
    background:rgba(255,255,255,.06);
}

.menu-item i{
    width:23px;
    color:#ffd54a;
}

/* =========================
   PROFILE
========================= */

.profile-box{
    display:none;
    padding:20px;
}

.profile-card{
    background:#120a22;
    border-radius:18px;
    padding:25px 20px;
    text-align:center;
}

.profile-large{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd54a,#ff9e00);
    color:#120a22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:700;
    overflow:hidden;
}

.profile-large img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    margin-top:12px;
    font-size:19px;
    font-weight:600;
}

.profile-email{
    color:#9d96aa;
    font-size:12px;
    margin-top:3px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:#120a22;
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;
    z-index:100;
}

.bottom-item{
    flex:1;
    border:0;
    background:transparent;
    color:#777080;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:10px;
}

.bottom-item i{
    font-size:18px;
}

.bottom-item.active{
    color:#ffd54a;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:30px;
    color:#9d96aa;
    font-size:13px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    bottom:85px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#120a22;
    border:1px solid rgba(255,213,74,.3);
    color:#fff;
    padding:10px 17px;
    border-radius:25px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<div class="app">

<!-- =========================
     HEADER
========================= -->

<header class="top-header">

    <button class="menu-button" onclick="openMenu()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </button>

    <img
        src="./icon-192.png"
        class="logo"
        alt="VibeChat"
    >

    <div class="brand">
        VibeChat
    </div>

    <div class="header-spacer"></div>

    <button
        class="header-icon"
        onclick="focusSearch()"
        aria-label="Search"
    >
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>

</header>


<!-- =========================
     SEARCH
========================= -->

<div class="search-area">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            id="searchInput"
            type="text"
            placeholder="Search VibeChat users..."
            autocomplete="off"
        >

    </div>

</div>

<div
    id="searchResults"
    class="search-results"
></div>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="page-content">

    <div class="section-title">
        Chats
    </div>

    <div
        id="conversationList"
        class="conversation-list"
    >

        <div class="loading">
            Loading conversations...
        </div>

    </div>


    <!-- PROFILE -->

    <section
        id="profileBox"
        class="profile-box"
    >

        <div class="profile-card">

            <div
                id="profileLarge"
                class="profile-large"
            >
                U
            </div>

            <div
                id="profileName"
                class="profile-name"
            >
                User
            </div>

            <div
                id="profileEmail"
                class="profile-email"
            >
                -
            </div>

        </div>

    </section>

</main>


<!-- =========================
     PRIVATE CHAT
========================= -->

<section
    class="chat-screen"
    id="chatScreen"
>

    <div class="chat-header">

        <button
            class="back-button"
            onclick="closeChat()"
            aria-label="Back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>


        <div
            class="chat-header-avatar"
            id="chatAvatar"
        >
            U
        </div>


        <div class="chat-user-info">

            <div
                class="chat-user-name"
                id="chatUserName"
            >
                User
            </div>

            <div
                class="chat-user-status"
                id="chatUserStatus"
            >
                Offline
            </div>

        </div>

    </div>


    <div
        class="messages"
        id="messages"
    ></div>


    <form
        class="message-form"
        id="messageForm"
    >

        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
            required
        >

        <button
            class="send-button"
            type="submit"
            aria-label="Send message"
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </form>

</section>


<!-- =========================
     SIDE MENU
========================= -->

<div
    id="menuOverlay"
    class="menu-overlay"
    onclick="closeMenu()"
></div>


<aside
    id="sideMenu"
    class="side-menu"
>

    <div class="menu-top">

        <div class="menu-brand">

            <img
                src="./icon-192.png"
                alt="VibeChat"
            >

            <strong>
                VibeChat
            </strong>

        </div>

    </div>


    <div class="menu-items">

        <button
            class="menu-item"
            onclick="showChats()"
        >
            <i class="fa-solid fa-comments"></i>
            Chats
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Groups')"
        >
            <i class="fa-solid fa-users"></i>
            Groups
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Stories')"
        >
            <i class="fa-solid fa-circle-play"></i>
            Stories
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Friends')"
        >
            <i class="fa-solid fa-user-group"></i>
            Friends
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Verification')"
        >
            <i class="fa-solid fa-circle-check"></i>
            Verification
        </button>


        <button
            class="menu-item"
            onclick="showComingSoon('Settings')"
        >
            <i class="fa-solid fa-gear"></i>
            Settings
        </button>


        <button
            class="menu-item"
            onclick="toggleTheme()"
        >
            <i class="fa-solid fa-moon"></i>
            Theme
        </button>


        <button
            class="menu-item"
            onclick="logout()"
        >
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>

</aside>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <button
        class="bottom-item active"
        onclick="showChats()"
    >
        <i class="fa-solid fa-comments"></i>
        Chats
    </button>


    <button
        class="bottom-item"
        onclick="showComingSoon('Groups')"
    >
        <i class="fa-solid fa-users"></i>
        Groups
    </button>


    <button
        class="bottom-item"
        onclick="showComingSoon('Stories')"
    >
        <i class="fa-solid fa-circle-play"></i>
        Stories
    </button>


    <button
        class="bottom-item"
        onclick="showProfile()"
    >
        <i class="fa-solid fa-user"></i>
        Profile
    </button>

</nav>


<div
    id="toast"
    class="toast"
></div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
    "https://cherychat-backend.onrender.com";

const CURRENT_USER_KEY =
    "cheryChatCurrentUser";

const LOGIN_KEY =
    "cheryChatLoggedIn";

const THEME_KEY =
    "vibeChatTheme";


let currentUser = null;

let conversations = [];

let activeConversation = null;

let activeChatUser = null;

let messageRefreshTimer = null;

let searchTimer = null;


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadUser();

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        if(searchInput){

            searchInput.addEventListener(
                "input",
                handleSearch
            );

        }


        const messageForm =
            document.getElementById(
                "messageForm"
            );

        if(messageForm){

            messageForm.addEventListener(
                "submit",
                sendMessage
            );

        }


        loadTheme();

    }
);


/* =========================================================
   LOAD CURRENT USER
========================================================= */

function loadUser(){

    try{

        const savedUser =
            localStorage.getItem(
                CURRENT_USER_KEY
            );

        const loggedIn =
            localStorage.getItem(
                LOGIN_KEY
            );


        if(
            !savedUser ||
            loggedIn !== "true"
        ){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            JSON.parse(savedUser);


        if(
            !currentUser ||
            !currentUser.id
        ){

            localStorage.removeItem(
                CURRENT_USER_KEY
            );

            localStorage.removeItem(
                LOGIN_KEY
            );

            window.location.href =
                "login.html";

            return;

        }


        updateUserUI();

        loadConversations();


    }catch(error){

        console.error(
            "Load user error:",
            error
        );


        localStorage.removeItem(
            CURRENT_USER_KEY
        );

        localStorage.removeItem(
            LOGIN_KEY
        );


        window.location.href =
            "login.html";

    }

}


/* =========================================================
   USER UI
========================================================= */

function updateUserUI(){

    const name =
        getUserName(currentUser);


    const email =
        currentUser.email ||
        currentUser.phone ||
        "";


    document.getElementById(
        "profileName"
    ).textContent = name;


    document.getElementById(
        "profileEmail"
    ).textContent = email;


    const picture =
        getUserPicture(currentUser);


    const avatar =
        document.getElementById(
            "profileLarge"
        );


    if(picture){

        avatar.innerHTML = `
            <img
                src="${escapeHtml(picture)}"
                alt="${escapeHtml(name)}"
            >
        `;

    }else{

        avatar.textContent =
            getInitial(name);

    }

}


/* =========================================================
   GET USER NAME
========================================================= */

function getUserName(user){

    if(!user){
        return "User";
    }


    return (
        user.fullName ||
        user.full_name ||
        user.name ||
        user.username ||
        user.displayName ||
        user.display_name ||
        "User"
    );

}


/* =========================================================
   GET USER ID
========================================================= */

function getUserId(user){

    if(!user){
        return null;
    }


    return (
        user.id ??
        user.userId ??
        user.user_id ??
        null
    );

}


/* =========================================================
   GET USER PICTURE
========================================================= */

function getUserPicture(user){

    if(!user){
        return "";
    }


    return (
        user.profilePicture ||
        user.profile_picture ||
        user.avatar ||
        user.avatarUrl ||
        user.avatar_url ||
        ""
    );

}


/* =========================================================
   GET ONLINE STATUS
========================================================= */

function getOnlineStatus(user){

    if(!user){
        return false;
    }


    const value =
        user.isOnline ??
        user.is_online ??
        user.online ??
        user.onlineStatus ??
        user.online_status ??
        false;


    return (
        value === true ||
        value === 1 ||
        value === "1" ||
        value === "true" ||
        value === "online" ||
        value === "Online"
    );

}


/* =========================================================
   CONVERSATIONS
========================================================= */

async function loadConversations(){

    const list =
        document.getElementById(
            "conversationList"
        );


    list.innerHTML =
        `<div class="loading">
            Loading conversations...
        </div>`;


    try{

        const response =
            await fetch(
                `${API_URL}/api/conversations?userId=${encodeURIComponent(currentUser.id)}`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        console.log(
            "VibeChat conversations response:",
            data
        );


        if(Array.isArray(data)){

            conversations =
                data;

        }else if(
            data &&
            Array.isArray(data.conversations)
        ){

            conversations =
                data.conversations;

        }else{

            conversations = [];

        }


        renderConversations();


    }catch(error){

        console.error(
            "Conversation loading error:",
            error
        );


        list.innerHTML = `
            <div class="empty-state">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h3>
                    Unable to load chats
                </h3>

                <p>
                    Please check your connection and try again.
                </p>

            </div>
        `;

    }

}


/* =========================================================
   GET OTHER USER FROM CONVERSATION
========================================================= */

function getOtherUser(chat){

    if(!chat){
        return {};
    }


    /*
     * Most common backend formats.
     */

    const nestedUser =
        chat.otherUser ||
        chat.other_user ||
        chat.otherUserData ||
        chat.other_user_data ||
        chat.otherUserInfo ||
        chat.other_user_info ||
        chat.user ||
        chat.userData ||
        chat.user_data ||
        chat.recipient ||
        chat.recipientUser ||
        chat.recipient_user ||
        chat.contact ||
        chat.contactUser ||
        chat.contact_user;


    if(
        nestedUser &&
        typeof nestedUser === "object"
    ){

        return nestedUser;

    }


    /*
     * Some APIs put the other user's
     * information directly on the
     * conversation object.
     */

    const directUser = {

        id:
            chat.otherUserId ??
            chat.other_user_id ??
            chat.otherUserID ??
            chat.other_userID ??
            chat.recipientId ??
            chat.recipient_id ??
            chat.contactId ??
            chat.contact_id,

        fullName:
            chat.otherUserName ||
            chat.other_user_name ||
            chat.recipientName ||
            chat.recipient_name ||
            chat.contactName ||
            chat.contact_name,

        email:
            chat.otherUserEmail ||
            chat.other_user_email ||
            chat.recipientEmail ||
            chat.recipient_email,

        profilePicture:
            chat.otherUserProfilePicture ||
            chat.other_user_profile_picture ||
            chat.recipientProfilePicture ||
            chat.recipient_profile_picture ||
            chat.contactProfilePicture ||
            chat.contact_profile_picture,

        isOnline:
            chat.otherUserIsOnline ??
            chat.other_user_is_online ??
            chat.recipientIsOnline ??
            chat.recipient_is_online ??
            chat.contactIsOnline ??
            chat.contact_is_online

    };


    if(
        directUser.id ||
        directUser.fullName ||
        directUser.email
    ){

        return directUser;

    }


    /*
     * Some backends return participants/users.
     */

    const participants =
        chat.participants ||
        chat.users ||
        chat.members;


    if(Array.isArray(participants)){

        const other =
            participants.find(
                person =>
                    Number(getUserId(person)) !==
                    Number(currentUser.id)
            );


        if(other){

            return other;

        }

    }


    return {};

}


/* =========================================================
   RENDER CONVERSATIONS
========================================================= */

function renderConversations(){

    const list =
        document.getElementById(
            "conversationList"
        );


    if(!conversations.length){

        list.innerHTML = `
            <div class="empty-state">

                <i class="fa-solid fa-comments"></i>

                <h3>
                    No conversations yet
                </h3>

                <p>
                    Search for another VibeChat user to start chatting.
                </p>

            </div>
        `;

        return;

    }


    list.innerHTML = "";


    conversations.forEach(
        chat => {

            const user =
                getOtherUser(chat);


            const name =
                getUserName(user);


            const picture =
                getUserPicture(user);


            const lastMessage =
                chat.lastMessage ||
                chat.last_message ||
                chat.message ||
                chat.messageText ||
                chat.message_text ||
                "";


            const conversationId =
                chat.conversationId ??
                chat.conversation_id ??
                chat.id;


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "conversation";


            const initial =
                getInitial(name);


            item.innerHTML = `

                <div class="avatar">

                    ${
                        picture

                        ?

                        `
                        <img
                            src="${escapeHtml(picture)}"
                            alt="${escapeHtml(name)}"
                            onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(initial)}'"
                        >
                        `

                        :

                        escapeHtml(initial)
                    }

                </div>


                <div class="conversation-info">

                    <div class="conversation-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="conversation-last">

                        ${
                            lastMessage
                            ? escapeHtml(lastMessage)
                            : "No messages yet"
                        }

                    </div>

                </div>


                <div class="conversation-time">

                    ${formatTime(
                        chat.lastMessageAt ||
                        chat.last_message_at ||
                        chat.updatedAt ||
                        chat.updated_at ||
                        chat.createdAt ||
                        chat.created_at
                    )}

                </div>

            `;


            item.addEventListener(
                "click",
                () =>
                    openExistingConversation(
                        chat
                    )
            );


            list.appendChild(item);

        }
    );

}


/* =========================================================
   OPEN EXISTING CONVERSATION
========================================================= */

async function openExistingConversation(
    chat
){

    try{

        console.log(
            "Opening conversation:",
            chat
        );


        const conversationId =
            chat.conversationId ??
            chat.conversation_id ??
            chat.id;


        if(!conversationId){

            showToast(
                "Conversation ID is missing."
            );

            return;

        }


        activeConversation = {

            id:
                Number(conversationId)

        };


        activeChatUser =
            getOtherUser(chat);


        /*
         * If no user was returned,
         * keep an object instead of crashing.
         */

        if(!activeChatUser){

            activeChatUser = {};

        }


        console.log(
            "Selected chat user:",
            activeChatUser
        );


        setupChatHeader();


        document
            .getElementById(
                "chatScreen"
            )
            .classList.add(
                "show"
            );


        await loadMessages();


        await markMessagesRead();


        startMessageRefresh();


        setTimeout(
            () => {

                const input =
                    document.getElementById(
                        "messageInput"
                    );


                if(input){

                    input.focus();

                }

            },
            150
        );


    }catch(error){

        console.error(
            "Open chat error:",
            error
        );


        showToast(
            "Unable to open this chat."
        );

    }

}


/* =========================================================
   CHAT HEADER
========================================================= */

function setupChatHeader(){

    const user =
        activeChatUser || {};


    const name =
        getUserName(user);


    const picture =
        getUserPicture(user);


    const isOnline =
        getOnlineStatus(user);


    const nameElement =
        document.getElementById(
            "chatUserName"
        );


    const statusElement =
        document.getElementById(
            "chatUserStatus"
        );


    const avatarElement =
        document.getElementById(
            "chatAvatar"
        );


    nameElement.textContent =
        name;


    if(isOnline){

        statusElement.textContent =
            "Online";

        statusElement.classList.add(
            "online"
        );

    }else{

        statusElement.textContent =
            "Offline";

        statusElement.classList.remove(
            "online"
        );

    }


    if(picture){

        avatarElement.innerHTML = `

            <img
                src="${escapeHtml(picture)}"
                alt="${escapeHtml(name)}"
                onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(getInitial(name))}'"
            >

        `;

    }else{

        avatarElement.textContent =
            getInitial(name);

    }

}


/* =========================================================
   SEARCH
========================================================= */

function handleSearch(event){

    const query =
        event.target.value.trim();


    clearTimeout(
        searchTimer
    );


    if(!query){

        document
            .getElementById(
                "searchResults"
            )
            .innerHTML = "";


        return;

    }


    searchTimer =
        setTimeout(
            () => searchUsers(query),
            350
        );

}


/* =========================================================
   SEARCH USERS
========================================================= */

async function searchUsers(
    query
){

    const container =
        document.getElementById(
            "searchResults"
        );


    container.innerHTML =
        `<div class="loading">
            Searching...
        </div>`;


    try{

        const response =
            await fetch(
                `${API_URL}/api/users/search?q=${encodeURIComponent(query)}`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        console.log(
            "VibeChat search response:",
            data
        );


        let users = [];


        if(Array.isArray(data)){

            users = data;

        }else if(
            data &&
            Array.isArray(data.users)
        ){

            users =
                data.users;

        }


        const filtered =
            users.filter(
                user =>
                    Number(
                        getUserId(user)
                    ) !==
                    Number(
                        currentUser.id
                    )
            );


        if(!filtered.length){

            container.innerHTML = `
                <div class="loading">
                    No users found.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        filtered.forEach(
            user => {

                const name =
                    getUserName(user);


                const about =
                    user.about ||
                    user.bio ||
                    "VibeChat user";


                const picture =
                    getUserPicture(user);


                const result =
                    document.createElement(
                        "div"
                    );


                result.className =
                    "search-result";


                result.innerHTML = `

                    <div class="avatar">

                        ${
                            picture

                            ?

                            `
                            <img
                                src="${escapeHtml(picture)}"
                                alt="${escapeHtml(name)}"
                            >
                            `

                            :

                            escapeHtml(
                                getInitial(name)
                            )
                        }

                    </div>


                    <div class="user-details">

                        <div class="user-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="user-about">
                            ${escapeHtml(about)}
                        </div>

                    </div>

                `;


                result.addEventListener(
                    "click",
                    () =>
                        openChatWithUser(
                            user
                        )
                );


                container.appendChild(
                    result
                );

            }
        );


    }catch(error){

        console.error(
            "Search error:",
            error
        );


        container.innerHTML = `
            <div class="loading">
                Search failed.
            </div>
        `;

    }

}


/* =========================================================
   OPEN CHAT WITH SEARCH USER
========================================================= */

async function openChatWithUser(
    user
){

    try{

        const otherUserId =
            getUserId(user);


        if(!otherUserId){

            showToast(
                "User ID is missing."
            );

            return;

        }


        const response =
            await fetch(
                `${API_URL}/api/conversations`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        userId:
                            currentUser.id,

                        otherUserId:
                            otherUserId

                    })

                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        console.log(
            "Create conversation response:",
            data
        );


        const conversation =
            data.conversation ||
            data;


        const conversationId =
            conversation.id ??
            conversation.conversationId ??
            conversation.conversation_id;


        if(!conversationId){

            throw new Error(
                "Conversation ID was not returned."
            );

        }


        activeConversation = {

            id:
                Number(conversationId)

        };


        activeChatUser =
            user;


        setupChatHeader();


        document
            .getElementById(
                "searchInput"
            )
            .value = "";


        document
            .getElementById(
                "searchResults"
            )
            .innerHTML = "";


        document
            .getElementById(
                "chatScreen"
            )
            .classList.add(
                "show"
            );


        await loadMessages();


        startMessageRefresh();


        setTimeout(
            () => {

                const input =
                    document.getElementById(
                        "messageInput"
                    );


                if(input){

                    input.focus();

                }

            },
            150
        );


    }catch(error){

        console.error(
            "Create conversation error:",
            error
        );


        showToast(
            "Unable to start chat."
        );

    }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    if(
        !activeConversation ||
        !activeConversation.id
    ){

        return;

    }


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages?conversationId=${encodeURIComponent(activeConversation.id)}&userId=${encodeURIComponent(currentUser.id)}`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        console.log(
            "VibeChat messages response:",
            data
        );


        let messages = [];


        if(Array.isArray(data)){

            messages =
                data;

        }else if(
            data &&
            Array.isArray(data.messages)
        ){

            messages =
                data.messages;

        }


        renderMessages(
            messages
        );


    }catch(error){

        console.error(
            "Message loading error:",
            error
        );

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(
    messages
){

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    if(!messages.length){

        container.innerHTML = `

            <div
                class="empty-state"
                style="padding:40px 15px;"
            >

                <i class="fa-solid fa-message"></i>

                <h3>
                    No messages yet
                </h3>

                <p>
                    Start the conversation.
                </p>

            </div>

        `;

        return;

    }


    messages.forEach(
        message => {

            const text =
                message.message ||
                message.messageText ||
                message.message_text ||
                message.text ||
                "";


            const senderId =
                message.senderId ??
                message.sender_id ??
                message.userId ??
                message.user_id;


            const mine =
                Number(senderId) ===
                Number(currentUser.id);


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row" +
                (
                    mine
                    ? " mine"
                    : ""
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message";


            bubble.innerHTML = `

                ${escapeHtml(text)}

                <span class="message-meta">

                    ${formatTime(
                        message.createdAt ||
                        message.created_at
                    )}

                </span>

            `;


            row.appendChild(
                bubble
            );


            container.appendChild(
                row
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(
    event
){

    event.preventDefault();


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    if(
        !activeConversation ||
        !activeConversation.id
    ){

        showToast(
            "Open a chat first."
        );

        return;

    }


    input.disabled =
        true;


    try{

        const response =
            await fetch(
                `${API_URL}/api/messages`,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        conversationId:
                            activeConversation.id,

                        senderId:
                            currentUser.id,

                        messageText:
                            text

                    })

                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        input.value = "";


        await loadMessages();


        /*
         * Refresh the conversation list so
         * the latest message appears there.
         */

        loadConversations();


    }catch(error){

        console.error(
            "Send message error:",
            error
        );


        showToast(
            "Message could not be sent."
        );


    }finally{

        input.disabled =
            false;


        input.focus();

    }

}


/* =========================================================
   MARK MESSAGES READ
========================================================= */

async function markMessagesRead(){

    if(
        !activeConversation ||
        !activeConversation.id
    ){

        return;

    }


    try{

        await fetch(
            `${API_URL}/api/messages/read`,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    conversationId:
                        activeConversation.id,

                    userId:
                        currentUser.id

                })

            }
        );


    }catch(error){

        console.error(
            "Mark read error:",
            error
        );

    }

}


/* =========================================================
   MESSAGE REFRESH
========================================================= */

function startMessageRefresh(){

    stopMessageRefresh();


    messageRefreshTimer =
        setInterval(
            async () => {

                if(
                    activeConversation &&
                    activeConversation.id
                ){

                    await loadMessages();

                }

            },
            3000
        );

}


/* =========================================================
   STOP MESSAGE REFRESH
========================================================= */

function stopMessageRefresh(){

    if(
        messageRefreshTimer
    ){

        clearInterval(
            messageRefreshTimer
        );


        messageRefreshTimer =
            null;

    }

}


/* =========================================================
   CLOSE CHAT
========================================================= */

function closeChat(){

    stopMessageRefresh();


    document
        .getElementById(
            "chatScreen"
        )
        .classList.remove(
            "show"
        );


    activeConversation =
        null;


    activeChatUser =
        null;


    loadConversations();

}

/* =========================================================
   THEME
========================================================= */

function loadTheme(){

    const theme =
        localStorage.getItem(
            THEME_KEY
        );


    if(theme === "light"){

        document.body.style.background =
            "#f5f5f5";

    }else{

        document.body.style.background =
            "#07030f";

    }

}


function toggleTheme(){

    const current =
        localStorage.getItem(
            THEME_KEY
        );


    if(current === "light"){

        localStorage.setItem(
            THEME_KEY,
            "dark"
        );


        document.body.style.background =
            "#07030f";


    }else{

        localStorage.setItem(
            THEME_KEY,
            "light"
        );


        document.body.style.background =
            "#f5f5f5";

    }

}

   LOGOUT
========================================================= */

        if(
            currentUser &&
            currentUser.id
        ){

            await fetch(
                `${API_URL}/api/users/logout-status`,
                {

                    method:"POST",

/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    value
){

    if(!value){

        return "";

    }


    try{

        const date =
            new Date(value);


        if(
            isNaN(
                date.getTime()
            )
        ){

            return "";

        }


        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    }catch(error){

        return "";

    }

}


/* =========================================================
   GET INITIAL
========================================================= */

function getInitial(
    name
){

    const text =
        String(
            name || "U"
        ).trim();


    if(!text){

        return "U";

    }


    return text
        .charAt(0)
        .toUpperCase();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "./sw.js"
                )
                .catch(
                    error =>
                        console.error(
                            "Service worker error:",
                            error
                        )
                );

        }
    );

}
