<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>VibeChat</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#120a22">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #07030f;
            color: #ffffff;
            overflow: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 64px;
            min-height: 64px;
            background: #120a22;
            border-bottom: 1px solid #2b1940;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            z-index: 20;
        }

        .menu-button,
        .header-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #211332;
            color: #ffd54a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .brand {
            flex: 1;
            font-size: 20px;
            font-weight: 700;
            color: #ffd54a;
        }

        /* MAIN */

        .main {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 14px 14px 90px;
        }

        .page.active {
            display: block;
        }

        .page-inner {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        /* SEARCH */

        .search-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #120a22;
            border: 1px solid #2b1940;
            border-radius: 14px;
            padding: 11px 14px;
            margin-bottom: 14px;
        }

        .search-box i {
            color: #9d96aa;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #777080;
        }

        /* CARDS */

        .card {
            background: #120a22;
            border: 1px solid #2b1940;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 21px;
            font-weight: 700;
        }

        .section-subtitle {
            color: #9d96aa;
            font-size: 12px;
            margin-top: 3px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* AVATARS */

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: #211332;
            flex-shrink: 0;
        }

        .avatar-small {
            width: 42px;
            height: 42px;
        }

        .avatar-large {
            width: 82px;
            height: 82px;
        }

        /* LISTS */

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 4px;
            border-bottom: 1px solid #251635;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-content {
            flex: 1;
            min-width: 0;
        }

        .list-name {
            font-size: 14px;
            font-weight: 600;
        }

        .list-preview {
            color: #9d96aa;
            font-size: 12px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-left: 5px;
        }

        /* BUTTONS */

        .button {
            background: linear-gradient(135deg, #ffd54a, #ff9e00);
            color: #160b20;
            font-weight: 700;
            border-radius: 11px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .button.secondary {
            background: #211332;
            border: 1px solid #3a2450;
            color: #ffffff;
        }

        .button.danger {
            background: #6c1e2b;
            color: #ffffff;
        }

        .button-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #211332;
            color: #ffd54a;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .button-row .button {
            flex: 1;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 55px 20px;
            color: #9d96aa;
        }

        .empty i {
            color: #ffd54a;
            font-size: 44px;
            margin-bottom: 14px;
        }

        .empty h3 {
            color: #ffffff;
            font-size: 17px;
            margin-bottom: 5px;
        }

        .empty p {
            font-size: 12px;
            line-height: 1.6;
        }

        /* BOTTOM NAV */

        .bottom-nav {
            height: 68px;
            min-height: 68px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #120a22;
            border-top: 1px solid #2b1940;
            display: flex;
            z-index: 30;
        }

        .nav-button {
            flex: 1;
            background: transparent;
            color: #827a8f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 10px;
        }

        .nav-button i {
            font-size: 19px;
        }

        .nav-button.active {
            color: #ffd54a;
        }

        /* DRAWER */

        .drawer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: none;
        }

        .drawer.show {
            display: block;
        }

        .drawer-panel {
            width: 290px;
            max-width: 84%;
            height: 100%;
            background: #120a22;
            border-right: 1px solid #38214c;
            padding: 20px 14px;
        }

        .drawer-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .drawer-profile img {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            object-fit: cover;
        }

        .drawer-brand {
            color: #ffd54a;
            font-size: 19px;
            font-weight: 700;
        }

        .drawer-menu {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .drawer-item {
            width: 100%;
            padding: 14px 12px;
            border-radius: 12px;
            background: transparent;
            color: #ffffff;
            text-align: left;
            font-size: 14px;
        }

        .drawer-item:hover {
            background: #211332;
        }

        .drawer-item i {
            width: 28px;
            color: #ffd54a;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            background: #120a22;
            border: 1px solid #3a2450;
            border-radius: 18px;
            padding: 18px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .close-button {
            background: transparent;
            color: #ffffff;
            font-size: 23px;
            width: 35px;
            height: 35px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 13px;
        }

        .form-group label {
            display: block;
            color: #9d96aa;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: #09050f;
            color: #ffffff;
            border: 1px solid #3a2450;
            border-radius: 11px;
            padding: 12px;
            outline: none;
        }

        textarea.form-control {
            min-height: 90px;
            resize: vertical;
        }

        /* CHAT */

        .chat-screen {
            position: fixed;
            inset: 0;
            background: #07030f;
            z-index: 150;
            display: none;
            flex-direction: column;
        }

        .chat-screen.show {
            display: flex;
        }

        .chat-header {
            height: 64px;
            min-height: 64px;
            background: #120a22;
            border-bottom: 1px solid #2b1940;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
        }

        .chat-back {
            width: 40px;
            height: 40px;
            background: transparent;
            color: #ffffff;
            font-size: 19px;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-name {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-header-status {
            color: #9d96aa;
            font-size: 11px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message-bubble {
            max-width: 78%;
            padding: 9px 12px;
            margin-bottom: 8px;
            border-radius: 15px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message-bubble.mine {
            margin-left: auto;
            background: #6a4c00;
            border-bottom-right-radius: 4px;
        }

        .message-bubble.theirs {
            margin-right: auto;
            background: #211332;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #120a22;
            border-top: 1px solid #2b1940;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            background: #09050f;
            color: #ffffff;
            border: 1px solid #3a2450;
            border-radius: 23px;
            padding: 11px 15px;
            outline: none;
        }

        .send-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ffd54a;
            color: #170c20;
        }

        /* STORIES */

        .story-bar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 3px 2px 15px;
        }

        .story-item {
            width: 68px;
            min-width: 68px;
            text-align: center;
            color: #aaa2b1;
            font-size: 10px;
        }

        .story-image {
            width: 62px;
            height: 62px;
            margin: 0 auto 5px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffd54a;
            padding: 2px;
            background: #120a22;
        }

        .story-add .story-image {
            border-style: dashed;
        }

        .story-media {
            width: 100%;
            max-height: 65vh;
            object-fit: contain;
            background: #000000;
            border-radius: 12px;
        }

        /* PROFILE */

        .profile-card {
            text-align: center;
            padding: 25px 15px;
        }

        .profile-picture-wrap {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
        }

        .profile-picture-wrap img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffd54a;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
        }

        .profile-about {
            color: #9d96aa;
            font-size: 13px;
            margin-top: 4px;
        }

        .profile-contact {
            color: #777080;
            font-size: 11px;
            margin-top: 5px;
        }

        /* GROUP */

        .group-icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: #251638;
            color: #ffd54a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            flex-shrink: 0;
        }

        .group-members {
            color: #9d96aa;
            font-size: 11px;
            margin-top: 2px;
        }

        .group-type {
            display: inline-block;
            color: #ffd54a;
            font-size: 10px;
            margin-top: 3px;
        }

        /* LIGHT THEME */

        body.light-theme {
            background: #f4f1f8;
            color: #17111d;
        }

        body.light-theme .header,
        body.light-theme .bottom-nav,
        body.light-theme .card,
        body.light-theme .search-box,
        body.light-theme .drawer-panel,
        body.light-theme .modal-box,
        body.light-theme .chat-header,
        body.light-theme .chat-input-area {
            background: #ffffff;
        }

        body.light-theme .header,
        body.light-theme .bottom-nav,
        body.light-theme .chat-header,
        body.light-theme .chat-input-area {
            border-color: #ddd5e4;
        }

        body.light-theme .card,
        body.light-theme .search-box {
            border-color: #ddd5e4;
        }

        body.light-theme .list-item {
            border-color: #e5dfe9;
        }

        body.light-theme .menu-button,
        body.light-theme .header-button,
        body.light-theme .button.secondary,
        body.light-theme .button-icon {
            background: #eee9f1;
            color: #5d4b69;
        }

        body.light-theme .drawer-item {
            color: #17111d;
        }

        body.light-theme .drawer-item:hover {
            background: #eee9f1;
        }

        body.light-theme .search-box input,
        body.light-theme .form-control,
        body.light-theme .chat-input {
            color: #17111d;
        }

        body.light-theme .search-box input::placeholder,
        body.light-theme .chat-input::placeholder {
            color: #918895;
        }

        body.light-theme .form-control,
        body.light-theme .chat-input {
            background: #f5f2f7;
            border-color: #d9d1df;
        }

        body.light-theme .message-bubble.theirs {
            background: #e9e1ed;
            color: #17111d;
        }

        body.light-theme .empty h3 {
            color: #17111d;
        }

        @media (min-width: 700px) {
            .page {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <!-- LEFT SIDE MENU -->
        <button class="menu-button" id="menuButton">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <img
            src="./icon-192.png"
            class="logo"
            alt="VibeChat"
        >

        <div class="brand">
            VibeChat
        </div>

        <button class="header-button" id="refreshButton">
            <i class="fa-solid fa-rotate"></i>
        </button>

    </header>

    <!-- MAIN -->
    <main class="main">

        <!-- CHATS -->
        <section class="page active" id="chatsPage">

            <div class="page-inner">

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="userSearch"
                        placeholder="Search VibeChat users..."
                        autocomplete="off"
                    >
                </div>

                <div id="searchResults"></div>

                <div id="chatList"></div>

            </div>

        </section>

        <!-- GROUPS -->
        <section class="page" id="groupsPage">

            <div class="page-inner">

                <div class="section-header">

                    <div>
                        <div class="section-title">Groups</div>
                        <div class="section-subtitle">
                            Find and chat in VibeChat groups
                        </div>
                    </div>

                    <button class="button-icon" id="createGroupButton">
                        <i class="fa-solid fa-plus"></i>
                    </button>

                </div>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="groupSearch"
                        placeholder="Search groups..."
                        autocomplete="off"
                    >
                </div>

                <div id="groupsList"></div>

            </div>

        </section>

        <!-- STORIES -->
        <section class="page" id="storiesPage">

            <div class="page-inner">

                <div class="section-header">

                    <div>
                        <div class="section-title">Stories</div>
                        <div class="section-subtitle">
                            Photos and videos disappear after 24 hours
                        </div>
                    </div>

                    <button class="button-icon" id="addStoryButton">
                        <i class="fa-solid fa-plus"></i>
                    </button>

                </div>

                <div id="storiesList"></div>

            </div>

        </section>

        <!-- PROFILE -->
        <section class="page" id="profilePage">

            <div class="page-inner">

                <div id="profileContent"></div>

            </div>

        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button
            class="nav-button active"
            data-page="chatsPage"
        >
            <i class="fa-solid fa-comments"></i>
            <span>Chats</span>
        </button>

        <button
            class="nav-button"
            data-page="groupsPage"
        >
            <i class="fa-solid fa-users"></i>
            <span>Groups</span>
        </button>

        <button
            class="nav-button"
            data-page="storiesPage"
        >
            <i class="fa-solid fa-circle-play"></i>
            <span>Stories</span>
        </button>

        <button
            class="nav-button"
            data-page="profilePage"
        >
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </button>

    </nav>

</div>

<!-- SIDE DRAWER -->
<div class="drawer" id="drawer">

    <div class="drawer-panel">

        <div class="drawer-profile">

            <img
                src="./icon-192.png"
                id="drawerLogo"
                alt="VibeChat"
            >

            <div>
                <div class="drawer-brand">
                    VibeChat
                </div>

                <div class="section-subtitle">
                    Chat, connect and vibe
                </div>
            </div>

        </div>

        <div class="drawer-menu">

            <button
                class="drawer-item"
                data-page="chatsPage"
            >
                <i class="fa-solid fa-comments"></i>
                Chats
            </button>

            <button
                class="drawer-item"
                data-page="groupsPage"
            >
                <i class="fa-solid fa-users"></i>
                Groups
            </button>

            <button
                class="drawer-item"
                data-page="storiesPage"
            >
                <i class="fa-solid fa-circle-play"></i>
                Stories
            </button>

            <button
                class="drawer-item"
                data-page="profilePage"
            >
                <i class="fa-solid fa-user"></i>
                Profile
            </button>

            <button
                class="drawer-item"
                id="themeButton"
            >
                <i class="fa-solid fa-moon"></i>
                Theme
            </button>

            <button
                class="drawer-item"
                id="logoutButton"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>

    </div>

</div>

<!-- GENERAL MODAL -->
<div class="modal" id="modal">

    <div class="modal-box" id="modalBox"></div>

</div>

<!-- PRIVATE CHAT -->
<div class="chat-screen" id="chatScreen">

    <div class="chat-header">

        <button
            class="chat-back"
            id="chatBackButton"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <img
            class="avatar avatar-small"
            id="chatAvatar"
            src="./icon-192.png"
            alt=""
        >

        <div class="chat-header-info">

            <div
                class="chat-header-name"
                id="chatName"
            >
                User
            </div>

            <div
                class="chat-header-status"
                id="chatStatus"
            ></div>

        </div>

    </div>

    <div
        class="chat-messages"
        id="chatMessages"
    ></div>

    <div class="chat-input-area">

        <input
            type="text"
            class="chat-input"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button
            class="send-button"
            id="sendMessageButton"
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </div>

</div>

<script>
    const API_URL = "https://cherychat-backend.onrender.com";

    let currentUser = null;
    let currentChatUser = null;
    let currentGroup = null;
    let currentStories = [];
    let currentGroups = [];
    let messageRefreshTimer = null;
    let groupSearchTimer = null;
    let userSearchTimer = null;

    const $ = (id) => document.getElementById(id);

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getStoredUser() {
        try {
            const newUser = localStorage.getItem("vibeChatCurrentUser");

            if (newUser) {
                return JSON.parse(newUser);
            }

            const oldUser = localStorage.getItem("cheryChatCurrentUser");

            if (oldUser) {
                return JSON.parse(oldUser);
            }

            return null;

        } catch (error) {
            return null;
        }
    }

    currentUser = getStoredUser();

    if (!currentUser) {
        window.location.href = "login.html";
    }

    function userId() {

    async function apiRequest(endpoint, options = {}) {

        const response = await fetch(
            API_URL + endpoint,
            {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            }
        );

        let data = {};

        try {
            data = await response.json();
        } catch (error) {
            data = {};
        }

        if (!response.ok) {
            throw new Error(
                data.message || "Something went wrong."
            );
        }

        return data;
    }

    async function openPrivateChat(otherUser) {

        currentChatUser = otherUser;

        const name =
            otherUser.fullName ||

            "VibeChat User";

        const picture =
            otherUser.profilePicture ||

        $("chatAvatar").src = picture;

        $("chatStatus").innerHTML =
            otherUser.isOnline ||
            otherUser.is_online
                ? `<span style="color:#22c55e">online</span>`
                : "";

        $("chatScreen").classList.add("show");

        try {

            await apiRequest(
                "/api/conversations",
                {
                    method: "POST",
                    body: JSON.stringify({
                        userId: userId(),
                        otherUserId:
                            otherUser.id ||
                            otherUser.userId

                }
            );

            // Conversation may already exist.
        }

    async function loadPrivateMessages() {

        if (!currentChatUser) {
            return;
        }

        try {

            const otherId =
                currentChatUser.id ||
                currentChatUser.userId;

            const data = await apiRequest(
                `/api/messages?userId=${encodeURIComponent(userId())}&otherUserId=${encodeURIComponent(otherId)}`
            );

            const messages =
                data.messages || data || [];

            if (!messages.length) {

                $("chatMessages").innerHTML = `
                    <div class="empty">
                        <i class="fa-regular fa-message"></i>
                        <h3>No messages yet</h3>
                        <p>Say hello and start the conversation.</p>
                    </div>
                `;

                return;
            }

            $("chatMessages").innerHTML =
                messages
                    .map((message) => {

                        const senderId =
                            message.senderId ||
                            message.sender_id;

                        const text =
                            message.messageText ||
                            message.message_text ||
                            "";

                        const mine =
                            String(senderId) ===
                            String(userId());

                        return `
                            <div class="message-bubble ${mine ? "mine" : "theirs"}">
                                ${escapeHTML(text)}
                            </div>
                        `;

                    })
                    .join("");

            $("chatMessages").scrollTop =
                $("chatMessages").scrollHeight;

            await apiRequest(
                "/api/messages/read",
                {
                    method: "PUT",
                    body: JSON.stringify({
                        userId: userId(),
                        otherUserId:
                            currentChatUser.id ||
                            currentChatUser.userId
                    })
                }
            ).catch(() => {});

        } catch (error) {

            $("chatMessages").innerHTML = `
                <div class="empty">
                    Unable to load messages.
                </div>
            `;
        }
    }

    async function sendPrivateMessage() {

        const input = $("messageInput");

        const text =
            input.value.trim();

        if (!text || !currentChatUser) {
            return;
        }

        input.value = "";

        try {

            await apiRequest(
                "/api/messages",
                {
                    method: "POST",
                    body: JSON.stringify({
                        senderId: userId(),
                        receiverId:
                            currentChatUser.id ||
                            currentChatUser.userId,
                        messageText: text
                    })
                }
            );

            await loadPrivateMessages();

        } catch (error) {

            alert(error.message);
        }
    }

    async function uploadStory() {

        const file =
            $("storyFile").files[0];

        const caption =
            $("storyCaption").value.trim();

        if (!file) {
            alert("Choose a photo or video.");
            return;
        }

        const isVideo =
            file.type.startsWith("video/");

        const maxSize =
            isVideo
                ? 8 * 1024 * 1024
                : 4 * 1024 * 1024;

        if (file.size > maxSize) {

            alert(
                isVideo
                    ? "Video must be below 8MB."
                    : "Image must be below 4MB."
            );

            return;
        }

        const reader =
            new FileReader();

        reader.onload = async () => {

            try {

                await apiRequest(
                    "/api/stories",
                    {
                        method: "POST",
                        body: JSON.stringify({
                            userId: userId(),
                            mediaType:
                                isVideo
                                    ? "video"
                                    : "image",
                            mediaData:
                                reader.result,
                            caption
                        })
                    }
                );

                closeModal();

                await loadStories();

            } catch (error) {

                alert(error.message);
            }
        };

        reader.readAsDataURL(file);
    }

        }

        try {

            const data =
                await apiRequest(
                    "/api/groups",
                    {
                        method: "POST",
                        body: JSON.stringify({
                            ownerId: userId(),
                            name,
                            description,
                            groupType
                        })
                    }
                );

            closeModal();

            await loadGroups();

            if (data.group) {
                viewGroup(data.group);
            }

        } catch (error) {

            alert(error.message);
        }
    }

    async function joinGroup(group) {

        const isMember =
            group.isMember ||
            group.is_member;

        if (isMember) {
            viewGroup(group);
            return;
        }

        const type =
            group.groupType ||
            group.group_type ||
            "public";

        try {

            if (type === "private") {

                await apiRequest(
                    `/api/groups/${group.id}/request`,
                    {
                        method: "POST",
                        body: JSON.stringify({
                            userId: userId()
                        })
                    }
                );

                alert(
                    "Your request to join the private group has been sent."
                );

            } else {

                await apiRequest(
                    `/api/groups/${group.id}/join`,
                    {
                        method: "POST",
                        body: JSON.stringify({
                            userId: userId()
                        })
                    }
                );

                await loadGroups();

                viewGroup({
                    ...group,
                    isMember: true
                });
            }

        } catch (error) {

            alert(error.message);
        }
    }

    /* GROUP VIEW */

    async function viewGroup(group) {

        currentGroup = group;

        try {

            const data =
                await apiRequest(
                    `/api/groups/${group.id}?userId=${encodeURIComponent(userId())}`
                );

            currentGroup =
                data.group || group;

        } catch (error) {
            // Use existing group information.
        }

        const groupData =
            currentGroup;

        openModal(`
            <div class="modal-header">

                <div>

                    <div class="list-name">
                        ${escapeHTML(
                            groupData.name
                        )}
                    </div>

                    <div class="section-subtitle">
                        ${escapeHTML(
                            groupData.description ||
                            ""
                        )}
                    </div>

                </div>

                <button
                    class="close-button"
                    id="closeGroupModal"
                >
                    ×
                </button>

            </div>

            <div id="groupMessages"></div>

            <div
                class="chat-input-area"
                style="
                    padding:10px 0 0;
                    border:0;
                "
            >

                <input
                    class="chat-input"
                    id="groupMessageInput"
                    placeholder="Message group..."
                    autocomplete="off"
                >

                <button
                    class="send-button"
                    id="sendGroupMessageButton"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>
        `);

        $("closeGroupModal").onclick =
            closeModal;

        $("sendGroupMessageButton").onclick =
            sendGroupMessage;

        $("groupMessageInput").addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {
                    event.preventDefault();
                    sendGroupMessage();
                }

            }
        );

        await loadGroupMessages();
    }

    async function loadGroupMessages() {

        if (!currentGroup) {
            return;
        }

        try {

            const data =
                await apiRequest(
                    `/api/groups/${currentGroup.id}/messages?userId=${encodeURIComponent(userId())}`
                );

            const messages =
                data.messages || data || [];

            if (!messages.length) {

                $("groupMessages").innerHTML = `
                    <div class="empty">
                        <i class="fa-solid fa-users"></i>
                        <p>No group messages yet.</p>
                    </div>
                `;

                return;
            }

            $("groupMessages").innerHTML =
                messages
                    .map((message) => {

                        const sender =
                            message.userId ||
                            message.user_id;

                        const name =
                            message.fullName ||
                            message.full_name ||
                            "";

                        const text =
                            message.messageText ||
                            message.message_text ||
                            "";

                        const mine =
                            String(sender) ===
                            String(userId());

                        return `
                            <div
                                class="message-bubble ${
                                    mine
                                        ? "mine"
                                        : "theirs"
                                }"
                            >

                                ${
                                    name
                                        ? `
                                            <b>
                                                ${escapeHTML(
                                                    name
                                                )}
                                            </b>
                                            <br>
                                        `
                                        : ""
                                }

                                ${escapeHTML(text)}

                            </div>
                        `;

                    })
                    .join("");

        } catch (error) {

            $("groupMessages").innerHTML = `
                <div class="empty">
                    Unable to load group messages.
                </div>
            `;
        }
    }

    async function sendGroupMessage() {

        if (!currentGroup) {
            return;
        }

        const input =
            $("groupMessageInput");

        const text =
            input.value.trim();

        if (!text) {
            return;
        }

        input.value = "";

        try {

            await apiRequest(
                `/api/groups/${currentGroup.id}/messages`,
                {
                    method: "POST",
                    body: JSON.stringify({
                        userId: userId(),
                        messageText: text
                    })
                }
            );

            await loadGroupMessages();

        } catch (error) {

            alert(error.message);
        }
    }

    /* =========================
       PROFILE
    ========================= */

    async function loadProfile() {

        try {

            const data =
                await apiRequest(
                    `/api/users/${encodeURIComponent(userId())}`
                );

            const updatedUser =
                data.user || data;

            saveUser(updatedUser);

            const name =
                updatedUser.fullName ||
                updatedUser.full_name ||
                "VibeChat User";

            const picture =
                updatedUser.profilePicture ||
                updatedUser.profile_picture ||
                `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=211332&color=ffd54a`;

            $("profileContent").innerHTML = `

                <div class="card profile-card">

                    <div class="profile-picture-wrap">

                        <img
                            src="${picture}"
                            alt="Profile"
                        >

                    </div>

                    <div class="profile-name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="profile-about">
                        ${escapeHTML(
                            updatedUser.about || ""
                        )}
                    </div>

                    <div class="profile-contact">
                        ${escapeHTML(
                            updatedUser.email ||
                            updatedUser.phone ||
                            ""
                        )}
                    </div>

                    <div class="button-row">

                        <button
                            class="button"
                            id="editProfileButton"
                        >
                            Edit Profile
                        </button>

                        <button
                            class="button secondary"
                            id="changePhotoButton"
                        >
                            Change Photo
                        </button>

                    </div>

                </div>

                <div class="card">

                    <div class="list-item">

                        <i
                            class="fa-solid fa-user"
                            style="color:#ffd54a;width:25px;"
                        ></i>

                        <div class="list-content">

                            <div class="list-name">
                                Your Profile
                            </div>

                            <div class="list-preview">
                                Manage your VibeChat profile.
                            </div>

                        </div>

                    </div>

                    <div class="list-item">

                        <i
                            class="fa-solid fa-right-from-bracket"
                            style="color:#ffd54a;width:25px;"
                        ></i>

                        <div class="list-content">

                            <div class="list-name">
                                Logout
                            </div>

                            <div class="list-preview">
                                Sign out of this device.
                            </div>

                        </div>

                        <button
                            class="button danger"
                            id="profileLogoutButton"
                        >
                            Logout
                        </button>

                    </div>

                </div>
            `;

            $("editProfileButton").onclick =
                openEditProfile;

            $("changePhotoButton").onclick =
                openChangePhoto;

            $("profileLogoutButton").onclick =
                logout;

        } catch (error) {

            $("profileContent").innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-user"></i>
                    <h3>Unable to load profile</h3>
                    <p>${escapeHTML(error.message)}</p>
                </div>
            `;
        }
    }

    function openEditProfile() {

        openModal(`
            <div class="modal-header">

                <h3>Edit Profile</h3>

                <button
                    class="close-button"
                    id="closeEditProfile"
                >
                    ×
                </button>

            </div>

            <div class="form-group">

                <label>
                    Full name
                </label>

                <input
                    class="form-control"
                    id="profileNameInput"
                    maxlength="100"
                    value="${escapeHTML(
                        currentUser.fullName ||
                        currentUser.full_name ||
                        ""
                    )}"
                >

            </div>

            <div class="form-group">

                <label>
                    About
                </label>

                <textarea
                    class="form-control"
                    id="profileAboutInput"
                    maxlength="500"
                >${escapeHTML(
                    currentUser.about || ""
                )}</textarea>

            </div>

            <button
                class="button"
                id="saveProfileButton"
                style="width:100%;"
            >
                Save Changes
            </button>
        `);

        $("closeEditProfile").onclick =
            closeModal;

        $("saveProfileButton").onclick =
            saveProfile;
    }

    async function saveProfile() {

        const fullName =
            $("profileNameInput")
                .value
                .trim();

        const about =
            $("profileAboutInput")
                .value
                .trim();

        if (!fullName) {
            alert("Enter your full name.");
            return;
        }

        try {

            const data =
                await apiRequest(
                    `/api/users/${userId()}/profile`,
                    {
                        method: "PUT",
                        body: JSON.stringify({
                            fullName,
                            about
                        })
                    }
                );

            saveUser(
                data.user || data
            );

            closeModal();

            await loadProfile();

        } catch (error) {

            alert(error.message);
        }
    }

    function openChangePhoto() {

        openModal(`
            <div class="modal-header">

                <h3>Change Profile Picture</h3>

                <button
                    class="close-button"
                    id="closePhotoModal"
                >
                    ×
                </button>

            </div>

            <div class="form-group">

                <label>
                    Choose an image
                </label>

                <input
                    class="form-control"
                    id="profilePhotoFile"
                    type="file"
                    accept="image/jpeg,image/jpg,image/png,image/webp"
                >

            </div>

            <button
                class="button"
                id="uploadPhotoButton"
                style="width:100%;"
            >
                Upload Photo
            </button>
        `);

        $("closePhotoModal").onclick =
            closeModal;

        $("uploadPhotoButton").onclick =
            uploadProfilePhoto;
    }

    async function uploadProfilePhoto() {

        const file =
            $("profilePhotoFile").files[0];

        if (!file) {
            alert("Choose an image.");
            return;
        }

        if (
            file.size >
            2 * 1024 * 1024
        ) {
            alert(
                "Profile picture must be below 2MB."
            );
            return;
        }

        const reader =
            new FileReader();

        reader.onload = async () => {

            try {

                const data =
                    await apiRequest(
                        `/api/users/${userId()}/profile-picture`,
                        {
                            method: "PUT",
                            body: JSON.stringify({
                                profilePicture:
                                    reader.result
                            })
                        }
                    );

                saveUser(
                    data.user || data
                );

                closeModal();

                await loadProfile();

            } catch (error) {

                alert(error.message);
            }
        };

        reader.readAsDataURL(file);
    }

    /* =========================
       ONLINE STATUS
    ========================= */

    async function setOnline() {

        try {

            await apiRequest(
                `/api/users/${userId()}/online`,
                {
                    method: "PUT",
                    body: JSON.stringify({})
                }
            );

        } catch (error) {
            // Ignore temporary status errors.
        }
    }

    setOnline();

    setInterval(
        setOnline,
        60000
    );

    /* =========================
       SERVICE WORKER
    ========================= */

    if ("serviceWorker" in navigator) {

        navigator.serviceWorker
            .register("./sw.js")
            .catch(() => {});

    }

    /* =========================
       INITIAL LOAD
    ========================= */

    loadConversations();
</script>
