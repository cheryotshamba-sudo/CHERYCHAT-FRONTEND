:root{  
    --body-bg:#07030f;  
    --header-bg:#120a22;  
    --card:#120a22;

    --border:rgba(255,255,255,.08);  
    --text:#ffffff;  
    --muted:#9d96aa;  
    --gold:#ffd54a;  
    --gold2:#ff9e00;  
    --green:#22c55e;  
    --red:#ef4444;  
}  
  
*{  
    box-sizing:border-box;  
    margin:0;  
    padding:0;  
}  
  
body{  
    font-family:Poppins,sans-serif;  
    background:var(--body-bg);  
    color:var(--text);  
    min-height:100vh;  
}  
  
button,  
input{  
    font-family:inherit;  
}  
  
button{  
    cursor:pointer;  
}  
  
/* ================= HEADER ================= */  
  
.header{  
    height:65px;  
    background:var(--header-bg);  
    border-bottom:1px solid var(--border);  
    display:flex;  
    align-items:center;  
    justify-content:space-between;  
    padding:0 18px;  
    position:sticky;  
    top:0;  
    z-index:50;  
}  
  
.header-left{  
    display:flex;  
    align-items:center;  
    gap:16px;  
}  
  
.menu-button{  
    width:30px;  
    height:36px;  
    border:none;  
    background:transparent;  
    color:#ddd;  
    font-size:21px;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
}  
  
.logo{  
    font-size:22px;  
    font-weight:700;  
}  
  
.logo span{  
    color:var(--gold);  
}  
  
.header-right{  
    display:flex;  
    align-items:center;  
    gap:18px;  
}  
  
.profile-small{  
    width:36px;  
    height:36px;  
    border-radius:50%;  
    background:linear-gradient(135deg,var(--gold),var(--gold2));  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    color:#160b00;  
    font-weight:700;  
}  
  
/* ================= MAIN ================= */  
  
.container{  
    max-width:700px;  
    margin:auto;  
    padding:15px;  
    padding-bottom:80px;  
}  
  
/* ================= SEARCH ================= */  
  
.search-box{  
    background:var(--card);  
    border:1px solid var(--border);  
    height:48px;  
    border-radius:14px;  
    display:flex;  
    align-items:center;  
    padding:0 15px;  
    gap:10px;  
}  
  
.search-box i{  
    color:var(--muted);  
}  
  
.search-box input{  
    width:100%;  
    border:none;  
    outline:none;  
    background:transparent;  
    color:white;  
    font-size:14px;  
}  
  
.search-box input::placeholder{  
    color:#777080;  
}  
  
.search-results{  
    margin-top:8px;  
    display:none;  
}  
  
.search-user{  
    background:var(--card);  
    border:1px solid var(--border);  
    padding:12px;  
    border-radius:12px;  
    display:flex;  
    align-items:center;  
    gap:12px;  
    margin-bottom:7px;  
    cursor:pointer;  
}  
  
.user-avatar{  
    width:44px;  
    height:44px;  
    border-radius:50%;  
    background:linear-gradient(135deg,var(--gold),var(--gold2));  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    color:#160b00;  
    font-weight:700;  
    flex-shrink:0;  
    overflow:hidden;  
}  
  
.user-avatar img{  
    width:100%;  
    height:100%;  
    object-fit:cover;  
}  
  
.search-user-info{  
    flex:1;  
}  
  
.search-user-name{  
    font-weight:600;  
    font-size:14px;  
}  
  
.search-user-about{  
    color:var(--muted);  
    font-size:12px;  
}  
  
/* ================= TABS ================= */  
  
.tabs{  
    display:flex;  
    gap:8px;  
    margin:18px 0 12px;  
    overflow-x:auto;  
}  
  
.tabs::-webkit-scrollbar{  
    display:none;  
}  
  
.tab{  
    border:1px solid var(--border);  
    background:var(--card);  
    color:var(--muted);  
    padding:8px 16px;  
    border-radius:20px;  
    font-size:12px;  
    white-space:nowrap;  
}  
  
.tab.active{  
    background:var(--gold);  
    color:#160b00;  
    border-color:var(--gold);  
    font-weight:600;  
}  
  
/* ================= CONVERSATIONS ================= */  
  
.conversations{  
    display:flex;  
    flex-direction:column;  
    gap:5px;  
}  
  
.conversation-item{  
    min-height:72px;  
    background:var(--card);  
    border:1px solid transparent;  
    border-radius:14px;  
    display:flex;  
    align-items:center;  
    gap:12px;  
    padding:10px 12px;  
    cursor:pointer;  
    transition:.2s;  
}  
  
.conversation-item:hover{  
    border-color:var(--border);  
    background:#160d28;  
}  
  
.conversation-avatar{  
    width:52px;  
    height:52px;  
    border-radius:50%;  
    background:linear-gradient(135deg,var(--gold),var(--gold2));  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    color:#160b00;  
    font-weight:700;  
    flex-shrink:0;  
    overflow:hidden;  
}  
  
.conversation-avatar img{  
    width:100%;  
    height:100%;  
    object-fit:cover;  
}  
  
.conversation-info{  
    flex:1;  
    min-width:0;  
}  
  
.conversation-top{  
    display:flex;  
    justify-content:space-between;  
    gap:8px;  
}  
  
.conversation-name{  
    font-size:14px;  
    font-weight:600;  
    white-space:nowrap;  
    overflow:hidden;  
    text-overflow:ellipsis;  
}  
  
.conversation-time{  
    color:var(--muted);  
    font-size:10px;  
    white-space:nowrap;  
}  
  
.conversation-preview{  
    margin-top:3px;  
    color:var(--muted);  
    font-size:12px;  
    white-space:nowrap;  
    overflow:hidden;  
    text-overflow:ellipsis;  
}  
  
.unread-dot{  
    width:9px;  
    height:9px;  
    border-radius:50%;  
    background:var(--gold);  
    flex-shrink:0;  
}  
  
.chat-empty{  
    text-align:center;  
    padding:35px 20px;  
    color:var(--muted);  
    font-size:13px;  
}  
  
/* ================= EMPTY ================= */  
  
.empty-chat{  
    min-height:300px;  
    display:flex;  
    flex-direction:column;  
    align-items:center;  
    justify-content:center;  
    text-align:center;  
    padding:30px;  
}  
  
.empty-icon{  
    width:70px;  
    height:70px;  
    border-radius:50%;  
    background:rgba(255,213,74,.1);  
    color:var(--gold);  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-size:28px;  
    margin-bottom:15px;  
}  
  
.empty-chat h2{  
    font-size:19px;  
    margin-bottom:7px;  
}  
  
.empty-chat p{  
    color:var(--muted);  
    font-size:12px;  
    max-width:350px;  
}  
  
/* ================= SIDE MENU ================= */  
  
.side-menu{  
    position:fixed;  
    top:0;  
    left:-310px;  
    width:290px;  
    height:100vh;  
    background:#0e071b;  
    z-index:100;  
    padding:22px;  
    transition:.3s;  
    border-right:1px solid var(--border);  
    overflow-y:auto;  
}  
  
.side-menu.show{  
    left:0;  
}  
  
.menu-overlay{  
    position:fixed;  
    inset:0;  
    background:rgba(0,0,0,.6);  
    z-index:90;  
    display:none;  
}  
  
.menu-overlay.show{  
    display:block;  
}  
  
.menu-profile{  
    display:flex;  
    align-items:center;  
    gap:12px;  
    margin-bottom:25px;  
}  
  
.menu-profile-avatar{  
    width:52px;  
    height:52px;  
    border-radius:50%;  
    background:linear-gradient(135deg,var(--gold),var(--gold2));  
    color:#160b00;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-weight:700;  
}  
  
.menu-name{  
    font-weight:600;  
}  
  
.menu-email{  
    color:var(--muted);  
    font-size:11px;  
}  
  
.menu-item{  
    height:48px;  
    display:flex;  
    align-items:center;  
    gap:14px;  
    color:#ddd;  
    padding:0 12px;  
    border-radius:10px;  
    margin-bottom:4px;  
    cursor:pointer;  
    font-size:13px;  
}  
  
.menu-item:hover{  
    background:#18102a;  
}  
  
.menu-item i{  
    width:20px;  
    color:var(--gold);  
}  
  
.menu-item.logout{  
    color:#ff7777;  
}  
  
.menu-item.logout i{  
    color:var(--red);  
}  
  
/* ================= CHAT SCREEN ================= */  
  
.chat-screen{  
    position:fixed;  
    inset:0;  
    background:var(--body-bg);  
    z-index:80;  
    display:none;  
    flex-direction:column;  
}  
  
.chat-screen.show{  
    display:flex;  
}  
  
.chat-header{  
    height:65px;  
    min-height:65px;  
    background:var(--header-bg);  
    border-bottom:1px solid var(--border);  
    display:flex;  
    align-items:center;  
    gap:12px;  
    padding:0 14px;  
}  
  
.back-button{  
    width:36px;  
    height:36px;  
    border:none;  
    background:transparent;  
    color:white;  
    font-size:19px;  
}  
  
.chat-header-avatar{  
    width:40px;  
    height:40px;  
    border-radius:50%;  
    background:linear-gradient(135deg,var(--gold),var(--gold2));  
    color:#160b00;  
    display:flex;  
    align-items:center;  
    justify-content:center;  
    font-weight:700;  
    flex-shrink:0;  
    overflow:hidden;  
}  
  
.chat-header-avatar img{  
    width:100%;  
    height:100%;  
    object-fit:cover;  
}  
  
.chat-user-info{  
    flex:1;  
}  
  
.chat-user-name{  
    font-size:14px;  
    font-weight:600;  
}  
  
.chat-user-status{  
    color:var(--muted);  
    font-size:10px;  
}  
  
.chat-user-status.online{  
    color:var(--green);  
}  
  
/* ================= MESSAGES ================= */  
  
.messages{  
    flex:1;  
    overflow-y:auto;  
    padding:18px 14px 90px;  
}  
  
.message-row{  
    display:flex;  
    margin-bottom:9px;  
}  
  
.message-row.mine{  
    justify-content:flex-end;  
}  
  
.message-bubble{  
    max-width:78%;  
    padding:9px 12px;  
    border-radius:14px;  
    background:#171024;  
    font-size:13px;  
    line-height:1.4;  
    word-break:break-word;  
}  
  
.message-row.mine .message-bubble{  
    background:linear-gradient(135deg,#a87900,#ffd54a);  
    color:#160b00;  
    border-bottom-right-radius:4px;  
}  
  
.message-row:not(.mine) .message-bubble{  
    border-bottom-left-radius:4px;  
}  
  
.message-time{  
    font-size:9px;  
    opacity:.65;  
    margin-top:4px;  
    text-align:right;  
}  
  
/* ================= MESSAGE FORM ================= */  
  
.message-form{  
    position:absolute;  
    bottom:0;  
    left:0;  
    right:0;  
    padding:10px;  
    background:var(--header-bg);  
    border-top:1px solid var(--border);  
    display:flex;  
    gap:8px;  
}  
  
.message-form input{  
    flex:1;  
    height:44px;  
    border:none;  
    outline:none;  
    border-radius:22px;  
    background:#1a1029;  
    color:white;  
    padding:0 16px;  
    font-size:13px;  
}  
  
.send-button{  
    width:44px;  
    height:44px;  
    border:none;  
    border-radius:50%;  
    background:var(--gold);  
    color:#160b00;  
    flex-shrink:0;  
}  
  
.send-button:disabled{  
    opacity:.5;  
}  
  
/* ================= BOTTOM NAV ================= */  
  
.bottom-nav{  
    position:fixed;  
    bottom:0;  
    left:0;  
    right:0;  
    height:62px;  
    background:var(--header-bg);  
    border-top:1px solid var(--border);  
    display:flex;  
    justify-content:space-around;  
    align-items:center;  
    z-index:40;  
}  
  
.bottom-nav-item{  
    display:flex;  
    flex-direction:column;  
    align-items:center;  
    gap:3px;  
    color:var(--muted);  
    font-size:9px;  
}  
  
.bottom-nav-item i{  
    font-size:17px;  
}  
  
.bottom-nav-item.active{  
    color:var(--gold);  
}  
  
/* ================= LIGHT THEME ================= */  
  
body.light{  
    --body-bg:#f5f5f7;  
    --header-bg:#ffffff;  
    --card:#ffffff;  
    --card2:#f0f0f3;  
    --border:rgba(0,0,0,.08);  
    --text:#161616;  
    --muted:#777;  
}  
  
body.light .search-box input,  
body.light .message-form input{  
    color:#111;  
}  
  
body.light .side-menu{  
    background:#ffffff;  
}  
  
body.light .menu-item{  
    color:#333;  
}  
  
body.light .conversation-item:hover{  
    background:#f7f7f7;  
}  
  
body.light .message-bubble{  
    background:#eeeeee;  
    color:#222;  
}  
  
body.light .chat-header,  
body.light .message-form{  
    background:#ffffff;  
}  
  
/* ================= DESKTOP ================= */  
  
@media(min-width:700px){  
  
    .bottom-nav{  
        display:none;  
    }  
  
    .container{  
        padding-bottom:30px;  
    }  
  
}

/* =========================

function loadUser(){  
  
    const storedUser =  
        localStorage.getItem(  
            "cheryChatCurrentUser"  
        );  
  
    if(!storedUser){  
  
        window.location.href =  
            "login.html";  
  
        return false;  
    }  
  
    try{  
  
        currentUser =  
            JSON.parse(storedUser);  
  
    }catch(error){  
  
        console.error(  
            "USER DATA ERROR:",  
            error  
        );  
  
        localStorage.removeItem(  
            "cheryChatCurrentUser"  
        );  
  
        window.location.href =  
            "login.html";  
  
        return false;  
    }  
  
  
    if(!currentUser.id){  
  
        console.error(  
            "Current user has no ID:",  
            currentUser  
        );  
  
        alert(  
            "Your login session is invalid. Please login again."  
        );  
  
        localStorage.removeItem(  
            "cheryChatCurrentUser"  
        );  
  
        window.location.href =  
            "login.html";  
  
        return false;  
    }  
  
  
    const name =  
        currentUser.full_name ||  
        currentUser.fullName ||  
        currentUser.name ||  
        "User";  
  
  
    const email =

/* =========================  
   LOAD CONVERSATIONS  
========================= */  
  
async function loadConversations(){  
  
    if(  
        !currentUser ||  
        !currentUser.id  
    ){  
  
        return;  
    }  
  
  
    const container =  
        document.getElementById(  
            "conversations"  
        );  
  
  
    const emptyChat =  
        document.getElementById(  
            "emptyChat"  
        );  
  
  
    container.innerHTML = `  
  
        <div class="chat-empty">  
            Loading conversations...  
        </div>  
  
    `;  
  
  
    try{  
  
        const response =  
            await fetch(  
                `${API_URL}/api/conversations?userId=${encodeURIComponent(currentUser.id)}`  
            );  
  
  
        const data =  
            await response.json();  
  
  
        console.log(  
            "CONVERSATIONS RESPONSE:",  
            data  
        );  
  
  
        if(  
            !response.ok ||  
            !data.success  
        ){  
  
            throw new Error(  
                data.message ||  
                "Unable to load conversations"  
            );  
  
        }  
  
  
        const conversations =  
            Array.isArray(  
                data.conversations  
            )  
            ?  
            data.conversations  
            :  
            [];  
  
  
        if(  
            conversations.length === 0  
        ){  
  
            container.innerHTML = "";  
  
            emptyChat.style.display =  
                "flex";  
  
            return;  
        }  
  
  
        emptyChat.style.display =  
            "none";  
  
  
        container.innerHTML = "";  
  
  
        conversations.forEach(  
            (  
                chat,  
                index  
            ) => {  
  
                const user =  
                    chat.otherUser ||  
                    {};  
  
  
                const name =  
                    user.fullName ||  
                    user.full_name ||  
                    user.name ||  
                    "VibeChat User";  
  
  
                const initials =  
                    getInitials(name);  
  
  
                const preview =  
                    chat.lastMessage ||  
                    "Start a conversation";  
  
  
                const time =  
                    chat.lastMessageTime  
                    ?  
                    formatConversationTime(  
                        chat.lastMessageTime  
                    )  
                    :  
                    "";  
  
  
                const unread =  
                    Number(  
                        chat.unreadCount || 0  
                    );  
  
  
                const item =  
                    document.createElement(  
                        "div"  
                    );  
  
  
                item.className =  
                    "conversation-item";  
  
  
                item.dataset.index =  
                    index;  
  
  
                item.innerHTML = `  
  
                    <div class="conversation-avatar">  
  
                        ${  
                            user.profilePicture  
                            ?  
                            `  
                            <img  
                                src="${escapeHtml(  
                                    user.profilePicture  
                                )}"  
                                alt=""  
                            >  
                            `  
                            :  
                            escapeHtml(initials)  
                        }  
  
                    </div>  
  
  
                    <div class="conversation-info">  
  
                        <div class="conversation-top">  
  
                            <div class="conversation-name">  
  
                                ${escapeHtml(name)}  
  
                            </div>  
  
  
                            <div class="conversation-time">  
  
                                ${escapeHtml(time)}  
  
                            </div>  
  
                        </div>  
  
  
                        <div class="conversation-preview">  
  
                            ${  
                                chat.lastMessageSenderId &&  
                                Number(  
                                    chat.lastMessageSenderId  
                                ) ===  
                                Number(  
                                    currentUser.id  
                                )  
                                ?  
                                "You: "  
                                :  
                                ""  
                            }  
  
                            ${escapeHtml(preview)}  
  
                        </div>  
  
                    </div>  
  
  
                    ${  
                        unread > 0  
                        ?  
                        `  
                        <div class="unread-dot"></div>  
                        `  
                        :  
                        ""  
                    }  
  
                `;  
  
  
                item.addEventListener(  
                    "click",  
                    () => {  
  
                        openExistingConversation(  
                            chat  
                        );  
  
                    }  
                );  
  
  
                container.appendChild(  
                    item  
                );  
  
            }  
        );  
  
  
    }catch(error){  
  
        console.error(  
            "LOAD CONVERSATIONS ERROR:",  
            error  
        );  
  
  
        container.innerHTML = `  
  
            <div class="chat-empty">  
  
                Unable to load conversations.  
  
                <br><br>  
  
                <small>  
                    ${escapeHtml(  
                        error.message  
                    )}  
                </small>  
  
            </div>  
  
        `;  
  
  
        emptyChat.style.display =  
            "none";  
  
    }  
  
}

async function openExistingConversation(  
    chat  
){  
  
    if(  
        !currentUser ||  
        !chat  
    ){  
  
        return;  
    }  
  
  
    activeConversation = {  
  
        id:  
            Number(  
                chat.conversationId ||  
                chat.id  
            )  
  
    };  
  
  
    activeChatUser =  
        chat.otherUser ||  
        null;  
  
  
    const user =  
        chat.otherUser ||  
        {};  
  
  
    const userName =  
        user.fullName ||  
        user.full_name ||  
        user.name ||  
        "User";  
  
  
    document.getElementById(  
        "chatUserName"  
    ).textContent =  
        userName;  
  
  
    const status =  
        document.getElementById(  
            "chatUserStatus"  
        );  
  
  
    if(user.isOnline){  
  
        status.textContent =  
            "Online";  
  
        status.className =  
            "chat-user-status online";  
  
    }else{  
  
        status.textContent =  
            "Offline";  
  
        status.className =  
            "chat-user-status";  
  
    }  
  
  
    setChatAvatar(  
        user  
    );  
  
  
    document.getElementById(  
        "chatScreen"  
    ).classList.add(  
        "show"  
    );

    setTimeout(  
        () => {  
  
            document.getElementById(  
                "messageInput"  
            ).focus();

    );

/* =========================  
   SEARCH USERS  
========================= */  
  
async function searchUsers(  
    query  
){  
  
    const results =  
        document.getElementById(  
            "searchResults"  
        );  
  
  
    results.style.display =  
        "block";  
  
  
    results.innerHTML = `  
  
        <div class="chat-empty">  
            Searching...  
        </div>  
  
    `;  
  
  
    try{  
  
        const response =  
            await fetch(  
                `${API_URL}/api/users/search?q=${encodeURIComponent(query)}`  
            );  
  
  
        const data =  
            await response.json();  
  
  
        if(  
            !response.ok ||  
            !data.success  
        ){  
  
            throw new Error(  
                data.message ||  
                "Search failed"  
            );  
  
        }  
  
  
        const users =  
            Array.isArray(data.users)  
            ?  
            data.users  
            :  
            [];  
  
  
        if(users.length === 0){  
  
            results.innerHTML = `  
  
                <div class="chat-empty">  
                    No VibeChat users found.  
                </div>  
  
            `;  
  
            return;  
        }  
  
  
        results.innerHTML = "";  
  
  
        users.forEach(  
            user => {  
  
                if(  
                    Number(user.id) ===  
                    Number(currentUser.id)  
                ){  
  
                    return;  
                }  
  
  
                const name =  
                    user.fullName ||  
                    user.full_name ||  
                    user.name ||  
                    "User";  
  
  
                const item =  
                    document.createElement(  
                        "div"  
                    );  
  
  
                item.className =  
                    "search-user";  
  
  
                item.innerHTML = `  
  
                    <div class="user-avatar">  
  
                        ${  
                            user.profilePicture  
                            ?  
                            `  
                            <img  
                                src="${escapeHtml(  
                                    user.profilePicture  
                                )}"  
                                alt=""  
                            >  
                            `  
                            :  
                            escapeHtml(  
                                getInitials(name)  
                            )  
                        }  
  
                    </div>  
  
  
                    <div class="search-user-info">  
  
                        <div class="search-user-name">  
  
                            ${escapeHtml(name)}  
  
                        </div>  
  
  
                        <div class="search-user-about">  
  
                            ${escapeHtml(  
                                user.about ||  
                                "Hey there! I am using VibeChat."  
                            )}  
  
                        </div>  
  
                    </div>  
  
                `;  
  
  
                item.addEventListener(  
                    "click",  
                    () => {  
  
                        results.style.display =  
                            "none";  
  
                        searchInput.value =  
                            "";  
  
                        openChatWithUser(  
                            user  
                        );  
  
                    }  
                );  
  
  
                results.appendChild(  
                    item  
                );  
  
            }  
        );  
  
  
    }catch(error){  
  
        console.error(  
            "SEARCH ERROR:",  
            error  
        );  
  
  
        results.innerHTML = `  
  
            <div class="chat-empty">  
                Unable to search users.  
                <br><br>  
                <small>  
                    ${escapeHtml(  
                        error.message  
                    )}  
                </small>  
            </div>  
  
        `;  
  
    }  
  
}

/* =========================  
   LOAD MESSAGES  
========================= */  
  
async function loadMessages(){  
  
    if(  
        !activeConversation ||  
        !activeConversation.id ||  
        !currentUser  
    ){  
  
        return;  
    }  
  
  
    try{  
  
        const response =  
            await fetch(  
                `${API_URL}/api/messages/${encodeURIComponent(  
                    activeConversation.id  
                )}?userId=${encodeURIComponent(  
                    currentUser.id  
                )}`  
            );  
  
  
        const data =  
            await response.json();  
  
  
        console.log(  
            "MESSAGES RESPONSE:",  
            data  
        );  
  
  
        if(  
            !response.ok ||  
            !data.success  
        ){  
  
            throw new Error(  
                data.message ||  
                "Unable to load messages"  
            );  
  
        }  
  
  
        renderMessages(  
            data.messages || []  
        );  
  
  
    }catch(error){  
  
        console.error(  
            "LOAD MESSAGES ERROR:",  
            error  
        );  
  
  
        document.getElementById(  
            "messages"  
        ).innerHTML = `  
  
            <div class="chat-empty">  
  
                Unable to load messages.  
  
                <br><br>  
  
                <small>  
                    ${escapeHtml(  
                        error.message  
                    )}  
                </small>  
  
            </div>  
  
        `;  
  
    }  
  
}  
  
  
/* =========================  
   RENDER MESSAGES  
========================= */  
  
function renderMessages(  
    messages  
){  
  
    const container =  
        document.getElementById(  
            "messages"  
        );  
  
  
    if(  
        !Array.isArray(messages) ||  
        messages.length === 0  
    ){  
  
        container.innerHTML = `  
  
            <div class="chat-empty">  
  
                Say hello 👋  
  
                <br>  
  
                Start the conversation.  
  
            </div>  
  
        `;  
  
        return;  
    }  
  
  
    container.innerHTML =  
        messages.map(  
            message => {  
  
                const mine =  
                    Number(  
                        message.senderId  
                    ) ===  
                    Number(  
                        currentUser.id  
                    );  
  
  
                /*  
                 * IMPORTANT:  
                 * Backend may return "message"  
                 * while older code expected "messageText".  
                 */  
  
                const messageText =  
                    message.message ||  
                    message.messageText ||  
                    message.text ||  
                    "";  
  
  
                return `  
  
                    <div class="message-row ${  
                        mine  
                        ?  
                        "mine"  
                        :  
                        ""  
                    }">  
  
                        <div class="message-bubble">  
  
                            ${escapeHtml(  
                                messageText  
                            )}  
  
                            <div class="message-time">  
  
                                ${formatTime(  
                                    message.createdAt ||  
                                    message.created_at  
                                )}  
  
                                ${  
                                    mine  
                                    ?  
                                    (  
                                        message.isRead  
                                        ?  
                                        " ✓✓"  
                                        :  
                                        " ✓"  
                                    )  
                                    :  
                                    ""  
                                }  
  
                            </div>  
  
                        </div>  
  
                    </div>  
  
                `;  
  
            }  
        ).join("");  
  
  
    container.scrollTop =  
        container.scrollHeight;  
  
}  
  
  
/* =========================  
   SEND MESSAGE  
========================= */  
  
document.getElementById(  
    "messageForm"  
).addEventListener(  
    "submit",  
    async event => {  
  
        event.preventDefault();  
  
  
        const input =  
            document.getElementById(  
                "messageInput"  
            );  
  
  
        const message =  
            input.value.trim();  
  
  
        if(  
            !message ||  
            !activeConversation ||  
            !activeConversation.id ||  
            !currentUser  
        ){  
  
            return;  
        }  
  
  
        const button =  
            event.submitter ||  
            document.querySelector(  
                ".send-button"  
            );  
  
  
        if(button){  
  
            button.disabled =  
                true;  
  
        }  
  
  
        try{  
  
            const response =  
                await fetch(  
                    `${API_URL}/api/messages`,  
                    {  
                        method:"POST",  
  
                        headers:{  
                            "Content-Type":  
                                "application/json"  
                        },  
  
                        body:JSON.stringify({  
  
                            conversationId:  
                                activeConversation.id,  
  
                            senderId:  
                                currentUser.id,  
  
                            message:  
                                message  
  
                        })  
  
                    }  
                );  
  
  
            const data =  
                await response.json();  
  
  
            console.log(  
                "SEND MESSAGE RESPONSE:",  
                data  
            );  
  
  
            if(  
                !response.ok ||  
                !data.success  
            ){  
  
                throw new Error(  
                    data.message ||  
                    "Unable to send message"  
                );  
  
            }  
  
  
            input.value = "";  
  
  
            await loadMessages();  
  
            await loadConversations();  
  
            await markMessagesRead();  
  
  
        }catch(error){  
  
            console.error(  
                "SEND MESSAGE ERROR:",  
                error  
            );  
  
  
            alert(  
                error.message ||  
                "Unable to send message."  
            );  
  
        }finally{  
  
            if(button){  
  
                button.disabled =  
                    false;  
  
            }  
  
        }  
  
    }  
);

/* =========================  
   MESSAGE REFRESH  
========================= */  
  
function startMessageRefresh(){  
  
    stopMessageRefresh();  
  
  
    messageRefreshTimer =  
        setInterval(  
            async () => {  
  
                const screen =  
                    document.getElementById(  
                        "chatScreen"  
                    );  
  
  
                if(  
                    activeConversation &&  
                    screen &&  
                    screen.classList.contains(  
                        "show"  
                    )  
                ){  
  
                    await loadMessages();  
  
                    await markMessagesRead();  
  
                }  
  
            },  
            3000  
        );  
  
}  
  
  
function stopMessageRefresh(){  
  
    if(messageRefreshTimer){  
  
        clearInterval(  
            messageRefreshTimer  
        );  
  
        messageRefreshTimer =  
            null;  
  
    }  
  
}  
  
  
/* =========================  
   CLOSE CHAT  
========================= */  
  
function closeChat(){  
  
    stopMessageRefresh();  
  
  
    document.getElementById(  
        "chatScreen"  
    ).classList.remove(  
        "show"  
    );  
  
  
    activeConversation =  
        null;  
  
  
    activeChatUser =  
        null;  
  
  
    loadConversations();  
  
}

/* =========================  
   THEME  
========================= */  
  
function loadSavedTheme(){  
  
    const savedTheme =  
        localStorage.getItem(  
            "vibeChatTheme"  
        );  
  
  
    if(savedTheme === "light"){  
  
        document.body.classList.add(  
            "light"  
        );  
  
    }  
  
}  
  
  
function toggleTheme(){  
  
    document.body.classList.toggle(  
        "light"  
    );  
  
  
    const isLight =  
        document.body.classList.contains(  
            "light"  
        );  
  
  
    localStorage.setItem(  
        "vibeChatTheme",  
        isLight  
        ?  
        "light"  
        :  
        "dark"  
    );  
  
}

}  
  
  
/* =========================  
   CHAT AVATAR  
========================= */  
  
function setChatAvatar(  
    user  
){  
  
    const avatar =  
        document.getElementById(  
            "chatAvatar"  
        );  
  
  
    if(  
        user &&  
        user.profilePicture  
    ){  
  
        avatar.innerHTML = `  
  
            <img  
                src="${escapeHtml(  
                    user.profilePicture  
                )}"  
                alt=""  
            >  
  
        `;  
  
    }else{  
  
        avatar.textContent =  
            getInitials(  
                user?.fullName ||  
                user?.full_name ||  
                user?.name ||  
                "User"  
            );  
  
    }  
  
}  
  
  
/* =========================  
   HELPERS  
========================= */  
  
function getInitials(  
    name  
){  
  
    if(!name){  
  
        return "U";  
  
    }  
  
  
    const parts =  
        String(name)  
            .trim()  
            .split(/\s+/);  
  
  
    if(parts.length >= 2){  
  
        return (  
            parts[0][0] +  
            parts[1][0]  
        ).toUpperCase();  
  
    }  
  
  
    return String(name)  
        .substring(0,2)  
        .toUpperCase();  
  
}  
  
  
function escapeHtml(  
    value  
){  
  
    return String(  
        value ?? ""  
    )  
    .replace(  
        /&/g,  
        "&amp;"  
    )  
    .replace(  
        /</g,  
        "&lt;"  
    )  
    .replace(  
        />/g,  
        "&gt;"  
    )  
    .replace(  
        /"/g,  
        "&quot;"  
    )  
    .replace(  
        /'/g,  
        "&#039;"  
    );  
  
}  
  
  
function formatTime(  
    value  
){  
  
    if(!value){  
  
        return "";  
  
    }  
  
  
    const date =  
        new Date(value);  
  
  
    if(  
        Number.isNaN(  
            date.getTime()  
        )  
    ){  
  
        return "";  
  
    }  
  
  
    return date.toLocaleTimeString(  
        [],  
        {  
            hour:"numeric",  
            minute:"2-digit"  
        }  
    );  
  
}  
  
  
function formatConversationTime(  
    value  
){  
  
    if(!value){  
  
        return "";  
  
    }  
  
  
    const date =  
        new Date(value);  
  
  
    if(  
        Number.isNaN(  
            date.getTime()  
        )  
    ){  
  
        return "";  
  
    }  
  
  
    const now =  
        new Date();  
  
  
    const sameDay =  
        date.toDateString() ===  
        now.toDateString();  
  
  
    if(sameDay){  
  
        return date.toLocaleTimeString(  
            [],  
            {  
                hour:"numeric",  
                minute:"2-digit"  
            }  
        );  
  
    }  
  
  
    const yesterday =  
        new Date();  
  
    yesterday.setDate(  
        yesterday.getDate() - 1  
    );  
  
  
    if(  
        date.toDateString() ===  
        yesterday.toDateString()  
    ){  
  
        return "Yesterday";  
  
    }  
  
  
    return date.toLocaleDateString(  
        [],  
        {  
            day:"numeric",  
            month:"short"  
        }  
    );  
  
}
