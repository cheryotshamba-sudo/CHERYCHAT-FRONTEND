<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root {
    --bg: #08080b;
    --card: #111116;
    --card2: #17171d;
    --gold: #d4af37;
    --gold-light: #f0d66b;
    --text: #ffffff;
    --muted: #9b9ba3;
    --border: rgba(212,175,55,.16);

    --chat-bg: #0b0b0f;
    --chat-header: #111116;
    --sent: #d4af37;
    --sent-text: #111111;
    --received: #202027;
    --received-text: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Poppins", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   HEADER
========================= */

.header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
}

.brand {
    color: var(--gold);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .3px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 18px;
    border-radius: 50%;
}

.icon-btn:hover {
    background: rgba(212,175,55,.1);
    color: var(--gold);
}

/* =========================
   SEARCH
========================= */

.search-area {
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    background: var(--card);
    padding: 12px;
    z-index: 40;
    display: none;
    border-bottom: 1px solid var(--border);
}

.search-area.active {
    display: block;
}

.search-input {
    width: 100%;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card2);
    color: #fff;
    padding: 0 15px;
    outline: none;
}

.search-input:focus {
    border-color: var(--gold);
}

.search-input::placeholder {
    color: var(--muted);
}

/* =========================
   MAIN
========================= */

.main {
    padding: 84px 15px 90px;
    max-width: 600px;
    margin: auto;
}

.section-title {
    font-size: 15px;
    color: var(--muted);
    margin: 10px 2px 12px;
}

.empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
}

.empty-state i {
    font-size: 45px;
    color: var(--gold);
    margin-bottom: 15px;
}

.empty-state h3 {
    color: #fff;
    margin-bottom: 6px;
    font-size: 17px;
}

.empty-state p {
    font-size: 13px;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results {
    display: none;
}

.user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
}

.user-card:hover {
    border-color: rgba(212,175,55,.4);
}

.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #8e6d16);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #111;
    font-weight: 700;
    flex-shrink: 0;
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.user-info {
    min-width: 0;
    flex: 1;
}

.user-name {
    font-size: 14px;
    font-weight: 600;
}

.user-about {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.online-status {
    font-size: 10px;
    color: #777;
}

.online-status.online {
    color: #22c55e;
}

/* =========================
   CONVERSATIONS
========================= */

.conversation-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid rgba(255,255,255,.05);
    cursor: pointer;
}

.conversation-item:hover {
    background: rgba(212,175,55,.04);
}

.conversation-info {
    flex: 1;
    min-width: 0;
}

.conversation-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.conversation-name {
    font-size: 14px;
    font-weight: 600;
}

.conversation-time {
    font-size: 10px;
    color: var(--muted);
}

.conversation-preview {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: rgba(17,17,22,.97);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 60;
}

.nav-item {
    background: none;
    border: none;
    color: #777;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.nav-item i {
    font-size: 18px;
}

.nav-item.active,
.nav-item:hover {
    color: var(--gold);
}

/* =========================
   CHAT SCREEN
========================= */

.chat-screen {
    position: fixed;
    inset: 0;
    background: var(--chat-bg);
    z-index: 100;
    display: none;
    flex-direction: column;
}

.chat-screen.active {
    display: flex;
}

/* Chat header */

.chat-header {
    height: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: var(--chat-header);
    border-bottom: 1px solid rgba(212,175,55,.16);
}

.chat-back {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    color: var(--gold);
    font-size: 20px;
}

.chat-user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #8e6d16);
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    overflow: hidden;
}

.chat-user-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.chat-user-details {
    flex: 1;
    min-width: 0;
}

.chat-user-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-user-status {
    font-size: 10px;
    color: #777;
}

.chat-user-status.online {
    color: #22c55e;
}

/* =========================
   MESSAGES
========================= */

.messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    background: var(--chat-bg);

    display: flex;
    flex-direction: column;
}

.message {
    display: flex;
    width: 100%;
    margin: 4px 0;
}

.message.sent {
    justify-content: flex-end;
}

.message.received {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 78%;
    padding: 8px 11px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
    box-shadow: none;
}

/* YOUR MESSAGE = GOLD */

.message.sent .message-bubble {
    background: var(--sent);
    color: var(--sent-text);
    border-bottom-right-radius: 4px;
}

/* THEIR MESSAGE = DARK */

.message.received .message-bubble {
    background: var(--received);
    color: var(--received-text);
    border: 1px solid rgba(255,255,255,.04);
    border-bottom-left-radius: 4px;
}

.message-meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
}

.message-time {
    font-size: 9px;
    opacity: .65;
}

.message.sent .message-time {
    color: #222;
}

.message.received .message-time {
    color: #aaa;
}

.read-status {
    font-size: 10px;
}

.message.sent .read-status {
    color: #222;
}

/* =========================
   CHAT INPUT
========================= */

.chat-input-area {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    background: var(--chat-header);
    border-top: 1px solid rgba(212,175,55,.14);
}

.chat-input {
    flex: 1;
    height: 43px;
    border: 1px solid rgba(212,175,55,.18);
    border-radius: 22px;
    padding: 0 15px;
    background: #202027;
    color: #fff;
    outline: none;
    font-size: 13px;
}

.chat-input:focus {
    border-color: var(--gold);
}

.chat-input::placeholder {
    color: #777;
}

.send-btn {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 50%;
    background: var(--gold);
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

.send-btn:active {
    transform: scale(.94);
}

/* =========================
   SIDE MENU
========================= */

.side-menu {
    position: fixed;
    top: 0;
    left: -290px;
    bottom: 0;
    width: 280px;
    background: #101014;
    z-index: 200;
    padding: 20px;
    transition: .25s ease;
    border-right: 1px solid var(--border);
}

.side-menu.active {
    left: 0;
}

.menu-logo {
    color: var(--gold);
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 25px;
}

.menu-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 18px;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.menu-user-name {
    font-size: 13px;
    font-weight: 600;
}

.menu-item {
    width: 100%;
    border: none;
    background: transparent;
    color: #ddd;
    padding: 13px 8px;
    text-align: left;
    border-radius: 9px;
    font-size: 13px;
}

.menu-item i {
    width: 25px;
    color: var(--gold);
}

.menu-item:hover {
    background: rgba(212,175,55,.08);
}

.menu-close {
    position: absolute;
    top: 18px;
    right: 15px;
    border: none;
    background: transparent;
    color: #aaa;
    font-size: 20px;
}

/* Overlay */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 150;
    display: none;
}

.overlay.active {
    display: block;
}

/* =========================
   LIGHT MODE
========================= */

body.light {
    --bg: #f6f4ee;
    --card: #ffffff;
    --card2: #f1eee4;
    --text: #171717;
    --muted: #777;
    --border: rgba(140,110,20,.18);

    --chat-bg: #f4f0e5;
    --chat-header: #ffffff;
    --received: #ffffff;
    --received-text: #171717;
}

body.light .icon-btn {
    color: #222;
}

body.light .bottom-nav {
    background: rgba(255,255,255,.97);
}

body.light .message.received .message-bubble {
    border-color: rgba(0,0,0,.06);
}

body.light .chat-input {
    background: #f1eee4;
    color: #111;
}

body.light .menu-item {
    color: #222;
}

body.light .empty-state h3 {
    color: #111;
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width: 700px) {
    .bottom-nav {
        max-width: 600px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 15px 15px 0 0;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">
    <button class="icon-btn" onclick="openMenu()">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div class="brand">VibeChat</div>

    <div class="header-actions">
        <button class="icon-btn" onclick="toggleSearch()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
</header>

<!-- SEARCH -->

<div class="search-area" id="searchArea">
    <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="Search people by name, email or phone..."
        autocomplete="off"
    >
</div>

<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div id="searchResults" class="search-results"></div>

    <div id="conversationSection">

        <div class="section-title">
            Chats
        </div>

        <div id="conversations"></div>

        <div id="emptyState" class="empty-state">
            <i class="fa-regular fa-comments"></i>
            <h3>No conversations yet</h3>
            <p>Search for someone to start a private chat.</p>
        </div>

    </div>

</main>

<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <button class="nav-item active">
        <i class="fa-solid fa-comments"></i>
        Chats
    </button>

    <button class="nav-item">
        <i class="fa-solid fa-user-group"></i>
        Friends
    </button>

    <button class="nav-item">
        <i class="fa-solid fa-users"></i>
        Groups
    </button>

    <button class="nav-item">
        <i class="fa-solid fa-circle-user"></i>
        Profile
    </button>

</nav>

<!-- =========================
     SIDE MENU
========================= -->

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<aside class="side-menu" id="sideMenu">

    <button class="menu-close" onclick="closeMenu()">
        <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="menu-logo">
        VibeChat
    </div>

    <div class="menu-user">

        <div class="avatar" id="menuAvatar">
            ?
        </div>

        <div>
            <div class="menu-user-name" id="menuUserName">
                User
            </div>
        </div>

    </div>

    <button class="menu-item">
        <i class="fa-solid fa-comments"></i>
        Chats
    </button>

    <button class="menu-item">
        <i class="fa-solid fa-users"></i>
        Groups
    </button>

    <button class="menu-item">
        <i class="fa-solid fa-circle-play"></i>
        Stories
    </button>

    <button class="menu-item">
        <i class="fa-solid fa-user-group"></i>
        Friends
    </button>

    <button class="menu-item">
        <i class="fa-solid fa-circle-check"></i>
        Verification
    </button>

    <button class="menu-item">
        <i class="fa-solid fa-gear"></i>
        Settings
    </button>

    <button class="menu-item" onclick="toggleTheme()">
        <i class="fa-solid fa-moon"></i>
        Dark / Light
    </button>

    <button class="menu-item" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </button>

</aside>

<!-- =========================
     CHAT SCREEN
========================= -->

<section class="chat-screen" id="chatScreen">

    <div class="chat-header">

        <button class="chat-back" onclick="closeChat()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="chat-user-avatar" id="chatAvatar">
            ?
        </div>

        <div class="chat-user-details">

            <div class="chat-user-name" id="chatUserName">
                User
            </div>

            <div class="chat-user-status" id="chatUserStatus">
                Offline
            </div>

        </div>

    </div>

    <div class="messages-container" id="messagesContainer"></div>

    <div class="chat-input-area">

        <input
            type="text"
            id="messageInput"
            class="chat-input"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button class="send-btn" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </div>

</section>

<script>

/* =========================
   CONFIG
========================= */

const API_URL = "https://cherychat-backend.onrender.com";

/* =========================
   GLOBALS
========================= */

let currentUser = null;
let activeConversation = null;
let activeChatUser = null;
let messageRefreshTimer = null;
let searchTimer = null;

/* =========================
   LOAD USER
========================= */

function loadUser() {

    const savedUser =
        localStorage.getItem("cheryChatCurrentUser");

    if (!savedUser) {
        window.location.href = "login.html";
        return;
    }

    try {

        currentUser = JSON.parse(savedUser);

        document.getElementById("menuUserName").textContent =
            currentUser.full_name || "User";

        document.getElementById("menuAvatar").innerHTML =
            getAvatarHTML(currentUser);

    } catch (error) {

        localStorage.removeItem("cheryChatCurrentUser");
        window.location.href = "login.html";

    }
}

/* =========================
   SEARCH
========================= */

function toggleSearch() {

    const area = document.getElementById("searchArea");

    area.classList.toggle("active");

    if (area.classList.contains("active")) {
        document.getElementById("searchInput").focus();
    }
}

document.getElementById("searchInput").addEventListener(
    "input",
    function () {

        clearTimeout(searchTimer);

        const query = this.value.trim();

        if (!query) {
            document.getElementById("searchResults").style.display = "none";
            document.getElementById("conversationSection").style.display = "block";
            return;
        }

        searchTimer = setTimeout(
            () => searchUsers(query),
            400
        );

    }
);

async function searchUsers(query) {

    try {

        const response = await fetch(
            `${API_URL}/api/users/search?q=${encodeURIComponent(query)}`
        );

        const users = await response.json();

        const results =
            document.getElementById("searchResults");

        document.getElementById("conversationSection")
            .style.display = "none";

        results.style.display = "block";

        if (!users.length) {

            results.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-user-slash"></i>
                    <h3>No users found</h3>
                    <p>Try another name, email or phone number.</p>
                </div>
            `;

            return;
        }

        results.innerHTML = users
            .filter(user => Number(user.id) !== Number(currentUser.id))
            .map(user => `

                <div
                    class="user-card"
                    onclick='openChatWithUser(${JSON.stringify(user)})'
                >

                    <div class="avatar">
                        ${getAvatarHTML(user)}
                    </div>

                    <div class="user-info">

                        <div class="user-name">
                            ${escapeHtml(user.full_name || "User")}
                        </div>

                        <div class="user-about">
                            ${escapeHtml(
                                user.about ||
                                "Hey there! I am using VibeChat."
                            )}
                        </div>

                        <div class="online-status ${user.is_online ? "online" : ""}">
                            ${user.is_online ? "Online" : "Offline"}
                        </div>

                    </div>

                </div>

            `)
            .join("");

    } catch (error) {

        console.error(error);

    }
}

/* =========================
   OPEN CHAT
========================= */

async function openChatWithUser(user) {

    activeChatUser = user;

    document.getElementById("chatUserName").textContent =
        user.full_name || "User";

    document.getElementById("chatAvatar").innerHTML =
        getAvatarHTML(user);

    const status =
        document.getElementById("chatUserStatus");

    status.textContent =
        user.is_online ? "Online" : "Offline";

    status.className =
        "chat-user-status" +
        (user.is_online ? " online" : "");

    document.getElementById("chatScreen")
        .classList.add("active");

    document.getElementById("searchArea")
        .classList.remove("active");

    document.getElementById("searchResults")
        .style.display = "none";

    document.getElementById("conversationSection")
        .style.display = "block";

    try {

        const response = await fetch(
            `${API_URL}/api/conversations`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userOneId: currentUser.id,
                    userTwoId: user.id
                })
            }
        );

        const data = await response.json();

        activeConversation =
            data.conversationId ||
            data.id ||
            data.conversation?.id;

        await loadMessages();
        await markMessagesRead();

        startMessageRefresh();

        document.getElementById("messageInput").focus();

    } catch (error) {

        console.error("Conversation error:", error);

    }
}

/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

    if (!activeConversation || !currentUser) return;

    try {

        const response = await fetch(
            `${API_URL}/api/messages/${activeConversation}?userId=${currentUser.id}`
        );

        const messages = await response.json();

        renderMessages(messages);

    } catch (error) {

        console.error("Message loading error:", error);

    }
}

/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(messages) {

    const container =
        document.getElementById("messagesContainer");

    if (!messages || !messages.length) {

        container.innerHTML = `
            <div style="
                text-align:center;
                color:#777;
                font-size:12px;
                margin:auto;
                padding:20px;
            ">
                Start the conversation
            </div>
        `;

        return;
    }

    container.innerHTML = messages.map(message => {

        const sent =
            Number(message.sender_id) === Number(currentUser.id);

        const time =
            formatTime(message.created_at);

        return `

            <div class="message ${sent ? "sent" : "received"}">

                <div class="message-bubble">

                    <div>
                        ${escapeHtml(message.message_text)}
                    </div>

                    <div class="message-meta">

                        <span class="message-time">
                            ${time}
                        </span>

                        ${
                            sent
                            ? `
                                <span class="read-status">
                                    ${message.is_read ? "✓✓" : "✓"}
                                </span>
                              `
                            : ""
                        }

                    </div>

                </div>

            </div>

        `;

    }).join("");

    container.scrollTop =
        container.scrollHeight;
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text || !activeConversation) return;

    try {

        const response = await fetch(
            `${API_URL}/api/messages`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    conversationId: activeConversation,
                    senderId: currentUser.id,
                    messageText: text
                })
            }
        );

        if (!response.ok) {
            throw new Error("Message failed");
        }

        input.value = "";

        await loadMessages();

    } catch (error) {

        console.error("Send message error:", error);

    }
}

/* =========================
   ENTER TO SEND
========================= */

document.getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    });

/* =========================
   MARK READ
========================= */

async function markMessagesRead() {

    if (!activeConversation || !currentUser) return;

    try {

        await fetch(
            `${API_URL}/api/messages/read`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    conversationId: activeConversation,
                    userId: currentUser.id
                })
            }
        );

    } catch (error) {

        console.error("Read status error:", error);

    }
}

/* =========================
   REFRESH CHAT
========================= */

function startMessageRefresh() {

    clearInterval(messageRefreshTimer);

    messageRefreshTimer =
        setInterval(async () => {

            if (activeConversation) {

                await loadMessages();
                await markMessagesRead();

            }

        }, 3000);
}

/* =========================
   CLOSE CHAT
========================= */

function closeChat() {

    clearInterval(messageRefreshTimer);

    activeConversation = null;
    activeChatUser = null;

    document.getElementById("chatScreen")
        .classList.remove("active");

    document.getElementById("messagesContainer")
        .innerHTML = "";
}

/* =========================
   SIDE MENU
========================= */

function openMenu() {

    document.getElementById("sideMenu")
        .classList.add("active");

    document.getElementById("overlay")
        .classList.add("active");
}

function closeMenu() {

    document.getElementById("sideMenu")
        .classList.remove("active");

    document.getElementById("overlay")
        .classList.remove("active");
}

/* =========================
   THEME
========================= */

function toggleTheme() {

    document.body.classList.toggle("light");

    localStorage.setItem(
        "cheryChatTheme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}

function loadTheme() {

    const theme =
        localStorage.getItem("cheryChatTheme");

    if (theme === "light") {
        document.body.classList.add("light");
    }

}

/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem("cheryChatLoggedIn");
    localStorage.removeItem("cheryChatCurrentUser");

    window.location.href = "login.html";
}

/* =========================
   HELPERS
========================= */

function getInitials(name) {

    if (!name) return "?";

    return name
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
}

function getAvatarHTML(user) {

    if (user && user.profile_picture) {

        return `
            <img
                src="${escapeHtml(user.profile_picture)}"
                alt="Profile"
            >
        `;

    }

    return getInitials(
        user?.full_name || "User"
    );
}

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatTime(dateString) {

    if (!dateString) return "";

    const date = new Date(dateString);

    return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

}

/* =========================
   START
========================= */

loadTheme();
loadUser();
