<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | VibeChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#24103d 0%,#0d0618 45%,#07030f 100%);
    color:#fff;
    font-family:'Poppins',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px;
}

.container{
    width:100%;
    max-width:450px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:65px;
    height:65px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ffd54a,#ff9d00);
    color:#17091f;
    font-size:30px;
    box-shadow:0 10px 35px rgba(255,180,0,.25);
}

.logo h1{
    margin-top:12px;
    font-size:28px;
    color:#ffd54a;
}

.logo p{
    margin-top:4px;
    color:#aaa;
    font-size:13px;
}

.card{
    background:rgba(18,10,34,.96);
    border:1px solid rgba(255,213,74,.15);
    border-radius:24px;
    padding:30px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.card h2{
    text-align:center;
    font-size:22px;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#999;
    font-size:13px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:13px;
    color:#ddd;
    margin-bottom:7px;
}

.input-box{
    position:relative;
}

.left-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#a98935;
    font-size:14px;
}

.input-box input{
    width:100%;
    height:52px;
    border-radius:13px;
    border:1px solid #30223d;
    background:#0e0818;
    color:#fff;
    outline:none;
    padding:0 45px 0 42px;
    font-family:'Poppins',sans-serif;
    font-size:14px;
}

.input-box input:focus{
    border-color:#ffd54a;
    box-shadow:0 0 0 3px rgba(255,213,74,.08);
}

.toggle-password{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#999;
    cursor:pointer;
    font-size:15px;
    padding:5px;
}

.toggle-password:hover{
    color:#ffd54a;
}

.forgot{
    text-align:right;
    margin-top:-8px;
    margin-bottom:20px;
}

.forgot a{
    color:#ffd54a;
    font-size:12px;
    text-decoration:none;
}

.login-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#ffd54a,#ff9d00);
    color:#16091d;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(255,174,0,.2);
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    text-align:center;
    margin-top:15px;
    padding:11px;
    border-radius:10px;
    font-size:12px;
}

.message.error{
    display:block;
    background:rgba(255,70,70,.1);
    color:#ff7777;
    border:1px solid rgba(255,70,70,.2);
}

.message.success{
    display:block;
    background:rgba(70,220,130,.1);
    color:#65e89a;
    border:1px solid rgba(70,220,130,.2);
}

.register-link{
    text-align:center;
    margin-top:23px;
    font-size:13px;
    color:#999;
}

.register-link a{
    color:#ffd54a;
    text-decoration:none;
    font-weight:600;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:11px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-comments"></i>
        </div>

        <h1>VibeChat</h1>

        <p>Connect. Chat. Share.</p>

    </div>


    <div class="card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Log in to continue to VibeChat
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="identifier">
                    Email Address or Phone Number
                </label>

                <div class="input-box">

                    <i
                        class="fa-solid fa-user left-icon">
                    </i>

                    <input
                        type="text"
                        id="identifier"
                        placeholder="Email or phone number"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <i
                        class="fa-solid fa-lock left-icon">
                    </i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="passwordToggle"
                        aria-label="Show password"
                    >

                        <i
                            class="fa-solid fa-eye"
                            id="passwordEye">
                        </i>

                    </button>

                </div>

            </div>


            <div class="forgot">

                <a href="#" onclick="return false;">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Log In
            </button>


            <div
                class="message"
                id="message">
            </div>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <div class="footer">
        © 2026 VibeChat. All rights reserved.
    </div>

</div>


<script>

/* REAL VIBECHAT BACKEND */

const API_URL =
    "https://cherychat-backend.onrender.com";


/* ELEMENTS */

const loginForm =
    document.getElementById("loginForm");

const identifier =
    document.getElementById("identifier");

const password =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


/* PASSWORD SHOW / HIDE */

document
    .getElementById("passwordToggle")
    .addEventListener("click", function(){

        const eye =
            document.getElementById("passwordEye");

        if(password.type === "password"){

            password.type = "text";

            eye.classList.remove(
                "fa-eye"
            );

            eye.classList.add(
                "fa-eye-slash"
            );

            this.setAttribute(
                "aria-label",
                "Hide password"
            );

        }else{

            password.type = "password";

            eye.classList.remove(
                "fa-eye-slash"
            );

            eye.classList.add(
                "fa-eye"
            );

            this.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    });


/* LOGIN */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        message.className =
            "message";

        message.textContent =
            "";


        const userIdentifier =
            identifier.value.trim();

        const userPassword =
            password.value;


        if(
            !userIdentifier ||
            !userPassword
        ){

            message.className =
                "message error";

            message.textContent =
                "Please enter your email/phone and password.";

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try{

            const response =
                await fetch(
                    `${API_URL}/api/login`,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            identifier:
                                userIdentifier,

                            password:
                                userPassword

                        })
                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Login failed."
                );

            }


            /* SAVE CURRENT USER */

            localStorage.setItem(
                "cheryChatLoggedIn",
                "true"
            );

            localStorage.setItem(
                "cheryChatCurrentUser",
                JSON.stringify(data.user)
            );


            /* SUCCESS */

            message.className =
                "message success";

            message.textContent =
                "Login successful. Opening VibeChat...";


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },800);


        }catch(error){

            console.error(
                "Login error:",
                error
            );


            message.className =
                "message error";

            message.textContent =
                error.message ||
                "Unable to connect to VibeChat server.";


            loginBtn.disabled = false;

            loginBtn.textContent =
                "Log In";

        }

    }
);

</script>

</body>
</html>
