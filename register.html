<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CheryChat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #07030f;
            color: #fff;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: fixed;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(255, 193, 7, 0.12);
            filter: blur(80px);
            top: -80px;
            right: -80px;
        }

        .glow2 {
            position: fixed;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: rgba(120, 50, 255, 0.12);
            filter: blur(80px);
            bottom: -70px;
            left: -70px;
        }

        header {
            padding: 22px 20px;
            position: relative;
            z-index: 2;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: .9;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 15px 20px 40px;
            position: relative;
            z-index: 2;
        }

        .heading {
            text-align: center;
            margin: 10px 0 28px;
        }

        .logo-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto 17px;
            border-radius: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #ffd84d, #ff9e00);
            color: #160b00;
            font-size: 27px;
            box-shadow: 0 12px 35px rgba(255,181,0,.18);
        }

        h1 {
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .heading p {
            color: #918c9b;
            font-size: 13px;
        }

        .form-card {
            padding: 22px;
            border-radius: 22px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.09);
            backdrop-filter: blur(12px);
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #d7d3dc;
            margin-bottom: 7px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #817b8b;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid rgba(255,255,255,.10);
            outline: none;
            border-radius: 13px;
            background: rgba(0,0,0,.18);
            color: #fff;
            padding: 0 15px 0 43px;
            font-family: inherit;
            font-size: 13px;
            transition: .2s;
        }

        input:focus {
            border-color: #ffc928;
            box-shadow: 0 0 0 3px rgba(255,201,40,.08);
        }

        input::placeholder {
            color: #625d69;
        }

        .password-box input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #817b8b;
            cursor: pointer;
            font-size: 14px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 7px 0 19px;
        }

        .terms input {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: #ffc928;
            padding: 0;
        }

        .terms label {
            font-size: 10px;
            line-height: 1.5;
            margin: 0;
            color: #85808d;
            font-weight: 400;
        }

        .terms a {
            color: #ffd34d;
            text-decoration: none;
        }

        button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffe16a, #ffad13);
            color: #160b00;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(255,181,0,.15);
        }

        .login {
            text-align: center;
            margin-top: 21px;
            font-size: 12px;
            color: #85808d;
        }

        .login a {
            color: #ffd34d;
            text-decoration: none;
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 15px 20px 22px;
            color: #5f5a67;
            font-size: 9px;
        }

        @media (max-width: 360px) {
            .form-card {
                padding: 18px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="glow"></div>
    <div class="glow2"></div>

    <header>
        <a href="index.html" class="back">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>
    </header>

    <main>

        <div class="heading">

            <div class="logo-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Create your account</h1>

            <p>Join CheryChat and start connecting.</p>

        </div>

        <div class="form-card">

            <form id="registerForm">

                <div class="field">
                    <label for="fullName">Full name</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label for="username">Username</label>

                    <div class="input-box">
                        <i class="fa-solid fa-at"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">Email address</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <div class="input-box password-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                        <span class="toggle-password" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </span>
                    </div>
                </div>

                <div class="terms">

                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </label>

                </div>

                <button type="submit">
                    <i class="fa-solid fa-user-plus"></i>
                    Create Account
                </button>

            </form>

        </div>

        <div class="login">
            Already have an account?
            <a href="login.html">Log in</a>
        </div>

    </main>

    <footer>
        © 2026 CheryChat. All rights reserved.
    </footer>

</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        if (password.type === "password") {
            password.type = "text";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        } else {
            password.type = "password";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        }
    }

    document.getElementById("registerForm").addEventListener("submit", function(e) {
        e.preventDefault();

        alert("Registration will be connected to the CheryChat backend next.");

    });
</script>

</body>
</html>
