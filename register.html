<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | CheryChat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#24103d 0%,#0d0618 45%,#07030f 100%);
    color:#fff;
    font-family:'Poppins',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px;
}

.container{
    width:100%;
    max-width:450px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:65px;
    height:65px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ffd54a,#ff9d00);
    color:#17091f;
    font-size:30px;
    box-shadow:0 10px 35px rgba(255,180,0,.25);
}

.logo h1{
    margin-top:12px;
    font-size:28px;
    color:#ffd54a;
}

.logo p{
    margin-top:4px;
    color:#aaa;
    font-size:13px;
}

.card{
    background:rgba(18,10,34,.96);
    border:1px solid rgba(255,213,74,.15);
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.card h2{
    text-align:center;
    font-size:22px;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#999;
    font-size:13px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:13px;
    color:#ddd;
    margin-bottom:7px;
}

.input-box{
    position:relative;
}

.input-box i.left-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#a98935;
    font-size:14px;
}

.input-box input{
    width:100%;
    height:50px;
    border-radius:13px;
    border:1px solid #30223d;
    background:#0e0818;
    color:#fff;
    outline:none;
    padding:0 45px 0 42px;
    font-family:'Poppins',sans-serif;
    font-size:14px;
    transition:.2s;
}

.input-box input:focus{
    border-color:#ffd54a;
    box-shadow:0 0 0 3px rgba(255,213,74,.08);
}

.toggle-password{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#999;
    cursor:pointer;
    font-size:15px;
    padding:5px;
}

.toggle-password:hover{
    color:#ffd54a;
}

.password-status{
    font-size:11px;
    margin-top:6px;
    min-height:16px;
}

.terms{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin:17px 0;
    font-size:12px;
    color:#999;
    line-height:1.5;
}

.terms input{
    margin-top:3px;
    accent-color:#ffd54a;
}

.terms a{
    color:#ffd54a;
    text-decoration:none;
}

button.submit-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#ffd54a,#ff9d00);
    color:#16091d;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

button.submit-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(255,174,0,.2);
}

button.submit-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    text-align:center;
    margin-top:15px;
    padding:11px;
    border-radius:10px;
    font-size:12px;
}

.message.error{
    display:block;
    background:rgba(255,70,70,.1);
    color:#ff7777;
    border:1px solid rgba(255,70,70,.2);
}

.message.success{
    display:block;
    background:rgba(70,220,130,.1);
    color:#65e89a;
    border:1px solid rgba(70,220,130,.2);
}

.login-link{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:#999;
}

.login-link a{
    color:#ffd54a;
    text-decoration:none;
    font-weight:600;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:11px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-comments"></i>
        </div>

        <h1>CheryChat</h1>

        <p>Connect. Chat. Share.</p>

    </div>


    <div class="card">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join CheryChat and start connecting
        </p>


        <form id="registerForm">

            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-user left-icon"></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope left-icon"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-phone left-icon"></i>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock left-icon"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        <i class="fa-solid fa-eye" id="passwordEye"></i>
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock left-icon"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="confirmPasswordToggle"
                        aria-label="Show confirm password"
                    >
                        <i
                            class="fa-solid fa-eye"
                            id="confirmPasswordEye"
                        ></i>
                    </button>

                </div>

                <div
                    class="password-status"
                    id="passwordStatus"
                ></div>

            </div>


            <!-- TERMS -->

            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the
                    <a href="#" onclick="return false;">
                        Terms & Conditions
                    </a>
                    and Privacy Policy.
                </span>

            </label>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Create Account
            </button>


            <div
                class="message"
                id="message"
            ></div>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Log in
            </a>

        </div>

    </div>


    <div class="footer">
        © 2026 CheryChat. All rights reserved.
    </div>

</div>


<script>

/* YOUR REAL CHERYCHAT BACKEND */

const API_URL =
    "https://cherychat-backend.onrender.com";


/* ELEMENTS */

const registerForm =
    document.getElementById("registerForm");

const fullName =
    document.getElementById("fullName");

const email =
    document.getElementById("email");

const phone =
    document.getElementById("phone");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const passwordStatus =
    document.getElementById("passwordStatus");

const message =
    document.getElementById("message");

const submitBtn =
    document.getElementById("submitBtn");


/* PASSWORD TOGGLE */

document
    .getElementById("passwordToggle")
    .addEventListener("click", function(){

        if(password.type === "password"){

            password.type = "text";

            document
                .getElementById("passwordEye")
                .classList
                .remove("fa-eye");

            document
                .getElementById("passwordEye")
                .classList
                .add("fa-eye-slash");

            this.setAttribute(
                "aria-label",
                "Hide password"
            );

        }else{

            password.type = "password";

            document
                .getElementById("passwordEye")
                .classList
                .remove("fa-eye-slash");

            document
                .getElementById("passwordEye")
                .classList
                .add("fa-eye");

            this.setAttribute(
                "aria-label",
                "Show password"
            );
        }

    });


/* CONFIRM PASSWORD TOGGLE */

document
    .getElementById("confirmPasswordToggle")
    .addEventListener("click", function(){

        if(confirmPassword.type === "password"){

            confirmPassword.type = "text";

            document
                .getElementById("confirmPasswordEye")
                .classList
                .remove("fa-eye");

            document
                .getElementById("confirmPasswordEye")
                .classList
                .add("fa-eye-slash");

            this.setAttribute(
                "aria-label",
                "Hide confirm password"
            );

        }else{

            confirmPassword.type = "password";

            document
                .getElementById("confirmPasswordEye")
                .classList
                .remove("fa-eye-slash");

            document
                .getElementById("confirmPasswordEye")
                .classList
                .add("fa-eye");

            this.setAttribute(
                "aria-label",
                "Show confirm password"
            );
        }

    });


/* PASSWORD MATCH */

function checkPasswords(){

    if(confirmPassword.value === ""){

        passwordStatus.textContent = "";

        return;
    }

    if(password.value === confirmPassword.value){

        passwordStatus.textContent =
            "Passwords match";

        passwordStatus.style.color =
            "#65e89a";

    }else{

        passwordStatus.textContent =
            "Passwords do not match";

        passwordStatus.style.color =
            "#ff7777";
    }

}

password.addEventListener(
    "input",
    checkPasswords
);

confirmPassword.addEventListener(
    "input",
    checkPasswords
);


/* REGISTRATION */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        message.className = "message";
        message.textContent = "";

        const name =
            fullName.value.trim();

        const userEmail =
            email.value.trim().toLowerCase();

        const userPhone =
            phone.value.trim();

        const pass =
            password.value;

        const confirmPass =
            confirmPassword.value;


        /* CHECK PASSWORD */

        if(pass.length < 6){

            message.className =
                "message error";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        /* CHECK CONFIRM PASSWORD */

        if(pass !== confirmPass){

            message.className =
                "message error";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        /* DISABLE BUTTON */

        submitBtn.disabled = true;

        submitBtn.textContent =
            "Creating Account...";


        try{

            const response =
                await fetch(
                    `${API_URL}/api/register`,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            fullName:name,

                            email:userEmail,

                            phone:userPhone,

                            password:pass

                        })
                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Unable to create account."
                );

            }


            /* SUCCESS */

            message.className =
                "message success";

            message.textContent =
                "Account created successfully. Redirecting to login...";


            registerForm.reset();

            passwordStatus.textContent = "";


            setTimeout(function(){

                window.location.href =
                    "login.html";

            },1500);


        }catch(error){

            console.error(
                "Registration error:",
                error
            );

            message.className =
                "message error";

            message.textContent =
                error.message ||
                "Unable to connect to CheryChat server.";

            submitBtn.disabled = false;

            submitBtn.textContent =
                "Create Account";

        }

    }
);

</script>

</body>
</html>
